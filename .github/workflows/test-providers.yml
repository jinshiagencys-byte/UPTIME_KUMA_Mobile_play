name: Test providers LLM

# À placer dans .github/workflows/test-providers.yml
# Lancement manuel uniquement : Actions -> "Test providers LLM" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Fournisseurs à tester, séparés par des virgules (vide = tous). Ex: mistral,nvidia"
        required: false
        type: string
      list_models:
        description: "Lister les modèles disponibles au lieu de tester"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer openai
        run: pip install --quiet openai

      - name: Tester les fournisseurs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          AIONLABS_API_KEY: ${{ secrets.AIONLABS_API_KEY }}
          # Kilo et AionLabs : endpoints/modèles à renseigner (variables du repo)
          # KILO_BASE_URL: ${{ vars.KILO_BASE_URL }}
          # KILO_MODEL: ${{ vars.KILO_MODEL }}
          # AIONLABS_BASE_URL: ${{ vars.AIONLABS_BASE_URL }}
          # AIONLABS_MODEL: ${{ vars.AIONLABS_MODEL }}
          ONLY: ${{ github.event.inputs.only }}
          LIST_MODELS: ${{ github.event.inputs.list_models }}
        run: |
          set -uo pipefail
          ARGS=""
          if [ -n "${ONLY:-}" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "${LIST_MODELS:-false}" = "true" ]; then ARGS="$ARGS --list-models"; fi
          python test_providers.py $ARGS

      - name: Uploader le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: providers-report
          path: providers_report.json
          if-no-files-found: ignore
          retention-days: 3
