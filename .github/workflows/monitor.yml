name: Hermes Agent - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'ID du site à tester spécifiquement (optionnel)'
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      # Job inchangé par rapport au workflow OpenClaw : la découverte des sites/pages
      # via kuma-relay ne dépend pas de l'agent utilisé pour la vérification.
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          SITE_ID="$SITE_ID_INPUT"

          if [ -n "$SITE_ID" ]; then
            echo "🔍 Test ciblé sur le site $SITE_ID"
            DETAIL=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors/$SITE_ID")

            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')

            if [ -z "$MONITOR" ] || [ "$MONITOR" == "null" ]; then
              echo "❌ Site $SITE_ID introuvable ou erreur relay"
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MONITORS=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')

            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            RAW=$(curl -s https://kuma-relay.up.railway.app/active-sites)
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "")

            if [ -z "$SITES_RAW" ] || [ "$SITES_RAW" == "null" ]; then
              echo "⚠️ Réponse Supabase/relay illisible ou vide — aucun test ne sera lancé"
              SITES_RAW="[]"
            fi

            if [ "$SITES_RAW" == "[]" ]; then
              echo "ℹ️ Aucun site actif trouvé sur Supabase — aucun run de vérification ce cycle"
            fi

            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              sid=$(echo "$site" | jq -r '.id')
              all=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
              pages=$(echo "$all" | jq -c --arg sid "$sid" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')
              site_with_pages=$(echo "$site" | jq -c --argjson pages "$pages" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$site_with_pages" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]?')"
            SITES="$SITES_ARRAY"
          fi

          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "📡 Sites à monitorer: $SITES"

  hermes-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    # 🛠️ NOUVEAU : déclaré au niveau du job pour que TOUTES les étapes (hermes
    # doctor, hermes -z) voient l'endpoint CDP lancé par le step dédié ci-dessous.
    # Hermes n'expose le tool browser-cdp que si un endpoint est joignable au
    # démarrage de session — son absence est affichée à tort comme « system
    # dependency not met » (issue #25753).
    env:
      BROWSER_CDP_URL: http://127.0.0.1:9222
    concurrency:
      group: hermes-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 🛠️ SIMPLIFICATION vs OpenClaw : plus besoin d'installer Node.js à la main,
      # l'installeur Hermes gère lui-même Python/Node/ffmpeg/Playwright.
      # (--skip-computer-use a été retiré et l'hypothèse associée a été
      # INVALIDÉE par un run réel : le dossier recordings n'apparaissait pas
      # plus avec le module Computer Use installé.)
      - name: Installer Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          source ~/.bashrc || true
          hermes --version
          hermes doctor || echo "⚠️ hermes doctor a signalé des avertissements (voir logs) — non bloquant"

      # 🛠️ NOUVEAU — cause racine identifiée : « browser-cdp ⚠ system dependency
      # not met » ne signifie PAS qu'il manque une lib système, mais qu'aucun
      # endpoint CDP n'est joignable au démarrage de session (label trompeur,
      # issue #25753). Aucune des hypothèses précédentes (auto_prune,
      # --skip-computer-use, schéma config) ne pouvait créer un tel endpoint.
      # On en crée un ICI, avant tout appel Hermes, et on vérifie par curl.
      - name: Lancer Chromium avec endpoint CDP
        run: |
          set -e

          # Chrome stable est préinstallé sur les runners ubuntu-latest ;
          # chromium-browser est un paquet-snap sur 22.04+, capricieux en CI.
          CHROME_BIN=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME_BIN="$candidate"
              break
            fi
          done
          if [ -z "$CHROME_BIN" ]; then
            echo "Aucun navigateur détecté, installation apt…"
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
            CHROME_BIN="$(command -v chromium-browser || command -v chromium || true)"
          fi
          if [ -z "$CHROME_BIN" ]; then
            echo "❌ Aucun navigateur Chromium-family disponible sur le runner"
            exit 1
          fi
          echo "🌐 Navigateur : $CHROME_BIN ($("$CHROME_BIN" --version))"

          # ⚠️ Profil DÉDIÉ obligatoire : sur les Chrome récents,
          # --remote-debugging-port est silencieusement IGNORÉ avec le profil
          # par défaut — LE piège classique qui fait croire à un bug CDP.
          # La doc Hermes recommande explicitement un profil séparé.
          mkdir -p "$HOME/.hermes/chrome-debug"

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --remote-debugging-port=9222 \
            --user-data-dir="$HOME/.hermes/chrome-debug" \
            --window-size=1280,800 \
            --no-first-run \
            --no-default-browser-check \
            about:blank > /tmp/chromium.log 2>&1 &

          # Attente active 30 s max, puis échec DUR : fini les runs « tout
          # silencieux » — si CDP ne monte pas, le job plante ICI avec le log.
          CDP_OK=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9222/json/version > /tmp/cdp-version.json 2>/dev/null; then
              CDP_OK=1
              break
            fi
            sleep 1
          done
          if [ "$CDP_OK" != "1" ]; then
            echo "❌ Endpoint CDP jamais monté sur 127.0.0.1:9222 — log Chromium :"
            cat /tmp/chromium.log || true
            exit 1
          fi
          echo "✅ Endpoint CDP opérationnel :"
          cat /tmp/cdp-version.json

          # 🛠️ Issue #15952 : sur certaines versions (dont possiblement 0.21.2),
          # le check browser-cdp exige agent-browser MÊME avec cdp_url configuré.
          # Installation best-effort — si le paquet n'existe pas, non bloquant :
          # le grep doctor à l'étape suivante dira si c'était nécessaire.
          npm install -g agent-browser >/dev/null 2>&1 \
            || echo "ℹ️ agent-browser non installé via npm (non bloquant)"

      # 🎥 Remplace tout le pipeline rrweb/ffmpeg d'OpenClaw : Hermes enregistre
      # nativement la session navigateur en WebM (browser.record_sessions: true),
      # démarre au premier browser_navigate et sauvegarde dans
      # ~/.hermes/browser_recordings/ à la fermeture de la session. Fonctionne en
      # local ET en cloud (Browserbase), et ne dépend pas d'un curseur/souris
      # simulé côté page comme le nécessitait rrweb.
      - name: Configurer Hermes (config.yaml + credentials)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          mkdir -p ~/.hermes

          # 🛠️ Hugging Face attend HF_TOKEN, pas HF_API_KEY (erreur confirmée :
          # "No usable credentials found for provider 'huggingface'. Set
          # HF_TOKEN."). Le secret GitHub reste nommé HF_API_KEY, on l'expose
          # aussi sous le nom que Hermes attend.
          cat > ~/.hermes/.env << EOF
          MISTRAL_API_KEY=${MISTRAL_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}
          HF_TOKEN=${HF_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          EOF

          # 🛠️ RÈGLE DE LA MAISON (confirmée par un run réel cassé) : AUCUN
          # commentaire shell entre l'ouverture du heredoc et son EOF de
          # fermeture — un patch précédent avait avalé tout le reste du script.
          #
          # 🛠️ MODIFIÉ : ajout de browser.cdp_url pointant vers le Chromium
          # lancé par le step précédent. C'est LA clé qui fait passer le check
          # browser-cdp de ⚠ à ✓ (avec BROWSER_CDP_URL en filet au niveau job).
          # browser.record_sessions/cloud_provider ont survécu intactes à la
          # migration v0→v44 (confirmé par doctor --fix), elles n'étaient pas
          # le problème — l'absence d'endpoint CDP si.
          cat > ~/.hermes/config.yaml << 'EOF'
          browser:
            enabled: true
            cloud_provider: local
            record_sessions: true
            cdp_url: http://127.0.0.1:9222

          display:
            tool_progress: "off"

          sessions:
            auto_prune: false

          model:
            provider: openrouter
            default: openrouter/free

          custom_providers:
            - name: mistral
              base_url: https://api.mistral.ai/v1
              key_env: MISTRAL_API_KEY
          EOF

          hermes doctor

          # Migration automatique du schéma si obsolète (v0 → v44), non bloquante.
          hermes doctor --fix || echo "⚠️ hermes doctor --fix a échoué ou n'a rien eu à corriger — non bloquant"
          echo "--- config.yaml après migration éventuelle ---"
          cat ~/.hermes/config.yaml

          # 🛠️ NOUVEAU : réponse IMMÉDIATE dans les logs à la question qui
          # bloque depuis plusieurs runs — browser-cdp est-il enfin ✓ ?
          echo "--- État de browser-cdp avec l'endpoint CDP actif ---"
          hermes doctor 2>&1 | grep -i -A1 "browser-cdp" \
            || echo "(browser-cdp absent de la sortie doctor)"

      - name: Générer la tâche
        env:
          PAGES_JSON: ${{ toJson(matrix.site.pages) }}
          SITE_URL: ${{ matrix.site.url }}
        run: |
          PAGES_LIST=$(echo "$PAGES_JSON" | jq -c . | jq -r '[.[]? | .url] | join("\n")')

          # Tâche identique à celle du workflow OpenClaw : le contenu métier de la
          # vérification (détection backend en panne, parcours e-commerce/auth/
          # contact/recherche, verdict JSON final) ne change pas avec le pivot
          # d'agent — seul le mécanisme d'exécution et d'enregistrement change.
          cat > task.md << EOF
          Va sur $SITE_URL avec l'outil de navigateur. Explore comme un
          humain (scroll, structure) et détecte le type de site.

          VÉRIFICATION CRITIQUE avant tout le reste : le contenu affiché
          correspond-il vraiment au site attendu, ou est-ce une page par
          défaut d'hébergeur/registrar (ex: "o2switch", "It works!", page de
          parking de domaine, message DNS/SSL non configuré) ? Si le frontend
          affiche des sections censées recevoir des données du backend
          (liste de produits, résultats, profil, prix, etc.) mais qu'elles
          restent vides, bloquées en chargement, ou affichent une erreur/
          "undefined"/"null" à la place des vraies données, c'est un backend
          en panne : DOWN, même si la page HTTP répond 200.

          PAGES À VÉRIFIER OBLIGATOIREMENT :
          $PAGES_LIST

          Choisis 2-3 actions à tester selon le type détecté :
          - E-commerce : ajoute un produit au panier, VÉRIFIE qu'il apparaît
            bien dans le panier (nom/qté/prix) — ces données viennent du
            backend, vérifie qu'elles sont réelles et pas un état vide/figé.
          - Compte utilisateur : inscris-toi avec des données fictives
            (test+ci-<horodatage>@example.com), puis connecte-toi avec ces
            identifiants. Si compte existant seulement, teste juste qu'un
            login invalide donne une erreur propre (pas de vraie connexion).
          - Formulaire de contact : soumets-le en indiquant "TEST AUTOMATISÉ"
            dans le message.
          - Recherche : vérifie que des résultats s'affichent réellement.
          - Sinon : les 2-3 actions les plus représentatives du site.

          Pour chaque page listée, vérifie au minimum qu'elle répond correctement
          (HTTP 200, contenu attendu). Explore aussi les liens internes pour
          détecter d'éventuelles pages non listées et signale-les dans le JSON
          final. Toute nouvelle URL atteinte = une page distincte à noter.

          Termine par ton verdict en langage naturel (type de site + parcours
          testés, en précisant si le contenu venait bien du backend ou si
          c'était un placeholder/backend en panne), puis ce bloc JSON exact
          en toute fin (rien d'autre dedans) :

          \`\`\`json
          {
            "overall_status": "UP",
            "site_type": "ecommerce",
            "pages": [
              {
                "url": "URL exacte",
                "status": "UP",
                "http_code": 200,
                "action_tested": "action testée ou null",
                "note": "explication en une sentence"
              }
            ]
          }
          \`\`\`
          Règles : status/overall_status = "UP" ou "DOWN" uniquement.
          site_type = ecommerce|auth|vitrine|blog|autre. Une entrée par page
          visitée (départ + chaque URL distincte, y compris erreurs/404). Un
          parcours métier qui échoue (panier vide après ajout, recherche sans
          résultat, form qui ne soumet rien) = DOWN même si HTTP 200. Une page
          par défaut d'hébergeur ou des données backend manquantes/vides
          alors qu'elles sont attendues = DOWN même si HTTP 200.
          EOF

      # `hermes -z` est un exec one-shot : un appel = une vérification complète.
      - name: Lancer Hermes Agent (avec repli multi-providers)
        id: agent_run
        run: |
          set +e

          TASK_CONTENT=$(cat task.md)

          mkdir -p recordings

          run_agent() {
            local provider=$1
            local model=$2
            local label=$3
            echo "======================================"
            echo "Test avec $provider/$model pour ${{ matrix.site.url }}"
            echo "======================================"

            # -m et --provider sont deux flags distincts : --provider sélectionne
            # le provider défini dans config.yaml, -m prend l'ID brut listé dans
            # ses models: [...] (pas de préfixe provider/).
            # 🛠️ Toolset "browser,browser-cdp,terminal" : demander explicitement
            # browser-cdp maintenant qu'un endpoint existe (BROWSER_CDP_URL +
            # cdp_url config) — si un problème de dépendance subsiste, on aura
            # enfin une erreur explicite au lieu du silence.
            hermes -z "$TASK_CONTENT" \
              --provider "$provider" \
              -m "$model" \
              -t "browser,browser-cdp,terminal" \
              --yolo \
              > "output-${label}.json" 2>&1

            echo "exit_code=$?"

            # Détection du cas « verdict complet mais JSON final tronqué » :
            # l'agent a terminé sa vérification mais n'a jamais imprimé le bloc
            # JSON (réponse coupée). Signalé distinctement dans les logs pour ne
            # pas confondre avec un échec d'API.
            if ! grep -qiE '"overall_status"\s*:\s*"(up|down)"' "output-${label}.json" \
               && grep -qiE 'bloc json|json (ci-dessus|généré|generated above)' "output-${label}.json"; then
              echo "⚠️ ${label} : l'agent a terminé sa vérification (voir texte) mais n'a jamais imprimé le bloc JSON final — réponse probablement tronquée. Ce run sera compté comme échec faute de JSON exploitable, mais consultez output-${label}.json pour le résumé texte."
            fi

            # Copier la vidéo de CETTE tentative précise, avant qu'elle ne se
            # retrouve mélangée avec celle d'une autre tentative. Hermes
            # finalise l'enregistrement à la fermeture de la session, donc au
            # moment où `hermes -z ...` rend la main, le fichier est écrit.
            latest_webm=$(ls -t ~/.hermes/browser_recordings/*.webm 2>/dev/null | head -n1)
            if [ -n "$latest_webm" ]; then
              cp -v "$latest_webm" "recordings/${label}.webm"
            else
              echo "ℹ️ Aucune vidéo trouvée pour la tentative ${label}"
              # Diagnostic : dossier absent = Hermes n'essaie pas du tout
              # d'enregistrer ; dossier présent mais vide = il essaie mais
              # échoue silencieusement (cause différente à chercher).
              if [ -d ~/.hermes/browser_recordings ]; then
                echo "   (le dossier ~/.hermes/browser_recordings existe mais est vide — Hermes tente d'enregistrer mais échoue)"
                ls -la ~/.hermes/browser_recordings/ || true
              else
                echo "   (le dossier ~/.hermes/browser_recordings n'existe pas du tout — Hermes n'a jamais tenté d'enregistrer)"
              fi
            fi
          }

          is_success() {
            # Un verdict DOWN est un résultat aussi valide qu'un UP : un run est
            # un succès dès qu'un bloc ```json avec overall_status (UP ou DOWN)
            # est présent — sinon la boucle écrase un bon résultat par l'échec
            # 429 d'un provider suivant.
            grep -qiE '"overall_status"\s*:\s*"(up|down)"' "$1"
          }

          echo "======================================"
          echo "🔁 Chaîne de repli OpenRouter (modèles gratuits)"
          echo "======================================"
          for OR_MODEL in \
            "poolside/laguna-s-2.1:free" \
            "inclusionai/ling-3.0-flash-fin:free" \
            "thinkingmachines/inkling:free" \
            "openrouter/free"; do
            label="openrouter-$(echo "$OR_MODEL" | tr '/:' '--')"
            run_agent "openrouter" "$OR_MODEL" "$label"
            cp "output-${label}.json" output.json
            if is_success output.json; then
              echo "✅ Succès avec OpenRouter ($OR_MODEL)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              echo "winning_label=${label}" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "======================================"
          echo "🔁 Fallback sur Mistral / Gemini / HuggingFace"
          echo "======================================"
          # Séparateur '|' car les noms provider/model contiennent déjà des ':'.
          # custom:mistral passe par custom_providers: (Mistral n'est pas un
          # provider intégré), Google s'appelle "gemini".
          for PAIR in "custom:mistral|mistral-small-latest" "gemini|gemini-3.1-pro-preview" "huggingface|openai/gpt-oss-120b:cerebras"; do
            provider="${PAIR%%|*}"
            model="${PAIR#*|}"
            label="$(echo "${provider}-${model}" | tr '/:' '--')"
            run_agent "$provider" "$model" "$label"
            cp "output-${label}.json" output.json
            if is_success output.json; then
              echo "✅ Succès avec $provider/$model"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              echo "winning_label=${label}" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "======================================"
          echo "🔁 Dernier recours : NVIDIA NIM"
          echo "======================================"
          run_agent "nvidia" "moonshotai/kimi-k3" "nvidia1"
          cp "output-nvidia1.json" output.json
          if is_success output.json; then
            echo "✅ Succès avec NVIDIA (moonshotai/kimi-k3)"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            echo "winning_label=nvidia1" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Échec final après tous les providers"
          echo "agent_failed=true" >> $GITHUB_OUTPUT

      - name: Extraire et envoyer le résultat
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
            PAGES_JSON=""
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
            PAGES_JSON=""
          else
            # Hermes ne sort que du texte brut (verdict + bloc ```json final) —
            # pas d'enveloppe JSON structurée, donc pas de jq ici (le jq .text
            # hérité d'OpenClaw tuait tout le step en exit 5 avec pipefail).
            AGENT_TEXT=$(cat output.json)
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ { capture=1; buf=""; next }
              /```/ { if (capture) { last=buf; capture=0 } ; next }
              capture { buf = buf $0 "\n" }
              END { printf "%s", last }
            ')

            if echo "$PAGES_JSON" | jq -e '.overall_status and .pages' > /dev/null 2>&1; then
              # Normalisation en MAJUSCULES : la contrainte CHECK SQL côté relay
              # n'accepte que UP/DOWN/ERROR/UNKNOWN en majuscules.
              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status // "UNKNOWN"' | tr '[:lower:]' '[:upper:]')
              SITE_TYPE=$(echo "$PAGES_JSON" | jq -r '.site_type // "non détecté"')
              PAGES_JSON=$(echo "$PAGES_JSON" | jq -c '.pages |= map(.status |= (if . then ascii_upcase else "UNKNOWN" end))')
              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')
              echo "$PAGES_JSON" > pages.json
              echo "🏷️ Type de site détecté : $SITE_TYPE"
              echo "📄 $(echo "$PAGES_JSON" | jq '.pages | length') page(s) rapportée(s) :"
              echo "$PAGES_JSON" | jq -r '.pages[] | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.action_tested // "navigation simple") — \(.note // "")"'
            else
              echo "⚠️ Bloc JSON structuré introuvable, repli sur extraction texte"
              if echo "$AGENT_TEXT" | grep -qi "up"; then
                STATUS="UP"
                REASON="Site appears operational (extracted from text)"
              elif echo "$AGENT_TEXT" | grep -qi "down"; then
                STATUS="DOWN"
                REASON="Site appears down (extracted from text)"
              else
                STATUS="UNKNOWN"
                REASON="No status indicator found in output"
              fi
              PAGES_JSON=""
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          if [ -n "$PAGES_JSON" ] && echo "$PAGES_JSON" | jq -e '.pages' > /dev/null 2>&1; then
            echo "📤 Envoi du rapport pages à /pages-report"
            echo "$PAGES_JSON" | jq -c '{pages: .pages}' | \
            curl -X POST "https://kuma-relay.up.railway.app/sites/${SITE_ID}/pages-report" \
              -H "x-relay-secret: $RELAY_SECRET" \
              -H "Content-Type: application/json" \
              -d @- \
              || echo "⚠️ Envoi pages-report échoué"
          else
            echo "ℹ️ Aucun rapport pages structuré à envoyer"
          fi

          jq -n --arg status "$STATUS" --arg message "$REASON" '{status: $status, message: $message}' | \
          curl -X POST "https://kuma-relay.up.railway.app/sites/${SITE_ID}/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "⚠️ Envoi mark-crawled échoué"

      # 🛠️ NOUVEAU : élargit la collecte au cas où la doc mentirait sur le
      # chemin des enregistrements. Si un .webm/.mp4 existe quelque part sous
      # ~/.hermes, ce find le trouvera — sinon, on aura la preuve définitive
      # que l'enregistreur ne produit rien même avec un endpoint CDP ✓.
      - name: Collecter les enregistrements bruts Hermes
        if: always()
        run: |
          echo "--- ~/.hermes/browser_recordings ---"
          ls -la ~/.hermes/browser_recordings/ 2>/dev/null || echo "(dossier inexistant)"

          echo "--- Tous fichiers vidéo trouvés sous ~/.hermes ---"
          find "$HOME/.hermes" -type f \( -name '*.webm' -o -name '*.mp4' -o -name '*.mkv' \) \
            -printf '%p %s bytes\n' 2>/dev/null | head -50 || true

          # Preuve que Hermes est bien passé par NOTRE Chromium : les tabs
          # ouverts via CDP apparaissent dans /json/list.
          echo "--- Tabs CDP restants ---"
          curl -s --max-time 5 http://127.0.0.1:9222/json/list | head -40 || true

          mkdir -p hermes-raw
          cp -r ~/.hermes/browser_recordings/* hermes-raw/ 2>/dev/null || true
          cp -v /tmp/chromium.log hermes-raw/ 2>/dev/null || true
          cp -v /tmp/cdp-version.json hermes-raw/ 2>/dev/null || true
          cp -v ~/.hermes/config.yaml hermes-raw/ 2>/dev/null || true

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.site.id }}
          path: |
            output*.json
            pages.json
            recordings/*.webm
            hermes-raw/**
