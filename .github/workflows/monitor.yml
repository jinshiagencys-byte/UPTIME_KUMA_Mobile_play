````yaml
name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}

    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (fichier minimal)
        run: |
          mkdir -p ~/.openclaw

          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "openrouter": {
                  "api": "openai-completions",
                  "baseUrl": "https://openrouter.ai/api/v1",
                  "models": [
                    {
                      "id": "minimax/minimax-m3:free",
                      "name": "minimax/minimax-m3:free"
                    },
                    {
                      "id": "z-ai/glm-5.2:free",
                      "name": "z-ai/glm-5.2:free"
                    }
                  ]
                }
              }
            }
          }
          EOF

          echo "======================================"
          echo "Configuration OpenClaw / OpenRouter"
          echo "======================================"

          cat ~/.openclaw/openclaw.json

          echo "======================================"
          echo "Enregistrement de la clé OpenRouter"
          echo "======================================"

          printf "%s\n" "$OPENROUTER_API_KEY" | \
            ~/.npm-global/bin/openclaw models auth paste-api-key \
            --provider openrouter || \
            echo "⚠️ Échec enregistrement clé OpenRouter"

          echo "======================================"
          echo "Configuration du modèle principal"
          echo "======================================"

          ~/.npm-global/bin/openclaw models set \
            openrouter/minimax/minimax-m3:free || true

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.

          1. Explore le site comme un humain : scroll, observe la structure.

          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.

          3. Teste chacune de ces actions et vérifie le résultat attendu.

          4. Si une action t'amène sur une NOUVELLE URL (navigation, clic sur un
             lien, soumission de formulaire, etc.), traite cette URL comme une
             page à part entière à surveiller : note son statut individuellement,
             pas seulement l'action qui y a mené.

          5. Si erreur JS, page blanche, ou action qui ne fait rien, prends une
             capture d'écran et note-le.

          6. Termine ta réponse par TON VERDICT EN LANGAGE NATUREL COMME AVANT,
             puis ajoute IMPÉRATIVEMENT à la toute fin, dans un bloc de code
             ```json, un objet structuré au format EXACT suivant (rien d'autre
             dans ce bloc, pas de commentaire) :

          ```json
          {
            "overall_status": "UP",
            "pages": [
              {
                "url": "URL exacte visitée",
                "status": "UP",
                "http_code": 200,
                "note": "brève explication en une phrase"
              }
            ]
          }
          ```

          - "overall_status" et chaque "status" de page valent uniquement
            "UP" ou "DOWN" (majuscules, rien d'autre).

          - Inclus une entrée "pages" pour l'URL de départ ET pour chaque
            URL distincte atteinte pendant l'exploration (y compris les
            404 ou erreurs).

          - "http_code" est le code HTTP observé si tu as pu le déterminer,
            sinon null.
          EOF

      - name: Lancer OpenClaw (avec Gateway persistent)
        id: agent_run
        run: |
          set +e

          # Liste des modèles OpenRouter gratuits à essayer, dans l'ordre.
          # Les IDs correspondent aux modèles OpenRouter actuellement
          # référencés avec le suffixe :free.
          OPENROUTER_FALLBACK_MODELS=(
            "openrouter/minimax/minimax-m3:free"
            "openrouter/z-ai/glm-5.2:free"
          )

          # Fonction pour démarrer le Gateway avec vérification.
          # Appelée UNE SEULE FOIS pour tout le job : changer de modèle entre
          # tentatives ne nécessite pas de redémarrage.
          start_gateway() {
            echo "🔧 Démarrage du Gateway..."

            ~/.npm-global/bin/openclaw gateway stop 2>/dev/null || true

            pkill -f "openclaw gateway" || true

            sleep 3

            nohup ~/.npm-global/bin/openclaw gateway \
              --force \
              --port 18789 \
              --allow-unconfigured \
              > gateway.log 2>&1 &

            echo "⏳ Attente du Gateway (30s)..."

            sleep 30

            if ~/.npm-global/bin/openclaw gateway status 2>&1 | grep -q "running"; then
              echo "✅ Gateway opérationnel"
              return 0
            else
              echo "❌ Gateway non disponible"
              cat gateway.log
              return 1
            fi
          }

          # Fonction pour exécuter l'agent avec un modèle donné.
          # Ne touche jamais au Gateway — seulement au modèle par défaut.
          run_agent() {
            local model=$1
            local session_suffix=$2

            echo "======================================"
            echo "Test avec $model pour ${{ matrix.site.url }}"
            echo "======================================"

            ~/.npm-global/bin/openclaw models set "$model" || true

            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}-$session_suffix" \
              --message-file task.md \
              --json > output.json 2>&1

            cat output.json
          }

          is_success() {
            local status

            status=$(jq -r \
              '[.. | .status? // empty] |
               map(select(type == "string")) |
               first // empty' \
              "$1" 2>/dev/null)

            echo "$status" | grep -qiE '^(up|ok)$'
          }

          # Erreur indiquant que le Gateway est réellement inaccessible.
          gateway_actually_down() {
            grep -qi \
              "ECONNREFUSED\|gateway not reachable\|gateway may still be running" \
              "$1"
          }

          # Erreur d'authentification OpenRouter.
          auth_error() {
            grep -qi \
              "401\|unauthorized\|authentication\|invalid api key\|no api key" \
              "$1"
          }

          # Rate limit / quota.
          rate_limit() {
            grep -qi \
              "429\|rate limit\|too many requests\|quota\|resource exhausted" \
              "$1"
          }

          # Modèle indisponible.
          model_not_found() {
            grep -qi \
              "model was not found\|model_not_found\|model.*not.*found\|unknown model" \
              "$1"
          }

          # Démarrage unique du Gateway pour tout le job.
          start_gateway || true

          # ============================================================
          # ESSAI 1 : MINIMAX M3 FREE
          # ============================================================

          run_agent \
            "openrouter/minimax/minimax-m3:free" \
            "minimax1"

          if is_success output.json; then
            echo "✅ Succès avec MiniMax M3"
            echo "agent_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ============================================================
          # GATEWAY INJOIGNABLE
          # ============================================================

          if gateway_actually_down output.json; then

            echo "🔄 Gateway injoignable, redémarrage..."

            start_gateway || true

            run_agent \
              "openrouter/minimax/minimax-m3:free" \
              "minimax2"

            if is_success output.json; then
              echo "✅ Succès avec MiniMax M3 (2e tentative)"
              echo "agent_failed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

          elif rate_limit output.json; then

            echo "⚠️ Rate limit détecté, nouvelle tentative dans 30s..."

            sleep 30

            run_agent \
              "openrouter/minimax/minimax-m3:free" \
              "minimax2"

            if is_success output.json; then
              echo "✅ Succès avec MiniMax M3 (2e tentative)"
              echo "agent_failed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ============================================================
          # FALLBACK OPENROUTER
          # ============================================================

          openrouter_success=false
          attempt_num=1

          for model in "${OPENROUTER_FALLBACK_MODELS[@]}"; do

            echo "======================================"
            echo "🔁 Fallback OpenRouter ($attempt_num/${#OPENROUTER_FALLBACK_MODELS[@]})"
            echo "Modèle : $model"
            echo "======================================"

            # Le premier modèle a déjà été testé.
            if [ "$model" = "openrouter/minimax/minimax-m3:free" ] && [ "$attempt_num" -eq 1 ]; then
              attempt_num=$((attempt_num + 1))
              continue
            fi

            run_agent \
              "$model" \
              "fallback$attempt_num"

            if is_success output.json; then

              echo "✅ Succès avec $model"

              openrouter_success=true

              break

            fi

            if auth_error output.json; then

              echo "🛑 Erreur d'authentification OpenRouter."

              break

            elif model_not_found output.json; then

              echo "⚠️ $model introuvable côté OpenRouter."

              echo "➡️ Passage au modèle suivant."

            elif rate_limit output.json; then

              echo "⚠️ Rate limit sur $model."

              echo "➡️ Passage au modèle suivant après 15s."

              sleep 15

            elif gateway_actually_down output.json; then

              echo "🔄 Gateway injoignable."

              start_gateway || true

            else

              echo "⚠️ Échec avec $model."

              echo "➡️ Passage au modèle suivant."
            fi

            attempt_num=$((attempt_num + 1))

            if [ $attempt_num -le ${#OPENROUTER_FALLBACK_MODELS[@]} ]; then
              sleep 8
            fi

          done

          if [ "$openrouter_success" = true ]; then

            echo "agent_failed=false" >> "$GITHUB_OUTPUT"

          else

            echo "❌ Échec final : aucun modèle OpenRouter gratuit n'a fonctionné"

            echo "agent_failed=true" >> "$GITHUB_OUTPUT"

          fi

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat
        if: always()
        run: |

          if [ ! -f output.json ] || [ ! -s output.json ]; then

            STATUS="ERROR"
            REASON="Agent output missing or empty"

          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then

            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"

          else

            # 1) Texte final de l'agent.
            AGENT_TEXT=$(jq -r \
              '[.. | .text? // empty] |
               map(select(type == "string")) |
               first // ""' \
              output.json 2>/dev/null)

            # 2) Extraire le dernier bloc ```json ... ```
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ {
                capture=1
                buf=""
                next
              }

              /```/ {
                if (capture) {
                  last=buf
                  capture=0
                }
                next
              }

              capture {
                buf = buf $0 "\n"
              }

              END {
                printf "%s", last
              }
            ')

            if echo "$PAGES_JSON" | \
              jq -e '.overall_status and .pages' \
              > /dev/null 2>&1; then

              # Structure demandée trouvée.
              STATUS=$(echo "$PAGES_JSON" | \
                jq -r '.overall_status // "UNKNOWN"')

              REASON=$(echo "$PAGES_JSON" | \
                jq -c '.pages')

              echo "$PAGES_JSON" > pages.json

              echo "📄 $(echo "$PAGES_JSON" | \
                jq '.pages | length') page(s) rapportée(s) :"

              echo "$PAGES_JSON" | \
                jq -r \
                '.pages[] |
                "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.note // "")"'

            else

              # Repli si le bloc JSON n'est pas présent.
              echo "⚠️ Bloc JSON structuré introuvable"

              STATUS=$(jq -r \
                '[.. | .status? // empty] |
                 map(select(type == "string")) |
                 first // "UNKNOWN"' \
                output.json 2>/dev/null)

              REASON=$(jq -r \
                '[.. | .text? // empty] |
                 map(select(type == "string")) |
                 first // ""' \
                output.json 2>/dev/null |
                head -c 300)

              if [ -z "$STATUS" ] || [ "$STATUS" == "null" ]; then

                if grep -qi "up" output.json; then

                  STATUS="UP"
                  REASON="Site appears operational (extracted from text)"

                elif grep -qi "down" output.json; then

                  STATUS="DOWN"
                  REASON="Site appears down (extracted from text)"

                else

                  STATUS="UNKNOWN"
                  REASON="No status indicator found in output"

                fi

              fi

            fi

          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          jq -n \
            --arg status "$STATUS" \
            --arg message "$REASON" \
            '{
              status: $status,
              message: $message
            }' |
          curl \
            -X POST \
            "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "Relay report failed"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: openclaw-${{ matrix.site.id }}

          path: |
            gateway.log
            output.json
            pages.json
            ~/.openclaw/workspace/screenshots/
````
