name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}

    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -fsS https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          "$HOME/.npm-global/bin/openclaw" --version

      - name: Configurer OpenClaw / OpenRouter
        run: |
          set -e

          mkdir -p "$HOME/.openclaw"

          echo "======================================"
          echo "Configuration OpenClaw / OpenRouter"
          echo "======================================"

          cat > "$HOME/.openclaw/openclaw.json" << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "openrouter": {
                  "api": "openai-completions",
                  "baseUrl": "https://openrouter.ai/api/v1",
                  "models": [
                    {
                      "id": "minimax/minimax-m3:free",
                      "name": "minimax/minimax-m3:free"
                    },
                    {
                      "id": "z-ai/glm-5.2:free",
                      "name": "z-ai/glm-5.2:free"
                    }
                  ]
                }
              }
            },
            "plugins": {
              "entries": {
                "perplexity": {
                  "enabled": false
                }
              }
            }
          }
          EOF

          echo "======================================"
          echo "Désactivation Perplexity"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" config set plugins.entries.perplexity.enabled false || true

          echo "======================================"
          echo "Enregistrement de la clé OpenRouter"
          echo "======================================"

          printf "%s\n" "$OPENROUTER_API_KEY" | \
            "$HOME/.npm-global/bin/openclaw" models auth paste-api-key \
            --provider openrouter

          echo "======================================"
          echo "Configuration du modèle principal"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" models set \
            "openrouter/minimax/minimax-m3:free"

          echo "======================================"
          echo "Configuration des fallbacks OpenClaw"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" models fallbacks clear || true

          "$HOME/.npm-global/bin/openclaw" models fallbacks add \
            "openrouter/z-ai/glm-5.2:free"

          echo "======================================"
          echo "Vérification de la configuration"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" models status || true

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.

          1. Explore le site comme un humain : scroll, observe la structure.

          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.

          3. Teste chacune de ces actions et vérifie le résultat attendu.

          4. Si une action t'amène sur une NOUVELLE URL
             (navigation, clic sur un lien, soumission de formulaire, etc.),
             traite cette URL comme une page à part entière à surveiller :
             note son statut individuellement, pas seulement l'action qui y a mené.

          5. Si erreur JS, page blanche, ou action qui ne fait rien,
             prends une capture d'écran et note-le.

          6. Termine ta réponse par TON VERDICT EN LANGAGE NATUREL.

          7. À la toute fin, ajoute IMPÉRATIVEMENT un bloc JSON exactement
             au format suivant :

          ```json
          {
            "overall_status": "UP",
            "pages": [
              {
                "url": "URL exacte visitée",
                "status": "UP",
                "http_code": 200,
                "note": "brève explication en une phrase"
              }
            ]
          }
          ```

          Règles obligatoires :

          - "overall_status" vaut uniquement "UP" ou "DOWN".
          - "status" vaut uniquement "UP" ou "DOWN".
          - "http_code" contient le code HTTP observé ou null.
          - Inclus obligatoirement l'URL de départ.
          - Inclus chaque URL distincte atteinte pendant l'exploration.
          - Inclus également les URLs ayant retourné une erreur HTTP.
          - N'invente jamais un code HTTP que tu n'as pas pu déterminer.
          EOF

      - name: Lancer OpenClaw avec Gateway persistent
        id: agent_run
        run: |
          set +e

          OPENCLAW="$HOME/.npm-global/bin/openclaw"

          echo "======================================"
          echo "Préparation du Gateway OpenClaw"
          echo "======================================"

          start_gateway() {
            echo "🔧 Démarrage du Gateway..."

            "$OPENCLAW" gateway stop 2>/dev/null || true

            pkill -f "openclaw gateway" 2>/dev/null || true

            sleep 3

            rm -f gateway.log

            nohup "$OPENCLAW" gateway run \
              --force \
              --port 18789 \
              > gateway.log 2>&1 &

            GATEWAY_PID=$!

            echo "Gateway PID: $GATEWAY_PID"

            echo "⏳ Attente du Gateway..."

            for i in $(seq 1 60); do

              if ! kill -0 "$GATEWAY_PID" 2>/dev/null; then
                echo "❌ Le processus Gateway est mort."

                echo "======================================"
                echo "gateway.log"
                echo "======================================"

                cat gateway.log 2>/dev/null || true

                return 1
              fi

              if "$OPENCLAW" gateway status \
                --require-rpc \
                --token "ci-test-token-12345" \
                --port 18789 \
                >/tmp/gateway-status.txt 2>&1; then

                echo "======================================"
                echo "✅ Gateway opérationnel"
                echo "======================================"

                cat /tmp/gateway-status.txt

                return 0
              fi

              if grep -q "\[gateway\] ready" gateway.log 2>/dev/null; then
                echo "======================================"
                echo "✅ Gateway indique READY"
                echo "======================================"

                cat gateway.log

                # Vérification RPC une dernière fois.
                if "$OPENCLAW" gateway status \
                  --require-rpc \
                  --token "ci-test-token-12345" \
                  --port 18789 \
                  >/tmp/gateway-status.txt 2>&1; then

                  cat /tmp/gateway-status.txt
                  return 0
                fi
              fi

              sleep 1
            done

            echo "❌ Impossible de valider le Gateway."

            echo "======================================"
            echo "gateway.log"
            echo "======================================"

            cat gateway.log 2>/dev/null || true

            echo "======================================"
            echo "gateway status"
            echo "======================================"

            "$OPENCLAW" gateway status \
              --json \
              --token "ci-test-token-12345" \
              --port 18789 \
              2>&1 || true

            return 1
          }

          run_agent() {
            local model="$1"
            local session_suffix="$2"

            echo "======================================"
            echo "Test avec $model"
            echo "Site : ${{ matrix.site.url }}"
            echo "======================================"

            "$OPENCLAW" models set "$model" || true

            rm -f output.json

            "$OPENCLAW" agent \
              --session-key "ci:${{ matrix.site.id }}-$session_suffix" \
              --message-file task.md \
              --json \
              > output.json 2>&1

            local exit_code=$?

            echo "Exit code agent: $exit_code"

            cat output.json

            return $exit_code
          }

          is_success() {
            local file="$1"

            if [ ! -s "$file" ]; then
              return 1
            fi

            if jq -e '
              [
                .. | .status? // empty
              ]
              | map(select(type == "string"))
              | any(. == "UP" or . == "up" or . == "OK" or . == "ok")
            ' "$file" >/dev/null 2>&1; then
              return 0
            fi

            return 1
          }

          model_not_found() {
            grep -qiE \
              "model was not found|model_not_found|check the model id|unknown model|model.*not.*found" \
              "$1"
          }

          rate_limited() {
            grep -qiE \
              "rate limit|too many requests|429|resource_exhausted|quota exceeded" \
              "$1"
          }

          gateway_down() {
            grep -qiE \
              "ECONNREFUSED|gateway not reachable|connection closed" \
              "$1"
          }

          echo "======================================"
          echo "Démarrage initial du Gateway"
          echo "======================================"

          if ! start_gateway; then
            echo "❌ Gateway non disponible."

            echo "agent_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "======================================"
          echo "Tentative 1 : MiniMax M3"
          echo "======================================"

          run_agent \
            "openrouter/minimax/minimax-m3:free" \
            "minimax1"

          if is_success output.json; then
            echo "✅ Succès avec MiniMax M3"
            echo "agent_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⚠️ MiniMax M3 n'a pas terminé correctement."

          if gateway_down output.json; then
            echo "🔄 Gateway inaccessible."

            if start_gateway; then
              run_agent \
                "openrouter/minimax/minimax-m3:free" \
                "minimax2"

              if is_success output.json; then
                echo "✅ Succès avec MiniMax M3 après redémarrage"
                echo "agent_failed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          elif rate_limited output.json; then
            echo "⚠️ Rate limit MiniMax."
            echo "⏳ Attente de 20 secondes..."
            sleep 20

            run_agent \
              "openrouter/minimax/minimax-m3:free" \
              "minimax2"

            if is_success output.json; then
              echo "✅ Succès avec MiniMax M3 après nouvelle tentative"
              echo "agent_failed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "======================================"
          echo "🔁 Fallback : GLM 5.2"
          echo "======================================"

          if model_not_found output.json; then
            echo "⚠️ MiniMax M3 introuvable."
          fi

          sleep 5

          run_agent \
            "openrouter/z-ai/glm-5.2:free" \
            "glm52"

          if is_success output.json; then
            echo "✅ Succès avec GLM 5.2"
            echo "agent_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gateway_down output.json; then
            echo "🔄 Gateway inaccessible pendant le fallback."

            if start_gateway; then
              run_agent \
                "openrouter/z-ai/glm-5.2:free" \
                "glm52-retry"

              if is_success output.json; then
                echo "✅ Succès avec GLM 5.2 après redémarrage"
                echo "agent_failed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "======================================"
          echo "❌ Échec final"
          echo "======================================"

          echo "Aucun modèle OpenRouter gratuit n'a terminé correctement."

          echo "agent_failed=true" >> "$GITHUB_OUTPUT"

      - name: Extraire et envoyer le résultat
        if: always()
        run: |
          set +e

          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"

          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"

          else

            AGENT_TEXT=$(jq -r '
              [
                .. | .text? // empty
              ]
              | map(select(type == "string"))
              | last // ""
            ' output.json 2>/dev/null)

            PAGES_JSON=$(printf '%s\n' "$AGENT_TEXT" | awk '
              /```json/ {
                capture=1
                buf=""
                next
              }

              /```/ {
                if (capture) {
                  last=buf
                  capture=0
                }
                next
              }

              capture {
                buf = buf $0 "\n"
              }

              END {
                printf "%s", last
              }
            ')

            if echo "$PAGES_JSON" | jq -e '
              (.overall_status == "UP" or .overall_status == "DOWN")
              and (.pages | type == "array")
            ' >/dev/null 2>&1; then

              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status')

              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')

              echo "$PAGES_JSON" > pages.json

              echo "📄 $(echo "$PAGES_JSON" | jq '.pages | length') page(s) rapportée(s)"

              echo "$PAGES_JSON" | jq -r '
                .pages[]
                | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.note // "")"
              '

            else

              echo "⚠️ Bloc JSON structuré introuvable."

              STATUS=$(jq -r '
                [
                  .. | .status? // empty
                ]
                | map(select(type == "string"))
                | first // "UNKNOWN"
              ' output.json 2>/dev/null)

              REASON=$(jq -r '
                [
                  .. | .text? // empty
                ]
                | map(select(type == "string"))
                | last // ""
              ' output.json 2>/dev/null | head -c 500)

              if [ "$STATUS" != "UP" ] && [ "$STATUS" != "DOWN" ]; then

                if grep -qi "UP" output.json; then
                  STATUS="UP"
                  REASON="Site appears operational"

                elif grep -qi "DOWN" output.json; then
                  STATUS="DOWN"
                  REASON="Site appears down"

                else
                  STATUS="ERROR"
                  REASON="No valid status found in agent output"
                fi
              fi
            fi
          fi

          echo "======================================"
          echo "Statut final : $STATUS"
          echo "Message : $REASON"
          echo "======================================"

          jq -n \
            --arg status "$STATUS" \
            --arg message "$REASON" \
            '{
              status: $status,
              message: $message
            }' |
          curl -fsS -X POST \
            "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "⚠️ Relay report failed"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: openclaw-${{ matrix.site.id }}

          path: |
            gateway.log
            output.json
            pages.json
            /home/runner/.openclaw/workspace/screenshots/
