name: Hermes Agent - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'ID du site à tester spécifiquement (optionnel)'
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      # Job inchangé par rapport au workflow OpenClaw : la découverte des sites/pages
      # via kuma-relay ne dépend pas de l'agent utilisé pour la vérification.
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          SITE_ID="$SITE_ID_INPUT"

          if [ -n "$SITE_ID" ]; then
            echo "🔍 Test ciblé sur le site $SITE_ID"
            DETAIL=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors/$SITE_ID")

            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')

            if [ -z "$MONITOR" ] || [ "$MONITOR" == "null" ]; then
              echo "❌ Site $SITE_ID introuvable ou erreur relay"
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MONITORS=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')

            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            RAW=$(curl -s https://kuma-relay.up.railway.app/active-sites)
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "")

            if [ -z "$SITES_RAW" ] || [ "$SITES_RAW" == "null" ]; then
              echo "⚠️ Réponse Supabase/relay illisible ou vide — aucun test ne sera lancé"
              SITES_RAW="[]"
            fi

            if [ "$SITES_RAW" == "[]" ]; then
              echo "ℹ️ Aucun site actif trouvé sur Supabase — aucun run de vérification ce cycle"
            fi

            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              sid=$(echo "$site" | jq -r '.id')
              all=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
              pages=$(echo "$all" | jq -c --arg sid "$sid" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')
              site_with_pages=$(echo "$site" | jq -c --argjson pages "$pages" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$site_with_pages" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]?')"
            SITES="$SITES_ARRAY"
          fi

          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "📡 Sites à monitorer: $SITES"

  hermes-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: hermes-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 🛠️ SIMPLIFICATION vs OpenClaw : plus besoin d'installer Node.js à la main,
      # l'installeur Hermes gère lui-même Python/Node/ffmpeg/Playwright.
      # --skip-computer-use : on n'utilise pas le toolset Computer Use, seulement
      # l'automatisation navigateur (Playwright/agent-browser reste installé).
      - name: Installer Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          source ~/.bashrc || true
          hermes --version
          hermes doctor || echo "⚠️ hermes doctor a signalé des avertissements (voir logs) — non bloquant"

      # 🎥 Remplace tout le pipeline rrweb/ffmpeg d'OpenClaw : Hermes enregistre
      # nativement la session navigateur en WebM (browser.record_sessions: true),
      # démarre au premier browser_navigate et sauvegarde dans
      # ~/.hermes/browser_recordings/ à la fermeture de la session. Fonctionne en
      # local ET en cloud (Browserbase), et ne dépend pas d'un curseur/souris
      # simulé côté page comme le nécessitait rrweb.
      - name: Configurer Hermes (config.yaml + credentials)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          mkdir -p ~/.hermes

          # Les clés vont dans .env (Hermes détecte automatiquement les providers
          # pour lesquels une clé existe — cf. doc "Configuring Models").
          cat > ~/.hermes/.env << EOF
          MISTRAL_API_KEY=${MISTRAL_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}
          HF_API_KEY=${HF_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          EOF

          cat > ~/.hermes/config.yaml << 'EOF'
          browser:
            enabled: true
            cloud_provider: local
            record_sessions: true

          display:
            tool_progress: "off"

          sessions:
            auto_prune: true

          models:
            providers:
              mistral:
                provider: mistral
                api_mode: openai-completions
                base_url: https://api.mistral.ai/v1
                default: mistral-small-latest
              google:
                provider: google
                default: gemini-2.5-pro
              huggingface:
                provider: huggingface
                api_mode: openai-completions
                base_url: https://router.huggingface.co/v1
                default: openai/gpt-oss-120b:cerebras
              openrouter:
                provider: openrouter
                api_mode: openai-completions
                base_url: https://openrouter.ai/api/v1
              nvidia:
                provider: nvidia
                api_mode: openai-completions
                base_url: https://integrate.api.nvidia.com/v1
                default: moonshotai/kimi-k3
          EOF

          # ⚠️ Point non vérifié (comme pour openclaw models set en son temps) :
          # la forme exacte des clés provider/model attendues par hermes chat -m.
          # Si un provider échoue en config, `hermes doctor` et les logs de
          # `hermes chat` indiquent la clé attendue à corriger.
          hermes doctor

      - name: Générer la tâche
        env:
          PAGES_JSON: ${{ toJson(matrix.site.pages) }}
          SITE_URL: ${{ matrix.site.url }}
        run: |
          PAGES_LIST=$(echo "$PAGES_JSON" | jq -c . | jq -r '[.[]? | .url] | join("\n")')

          # Tâche identique à celle du workflow OpenClaw : le contenu métier de la
          # vérification (détection backend en panne, parcours e-commerce/auth/
          # contact/recherche, verdict JSON final) ne change pas avec le pivot
          # d'agent — seul le mécanisme d'exécution et d'enregistrement change.
          cat > task.md << EOF
          Va sur $SITE_URL avec l'outil de navigateur. Explore comme un
          humain (scroll, structure) et détecte le type de site.

          VÉRIFICATION CRITIQUE avant tout le reste : le contenu affiché
          correspond-il vraiment au site attendu, ou est-ce une page par
          défaut d'hébergeur/registrar (ex: "o2switch", "It works!", page de
          parking de domaine, message DNS/SSL non configuré) ? Si le frontend
          affiche des sections censées recevoir des données du backend
          (liste de produits, résultats, profil, prix, etc.) mais qu'elles
          restent vides, bloquées en chargement, ou affichent une erreur/
          "undefined"/"null" à la place des vraies données, c'est un backend
          en panne : DOWN, même si la page HTTP répond 200.

          PAGES À VÉRIFIER OBLIGATOIREMENT :
          $PAGES_LIST

          Choisis 2-3 actions à tester selon le type détecté :
          - E-commerce : ajoute un produit au panier, VÉRIFIE qu'il apparaît
            bien dans le panier (nom/qté/prix) — ces données viennent du
            backend, vérifie qu'elles sont réelles et pas un état vide/figé.
          - Compte utilisateur : inscris-toi avec des données fictives
            (test+ci-<horodatage>@example.com), puis connecte-toi avec ces
            identifiants. Si compte existant seulement, teste juste qu'un
            login invalide donne une erreur propre (pas de vraie connexion).
          - Formulaire de contact : soumets-le en indiquant "TEST AUTOMATISÉ"
            dans le message.
          - Recherche : vérifie que des résultats s'affichent réellement.
          - Sinon : les 2-3 actions les plus représentatives du site.

          Pour chaque page listée, vérifie au minimum qu'elle répond correctement
          (HTTP 200, contenu attendu). Explore aussi les liens internes pour
          détecter d'éventuelles pages non listées et signale-les dans le JSON
          final. Toute nouvelle URL atteinte = une page distincte à noter.

          Termine par ton verdict en langage naturel (type de site + parcours
          testés, en précisant si le contenu venait bien du backend ou si
          c'était un placeholder/backend en panne), puis ce bloc JSON exact
          en toute fin (rien d'autre dedans) :

          \`\`\`json
          {
            "overall_status": "UP",
            "site_type": "ecommerce",
            "pages": [
              {
                "url": "URL exacte",
                "status": "UP",
                "http_code": 200,
                "action_tested": "action testée ou null",
                "note": "explication en une sentence"
              }
            ]
          }
          \`\`\`
          Règles : status/overall_status = "UP" ou "DOWN" uniquement.
          site_type = ecommerce|auth|vitrine|blog|autre. Une entrée par page
          visitée (départ + chaque URL distincte, y compris erreurs/404). Un
          parcours métier qui échoue (panier vide après ajout, recherche sans
          résultat, form qui ne soumet rien) = DOWN même si HTTP 200. Une page
          par défaut d'hébergeur ou des données backend manquantes/vides
          alors qu'elles sont attendues = DOWN même si HTTP 200.
          EOF

      # 🛠️ SIMPLIFICATION MAJEURE vs OpenClaw : plus de gateway persistant à
      # démarrer/arrêter/poller, plus de poller externe (screenshot ou rrweb)
      # tournant en parallèle de l'agent. `hermes chat -q` est un exec one-shot :
      # un appel = une vérification complète, et l'enregistrement vidéo se fait
      # tout seul côté Hermes tant que browser.record_sessions: true.
      - name: Lancer Hermes Agent (avec repli multi-providers)
        id: agent_run
        run: |
          set +e

          TASK_CONTENT=$(cat task.md)

          run_agent() {
            local model=$1
            local label=$2
            echo "======================================"
            echo "Test avec $model pour ${{ matrix.site.url }}"
            echo "======================================"

            # 🛠️ CORRIGÉ après un run réel : `hermes chat -q` n'existe pas tel quel.
            # `--help` confirme que le prompt one-shot (-z) et les toolsets (-t) sont
            # des flags TOP-LEVEL de `hermes`, pas des options de la sous-commande
            # `chat`. --yolo évite que l'agent se bloque en attendant une
            # confirmation humaine pour une action (clic, soumission de formulaire)
            # puisque personne n'est présent en CI pour l'approuver.
            hermes -z "$TASK_CONTENT" \
              -m "$model" \
              -t "browser,terminal" \
              --yolo \
              > "output-${label}.json" 2>&1

            echo "exit_code=$?"
          }

          is_success() {
            local status
            status=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // empty' "$1" 2>/dev/null)
            if [ -z "$status" ]; then
              # Le texte peut ne pas être du JSON structuré (sortie de chat brute) ;
              # on retombe sur une recherche de motif dans le texte, comme pour
              # l'extraction finale plus bas.
              grep -qiE '"overall_status"\s*:\s*"(up|ok)"' "$1"
              return $?
            fi
            echo "$status" | grep -qiE '^(up|ok)$'
          }

          echo "======================================"
          echo "🔁 Chaîne de repli OpenRouter (modèles gratuits)"
          echo "======================================"
          for OR_MODEL in \
            "openrouter/poolside/laguna-s-2.1:free" \
            "openrouter/inclusionai/ling-3.0-flash-fin:free" \
            "openrouter/thinkingmachines/inkling:free" \
            "openrouter/openrouter/free"; do
            label="openrouter-$(echo "$OR_MODEL" | tr '/:' '--')"
            run_agent "$OR_MODEL" "$label"
            cp "output-${label}.json" output.json
            if is_success output.json; then
              echo "✅ Succès avec OpenRouter ($OR_MODEL)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "======================================"
          echo "🔁 Fallback sur Mistral / Google / HuggingFace"
          echo "======================================"
          for MODEL in "mistral/mistral-small-latest" "google/gemini-2.5-pro" "huggingface/openai/gpt-oss-120b:cerebras"; do
            label="$(echo "$MODEL" | tr '/:' '--')"
            run_agent "$MODEL" "$label"
            cp "output-${label}.json" output.json
            if is_success output.json; then
              echo "✅ Succès avec $MODEL"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "======================================"
          echo "🔁 Dernier recours : NVIDIA NIM"
          echo "======================================"
          run_agent "nvidia/moonshotai/kimi-k3" "nvidia1"
          cp "output-nvidia1.json" output.json
          if is_success output.json; then
            echo "✅ Succès avec NVIDIA (moonshotai/kimi-k3)"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Échec final après tous les providers"
          echo "agent_failed=true" >> $GITHUB_OUTPUT

      - name: Récupérer les enregistrements vidéo Hermes
        if: always()
        run: |
          mkdir -p recordings
          # Les sessions Hermes enregistrent en WebM dans ~/.hermes/browser_recordings/
          # dès que la session navigateur se ferme (fin de l'appel hermes chat).
          # Nettoyage auto après 72h côté Hermes — sans effet ici puisque le
          # runner est jetable, mais on copie systématiquement avant la fin du job.
          if [ -d ~/.hermes/browser_recordings ]; then
            cp -v ~/.hermes/browser_recordings/*.webm recordings/ 2>/dev/null || echo "ℹ️ Aucun enregistrement trouvé pour cette tentative"
          else
            echo "ℹ️ Dossier browser_recordings absent — aucune session navigateur enregistrée"
          fi

      - name: Extraire et envoyer le résultat
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
            PAGES_JSON=""
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
            PAGES_JSON=""
          else
            # Même logique d'extraction que le workflow OpenClaw : le format de
            # sortie attendu (bloc ```json final) ne dépend pas de l'agent utilisé,
            # seulement du prompt dans task.md, resté identique.
            AGENT_TEXT=$(jq -r '[.. | .text? // empty] | map(select(type == "string")) | first // ""' output.json 2>/dev/null)
            if [ -z "$AGENT_TEXT" ]; then
              AGENT_TEXT=$(cat output.json)
            fi
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ { capture=1; buf=""; next }
              /```/ { if (capture) { last=buf; capture=0 } ; next }
              capture { buf = buf $0 "\n" }
              END { printf "%s", last }
            ')

            if echo "$PAGES_JSON" | jq -e '.overall_status and .pages' > /dev/null 2>&1; then
              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status // "UNKNOWN"')
              SITE_TYPE=$(echo "$PAGES_JSON" | jq -r '.site_type // "non détecté"')
              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')
              echo "$PAGES_JSON" > pages.json
              echo "🏷️ Type de site détecté : $SITE_TYPE"
              echo "📄 $(echo "$PAGES_JSON" | jq '.pages | length') page(s) rapportée(s) :"
              echo "$PAGES_JSON" | jq -r '.pages[] | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.action_tested // "navigation simple") — \(.note // "")"'
            else
              echo "⚠️ Bloc JSON structuré introuvable, repli sur extraction texte"
              if echo "$AGENT_TEXT" | grep -qi "up"; then
                STATUS="UP"
                REASON="Site appears operational (extracted from text)"
              elif echo "$AGENT_TEXT" | grep -qi "down"; then
                STATUS="DOWN"
                REASON="Site appears down (extracted from text)"
              else
                STATUS="UNKNOWN"
                REASON="No status indicator found in output"
              fi
              PAGES_JSON=""
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          if [ -n "$PAGES_JSON" ] && echo "$PAGES_JSON" | jq -e '.pages' > /dev/null 2>&1; then
            echo "📤 Envoi du rapport pages à /pages-report"
            echo "$PAGES_JSON" | jq -c '{pages: .pages}' | \
            curl -X POST "https://kuma-relay.up.railway.app/sites/${SITE_ID}/pages-report" \
              -H "x-relay-secret: $RELAY_SECRET" \
              -H "Content-Type: application/json" \
              -d @- \
              || echo "⚠️ Envoi pages-report échoué"
          else
            echo "ℹ️ Aucun rapport pages structuré à envoyer"
          fi

          jq -n --arg status "$STATUS" --arg message "$REASON" '{status: $status, message: $message}' | \
          curl -X POST "https://kuma-relay.up.railway.app/sites/${SITE_ID}/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "⚠️ Envoi mark-crawled échoué"

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.site.id }}
          path: |
            output*.json
            pages.json
            recordings/*.webm
