name: Test IA sur usinformatique.com

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Lancer le test sur usinformatique.com
        run: |
          node -e "
            const { checkPage } = require('./crawler.js');
            const { chromium } = require('playwright');

            (async () => {
              const browser = await chromium.launch({ headless: true });
              const context = await browser.newContext();
              console.log('🔍 Test du site : https://usinformatique.com');
              const result = await checkPage(context, 'https://usinformatique.com');
              console.log('📊 Résultat final :', JSON.stringify(result, null, 2));
              await browser.close();

              if (result.status === 'down') {
                console.error('❌ Site déclaré DOWN par l\'IA');
                process.exit(1);
              } else {
                console.log('✅ Site déclaré UP par l\'IA');
                process.exit(0);
              }
            })();
          "
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_USER_FLOW: 'true'
          MAX_CLICKS: 5
          API_WAIT_TIMEOUT_MS: 30000
