name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Créer le fichier de configuration minimal (valide)
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "auth": {
                "token": "ci-test-token-12345"
              }
            }
          }
          EOF
          # Valider la configuration
          ~/.npm-global/bin/openclaw config validate || echo "⚠️ Config invalide, mais on continue"

      - name: Démarrer le Gateway
        run: |
          nohup ~/.npm-global/bin/openclaw gateway --force > gateway.log 2>&1 &
          sleep 10
          ~/.npm-global/bin/openclaw gateway status || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << EOF
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.
          3. Teste chacune de ces actions et vérifie le résultat attendu.
          4. Si erreur JS, page blanche, ou action qui ne fait rien, prends une capture d'écran et note-le.
          5. Termine par un verdict UP ou DOWN avec la liste des actions testées.
          EOF

      - name: Lancer OpenClaw (avec fallback manuel)
        id: agent_run
        run: |
          set +e

          # === 1er essai : Mistral ===
          echo "======================================"
          echo "Essai avec Mistral pour ${{ matrix.site.url }}"
          echo "======================================"

          # Définir le modèle Mistral
          ~/.npm-global/bin/openclaw config set agents.defaults.model "mistral/mistral-small-latest"

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          cat output.json

          if grep -q "rate limit" output.json; then
            echo "⚠️ Rate limit détecté, nouvelle tentative dans 30s..."
            sleep 30
            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}" \
              --message-file task.md \
              --json > output.json 2>&1
            cat output.json
          fi

          if grep -q '"status":"ok"' output.json; then
            echo "✅ Succès avec Mistral"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # === Échec Mistral → Fallback sur Google Gemini ===
          echo "======================================"
          echo "🔁 Fallback sur Google Gemini pour ${{ matrix.site.url }}"
          echo "======================================"

          ~/.npm-global/bin/openclaw config set agents.defaults.model "google/gemini-2.5-flash"

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          cat output.json

          if grep -q '"status":"ok"' output.json; then
            echo "✅ Succès avec Google Gemini"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Échec final avec Google Gemini"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat au Relay
        if: always()
        run: |
          # Vérifier si output.json existe et est valide
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
          else
            # Extraire le statut (la structure peut varier, on utilise une approche robuste)
            # Si le JSON contient .result.payloads[0].status, on le prend, sinon on cherche status dans la racine
            if jq -e '.result.payloads[0].status' output.json > /dev/null 2>&1; then
              STATUS=$(jq -r '.result.payloads[0].status // "UNKNOWN"' output.json)
              REASON=$(jq -r '.result.payloads[0].text' output.json | head -c 300)
            elif jq -e '.status' output.json > /dev/null 2>&1; then
              STATUS=$(jq -r '.status // "UNKNOWN"' output.json)
              REASON=$(jq -r '.text // .message // ""' output.json | head -c 300)
            else
              # Si on ne trouve pas, on cherche "up" ou "down" dans le texte
              if grep -qi "up" output.json; then
                STATUS="UP"
                REASON="Site appears operational (extracted from text)"
              elif grep -qi "down" output.json; then
                STATUS="DOWN"
                REASON="Site appears down (extracted from text)"
              else
                STATUS="UNKNOWN"
                REASON="No status indicator found in output"
              fi
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          # Envoyer au relay (utiliser l'endpoint existant /mark-crawled)
          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" \
            || echo "Relay report failed"
        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
