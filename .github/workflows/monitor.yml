name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          # Adaptez la structure de l'URL selon votre API
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # Évite les rate limits (un site à la fois)
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (Mistral + Google natif)
        run: |
          ~/.npm-global/bin/openclaw config set browser.enabled true
          ~/.npm-global/bin/openclaw config set browser.headless true
          ~/.npm-global/bin/openclaw config set browser.noSandbox true
          ~/.npm-global/bin/openclaw config set gateway.mode "local"
          ~/.npm-global/bin/openclaw config set gateway.auth.token "ci-test-token-12345"

          # Provider Google en mode natif (pour le fallback)
          ~/.npm-global/bin/openclaw config set providers.google.api "google-generative-ai"

          # Modèle principal : Mistral Small (fiable et bon pour l'agent)
          ~/.npm-global/bin/openclaw config set agents.defaults.model.primary "mistral/mistral-small-latest"

          # Fallback : Google Gemini Flash (si Mistral rate)
          ~/.npm-global/bin/openclaw config set agents.defaults.model.fallback "google/gemini-2.5-flash"
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Démarrer le Gateway
        run: |
          nohup ~/.npm-global/bin/openclaw gateway --force > gateway.log 2>&1 &
          sleep 10
          ~/.npm-global/bin/openclaw gateway status || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche (prompt générique)
        run: |
          cat > task.md << EOF
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site (ex: formulaire de contact, recherche, ajout au panier, connexion, navigation menu) selon ce que tu observes.
          3. Teste chacune de ces actions et vérifie qu'elle produit le résultat attendu.
          4. Si tu vois une erreur JavaScript, une page blanche, ou un résultat incohérent (ex: action qui ne fait rien), prends une capture d'écran et note-le précisément.
          5. Termine par un verdict clair : UP ou DOWN, avec la liste des actions testées et leur résultat.
          EOF

      - name: Lancer OpenClaw (avec retry en cas de 429)
        id: agent_run
        run: |
          set +e
          MAX_RETRIES=3
          RETRY_DELAY=30
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "======================================"
            echo "Tentative $ATTEMPT/$MAX_RETRIES pour ${{ matrix.site.url }}"
            echo "======================================"

            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}" \
              --message-file task.md \
              --json > output.json 2>&1

            EXIT_CODE=$?

            # Vérifier si la sortie indique un rate limit (429)
            if grep -q "rate limit\|429" output.json 2>/dev/null; then
              echo "⚠️ Rate limit détecté, nouvelle tentative dans ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              continue
            fi

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Agent réussi pour ${{ matrix.site.url }}"
              SUCCESS=true
              break
            else
              echo "❌ Échec de l'agent (code $EXIT_CODE), nouvelle tentative dans 5s..."
              sleep 5
            fi
          done

          if [ "$SUCCESS" = true ]; then
            echo "agent_failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Échec final de l'agent pour ${{ matrix.site.url }}"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat au Relay
        if: always()
        run: |
          # Vérifier si output.json existe
          if [ ! -f output.json ]; then
            STATUS="ERROR"
            REASON="Agent did not produce output.json"
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after retries"
          else
            # Extraire le statut (structure du JSON à adapter si besoin)
            STATUS=$(jq -r '.result.payloads[0].status // "UNKNOWN"' output.json)
            REASON=$(jq -r '.result.payloads[0].text' output.json | head -c 300)
          fi

          # Envoyer au relay
          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/report" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" || echo "Relay report failed"
        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
