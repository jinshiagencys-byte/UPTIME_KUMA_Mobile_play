name: AutoSpec Agent - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "ID du site à tester spécifiquement (optionnel)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. RÉCUPÉRER LES SITES (identique aux workflows précédents)
  # ============================================================
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID="${SITE_ID_INPUT:-}"

          if [ -n "$SITE_ID" ]; then
            echo "🔍 Test ciblé sur le site $SITE_ID"
            DETAIL=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors/$SITE_ID")
            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')

            if [ -z "$MONITOR" ] || [ "$MONITOR" = "null" ]; then
              echo "❌ Site $SITE_ID introuvable ou erreur relay"
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MONITORS=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent | tostring) == $sid) | {url: .url, name: .name}]')
            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            echo "📡 Récupération de tous les sites actifs..."
            RAW=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/active-sites")
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "[]")
            [ -z "$SITES_RAW" ] || [ "$SITES_RAW" = "null" ] && SITES_RAW="[]"

            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              SID=$(echo "$site" | jq -r '.id')
              ALL_MONITORS=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
              PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$SID" '[.monitors[]? | select(.type == "http" and (.parent | tostring) == $sid) | {url: .url, name: .name}]')
              SITE_WITH_PAGES=$(echo "$site" | jq -c --argjson pages "$PAGES" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$SITE_WITH_PAGES" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]?')"
            SITES="$SITES_ARRAY"
          fi

          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "📡 Sites à monitorer :"
          echo "$SITES" | jq .

  # ============================================================
  # 2. AGENT AUTOSPEC
  # ============================================================
  autospec-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autospec-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # autospecai requires Node >= 22
      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer autospecai + Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p autospec-runner && cd autospec-runner
          npm init -y --silent > /dev/null
          npm install autospecai --silent
          npx playwright install --with-deps chromium

      # Le wrapper gère : specs par page connue, chaîne de fallback modèle
      # (coût croissant), récupération HTTP code, et traduction vers le
      # schéma JSON attendu par le relay SentinelSite.
      - name: Générer le wrapper run-autospec.mjs
        working-directory: autospec-runner
        run: |
          cat > run-autospec.mjs <<'NODEJS'
          // (voir /home/claude/run-autospec.mjs pour la version commentée en détail)
          import { main as runAutospec } from "autospecai";
          import fs from "fs";

          const SITE_URL = process.env.SITE_URL;
          const SITE_ID = process.env.SITE_ID;

          if (!SITE_URL || !SITE_ID) {
            console.error("SITE_URL and SITE_ID are required.");
            process.exit(1);
          }

          let pages = [];
          try { pages = JSON.parse(process.env.PAGES_JSON || "[]"); } catch { pages = []; }

          const knownUrls = pages.map((p) => p.url).filter(Boolean);
          if (!knownUrls.includes(SITE_URL)) {
            pages = [{ url: SITE_URL, name: "Accueil" }, ...pages];
          }

          const MODEL_CHAIN = [
            { model: "gemini-2.5-flash", apiKey: process.env.GOOGLE_API_KEY },
            { model: "claude-opus-4-6", apiKey: process.env.ANTHROPIC_API_KEY },
            { model: "gpt-5.4", apiKey: process.env.OPENAI_API_KEY },
          ];

          function isTemporaryError(err) {
            const s = String(err).toLowerCase();
            return /503|rate limit|429|too many requests|timeout|overloaded|internal server error|500|502|504/.test(s);
          }

          function buildSpec(pageUrl) {
            return `Navigate to ${pageUrl}. ` +
              `Check that the content genuinely matches the expected site, and is NOT ` +
              `a hosting/registrar placeholder page, a domain parking page, a default ` +
              `"It works!" page, or a DNS/SSL error page. ` +
              `If the page has sections that should be filled with backend data ` +
              `(product listings, search results, a user profile, prices, a cart, ` +
              `etc.), verify that data actually appears — if those sections stay ` +
              `empty, stuck loading, or show "undefined"/"null" placeholders, treat ` +
              `this as a functional failure even if the page itself loaded. ` +
              `If there is an obviously testable interactive element on this specific ` +
              `page (add to cart, submit a contact form using "TEST AUTOMATISÉ" as the ` +
              `message, run a search, or a signup/login using fake data such as ` +
              `test+ci-${Date.now()}@example.com — never a real account), perform that ` +
              `one action and verify its real result before concluding. ` +
              `A button merely existing is not proof a feature works — you must click ` +
              `it and observe the outcome. ` +
              `Call mark_complete with your verdict once you've actually checked.`;
          }

          async function getHttpCode(url) {
            try {
              const res = await fetch(url, { method: "GET", redirect: "follow", signal: AbortSignal.timeout(15000) });
              return res.status;
            } catch { return null; }
          }

          async function runAttempt({ model, apiKey }, specFilePath) {
            console.log("======================================");
            console.log(`🤖 TENTATIVE — MODÈLE : ${model}`);
            console.log("======================================");
            if (!apiKey) {
              console.log(`⚠️ Pas de clé API pour ${model}, modèle sauté.`);
              return { ok: false, temporary: false };
            }
            try {
              const { testResults } = await runAutospec({
                testUrl: SITE_URL,
                modelName: model,
                apiKey,
                specFile: specFilePath,
                trajectoriesPath: "./trajectories",
                recordVideo: true,
              });
              if (!testResults || testResults.length === 0) {
                console.log(`⚠️ ${model} n'a produit aucun résultat exploitable.`);
                return { ok: false, temporary: false };
              }
              return { ok: true, testResults };
            } catch (err) {
              console.log(`❌ Échec avec ${model} : ${err}`);
              return { ok: false, temporary: isTemporaryError(err) };
            }
          }

          async function main() {
            const specs = pages.map((p) => buildSpec(p.url));
            const specFilePath = "./specs.json";
            fs.writeFileSync(specFilePath, JSON.stringify(specs, null, 2), "utf-8");

            console.log("Site :", SITE_URL);
            console.log("Pages à vérifier :", pages.map((p) => p.url).join(", "));

            let finalResults = null;
            let winningModel = null;

            for (const candidate of MODEL_CHAIN) {
              const MAX_RETRIES = 2;
              let attempt = { ok: false, temporary: false };
              for (let i = 0; i <= MAX_RETRIES; i++) {
                attempt = await runAttempt(candidate, specFilePath);
                if (attempt.ok) break;
                if (!attempt.temporary) break;
                const delay = Math.min(30, 2 ** i * 2);
                console.log(`⏳ Erreur temporaire, nouvel essai dans ${delay}s...`);
                await new Promise((r) => setTimeout(r, delay * 1000));
              }
              if (attempt.ok) {
                finalResults = attempt.testResults;
                winningModel = candidate.model;
                break;
              }
            }

            const httpCodes = await Promise.all(pages.map((p) => getHttpCode(p.url)));

            let pagesReport, overallStatus, actionsCompleted;

            if (finalResults) {
              pagesReport = pages.map((p, i) => {
                const r = finalResults[i];
                const status = r?.status === "passed" ? "UP" : "DOWN";
                return {
                  url: p.url,
                  status,
                  http_code: httpCodes[i],
                  action_tested: r ? (r.actions?.map((a) => a.tool).join(" → ") || "navigation") : "non testé (résultat manquant)",
                  note: r?.reason || (status === "UP" ? "OK" : "Voir vidéo/trace pour détail"),
                };
              });
              overallStatus = pagesReport.some((p) => p.status === "DOWN") ? "DOWN" : "UP";
              actionsCompleted = true;
            } else {
              pagesReport = pages.map((p, i) => ({
                url: p.url,
                status: httpCodes[i] && httpCodes[i] < 400 ? "UP" : "DOWN",
                http_code: httpCodes[i],
                action_tested: null,
                note: "⚠️ Tous les modèles IA ont échoué — statut basé sur un simple code HTTP, aucune vérification fonctionnelle réelle.",
              }));
              overallStatus = pagesReport.some((p) => p.status === "DOWN") ? "DOWN" : "UP";
              actionsCompleted = false;
            }

            const output = {
              overall_status: overallStatus,
              site_type: "non_detecte",
              actions_completed: actionsCompleted,
              model_used: winningModel,
              pages: pagesReport,
            };

            fs.writeFileSync("../output.json", JSON.stringify(output, null, 2), "utf-8");
            console.log("\n=== output.json ===");
            console.log(JSON.stringify(output, null, 2));
          }

          main().catch((err) => {
            console.error("Erreur fatale :", err);
            fs.writeFileSync("../output.json", JSON.stringify({
              overall_status: "ERROR",
              site_type: "non_detecte",
              actions_completed: false,
              pages: [],
              error: String(err),
            }, null, 2), "utf-8");
            process.exit(0);
          });
          NODEJS

      - name: Exécuter AutoSpec
        working-directory: autospec-runner
        env:
          SITE_ID: ${{ matrix.site.id }}
          SITE_URL: ${{ matrix.site.url }}
          PAGES_JSON: ${{ toJson(matrix.site.pages) }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node run-autospec.mjs

      - name: Afficher le résultat
        if: always()
        run: |
          if [ -f output.json ]; then jq . output.json; else echo "❌ output.json absent"; fi

      - name: Envoyer le rapport des pages
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          [ ! -f output.json ] && exit 0
          if jq -e '.pages' output.json >/dev/null 2>&1; then
            jq -c '{pages: .pages}' output.json > pages_payload.json
            curl -sS --retry 3 --retry-delay 2 -X POST "$RELAY_URL/sites/$SITE_ID/pages-report" \
              -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @pages_payload.json
          fi

      - name: Envoyer le statut global
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          STATUS="ERROR"; MESSAGE="AutoSpec execution error"
          if [ -f output.json ]; then
            STATUS=$(jq -r '.overall_status // "ERROR"' output.json | tr '[:lower:]' '[:upper:]')
            MESSAGE=$(jq -c '{actions_completed, model_used, pages}' output.json)
          fi
          jq -nc --arg status "$STATUS" --arg message "$MESSAGE" '{status: $status, message: $message}' > status_payload.json
          curl -sS --retry 3 --retry-delay 2 -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @status_payload.json

      - name: Uploader les artifacts (vidéos, traces, specs générées)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autospec-monitoring-${{ matrix.site.id }}
          path: |
            autospec-runner/trajectories/
            autospec-runner/output.json
            autospec-runner/specs.json
          if-no-files-found: ignore
          retention-days: 7
