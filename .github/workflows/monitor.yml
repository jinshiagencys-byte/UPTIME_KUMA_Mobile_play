name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Créer le fichier de configuration OpenClaw
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "providers": {
              "google": {
                "api": "google-generative-ai"
              }
            },
            "agents": {
              "defaults": {
                "model": {
                  "primary": "mistral/mistral-small-latest",
                  "fallback": "google/gemini-2.5-flash"
                }
              }
            },
            "gateway": {
              "auth": {
                "token": "ci-test-token-12345"
              }
            }
          }
          EOF
          cat ~/.openclaw/openclaw.json

      - name: Démarrer le Gateway
        run: |
          nohup ~/.npm-global/bin/openclaw gateway --force > gateway.log 2>&1 &
          sleep 10
          ~/.npm-global/bin/openclaw gateway status || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche (prompt générique)
        run: |
          cat > task.md << EOF
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site (ex: formulaire de contact, recherche, ajout au panier, connexion, navigation menu) selon ce que tu observes.
          3. Teste chacune de ces actions et vérifie qu'elle produit le résultat attendu.
          4. Si tu vois une erreur JavaScript, une page blanche, ou un résultat incohérent (ex: action qui ne fait rien), prends une capture d'écran et note-le précisément.
          5. Termine par un verdict clair : UP ou DOWN, avec la liste des actions testées et leur résultat.
          EOF

      - name: Lancer OpenClaw (avec fallback forcé sur Google après 2 échecs)
        id: agent_run
        run: |
          set +e

          # Premier essai avec Mistral
          echo "======================================"
          echo "Essai avec Mistral pour ${{ matrix.site.url }}"
          echo "======================================"
          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          EXIT_CODE=$?
          cat output.json

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Succès avec Mistral"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # En cas d'échec, on réessaie une fois avec Mistral (pour les rate limits temporaires)
          echo "======================================"
          echo "⚠️ Échec Mistral, nouvelle tentative dans 10s..."
          echo "======================================"
          sleep 10
          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          EXIT_CODE=$?
          cat output.json

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Succès avec Mistral (2e tentative)"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Échec Mistral → fallback forcé sur Google Gemini
          echo "======================================"
          echo "🔁 Fallback forcé sur Google Gemini pour ${{ matrix.site.url }}"
          echo "======================================"

          # On modifie temporairement le modèle primaire
          ~/.npm-global/bin/openclaw config set agents.defaults.model.primary "google/gemini-2.5-flash"

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          EXIT_CODE=$?
          cat output.json

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Succès avec Google Gemini"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Échec final avec Google Gemini"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat au Relay
        if: always()
        run: |
          if [ ! -f output.json ]; then
            STATUS="ERROR"
            REASON="Agent did not produce output.json"
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
          else
            STATUS=$(jq -r '.result.payloads[0].status // "UNKNOWN"' output.json)
            REASON=$(jq -r '.result.payloads[0].text' output.json | head -c 300)
          fi

          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/report" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" || echo "Relay report failed"
        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
