name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest

    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}

    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash

          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw / OpenRouter
        run: |

          mkdir -p ~/.openclaw

          echo "======================================"
          echo "Configuration OpenClaw / OpenRouter"
          echo "======================================"

          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "openrouter": {
                  "api": "openai-completions",
                  "baseUrl": "https://openrouter.ai/api/v1",
                  "models": [
                    {
                      "id": "minimax/minimax-m3:free",
                      "name": "minimax/minimax-m3:free"
                    },
                    {
                      "id": "z-ai/glm-5.2:free",
                      "name": "z-ai/glm-5.2:free"
                    }
                  ]
                }
              }
            },
            "plugins": {
              "entries": {
                "perplexity": {
                  "enabled": false
                }
              }
            }
          }
          EOF

          echo "Configuration créée :"
          cat ~/.openclaw/openclaw.json

          echo "======================================"
          echo "Désactivation Perplexity"
          echo "======================================"

          ~/.npm-global/bin/openclaw plugins disable perplexity 2>/dev/null || true

          echo "======================================"
          echo "Enregistrement de la clé OpenRouter"
          echo "======================================"

          printf "%s\n" "$OPENROUTER_API_KEY" | \
            ~/.npm-global/bin/openclaw models auth paste-api-key \
            --provider openrouter || \
            echo "⚠️ Échec enregistrement clé OpenRouter"

          echo "======================================"
          echo "Configuration du modèle principal"
          echo "======================================"

          ~/.npm-global/bin/openclaw models set \
            openrouter/minimax/minimax-m3:free || true

          echo "======================================"
          echo "Vérification de la configuration"
          echo "======================================"

          ~/.npm-global/bin/openclaw config get plugins.entries.perplexity.enabled 2>/dev/null || true

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.

          1. Explore le site comme un humain : scroll, observe la structure.

          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.

          3. Teste chacune de ces actions et vérifie le résultat attendu.

          4. Si une action t'amène sur une NOUVELLE URL (navigation, clic sur un
          lien, soumission de formulaire, etc.), traite cette URL comme une
          page à part entière à surveiller : note son statut individuellement,
          pas seulement l'action qui y a mené.

          5. Si erreur JS, page blanche, ou action qui ne fait rien, prends une
          capture d'écran et note-le.

          6. Termine ta réponse par TON VERDICT EN LANGAGE NATUREL COMME AVANT,
          puis ajoute IMPÉRATIVEMENT à la toute fin, dans un bloc de code
          ```json
          un objet structuré au format EXACT suivant :

          ```json
          {
            "overall_status": "UP",
            "pages": [
              {
                "url": "URL exacte visitée",
                "status": "UP",
                "http_code": 200,
                "note": "brève explication en une phrase"
              }
            ]
          }
          ```

          - "overall_status" et chaque "status" de page valent uniquement
          "UP" ou "DOWN" (majuscules, rien d'autre).

          - Inclus une entrée "pages" pour l'URL de départ ET pour chaque
          URL distincte atteinte pendant l'exploration (y compris les
          404 ou erreurs).

          - "http_code" est le code HTTP observé si tu as pu le déterminer,
          sinon null.
          EOF

      - name: Lancer OpenClaw avec Gateway
        id: agent_run
        run: |

          set +e

          # ============================================================
          # MODELES OPENROUTER GRATUITS
          # ============================================================

          OPENROUTER_FALLBACK_MODELS=(
            "openrouter/minimax/minimax-m3:free"
            "openrouter/z-ai/glm-5.2:free"
          )

          # ============================================================
          # DESACTIVATION DEFINITIVE DE PERPLEXITY
          # ============================================================

          disable_unneeded_plugins() {

            echo "======================================"
            echo "Désactivation des plugins inutiles"
            echo "======================================"

            ~/.npm-global/bin/openclaw plugins disable perplexity \
              2>/dev/null || true

            # Réécrit explicitement la configuration.
            # Cela évite que le Gateway recharge Perplexity
            # comme plugin actif.

            node << 'NODE'
          const fs = require("fs");

          const path = process.env.HOME + "/.openclaw/openclaw.json";

          let config = {};

          if (fs.existsSync(path)) {
            config = JSON.parse(fs.readFileSync(path, "utf8"));
          }

          config.plugins = config.plugins || {};
          config.plugins.entries = config.plugins.entries || {};

          config.plugins.entries.perplexity = {
            enabled: false
          };

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log("Perplexity forcé à enabled=false");
          NODE

            echo "Configuration finale :"

            jq '.plugins.entries.perplexity' \
              ~/.openclaw/openclaw.json \
              2>/dev/null || true
          }

          # ============================================================
          # DEMARRAGE DU GATEWAY
          # ============================================================

          start_gateway() {

            echo "======================================"
            echo "Démarrage du Gateway"
            echo "======================================"

            disable_unneeded_plugins

            ~/.npm-global/bin/openclaw gateway stop \
              2>/dev/null || true

            sleep 2

            # Nettoyage uniquement des processus Gateway existants.
            pkill -f "openclaw gateway" \
              2>/dev/null || true

            sleep 3

            # Dernière vérification avant démarrage.
            disable_unneeded_plugins

            echo "Lancement du Gateway..."

            nohup ~/.npm-global/bin/openclaw gateway \
              --force \
              --port 18789 \
              --allow-unconfigured \
              > gateway.log 2>&1 &

            GATEWAY_PID=$!

            echo "Gateway PID: $GATEWAY_PID"

            echo "⏳ Attente du Gateway..."

            for i in $(seq 1 30); do

              sleep 1

              if ~/.npm-global/bin/openclaw gateway status \
                2>/dev/null | grep -qi "running"; then

                echo "✅ Gateway opérationnel"

                return 0

              fi

              # Vérifie également si le processus existe toujours.
              if ! kill -0 "$GATEWAY_PID" 2>/dev/null; then

                echo "❌ Le processus Gateway s'est arrêté."

                echo "======================================"
                echo "gateway.log"
                echo "======================================"

                cat gateway.log 2>/dev/null || true

                return 1

              fi

            done

            echo "❌ Gateway non disponible après 30 secondes"

            echo "======================================"
            echo "gateway.log"
            echo "======================================"

            cat gateway.log 2>/dev/null || true

            echo "======================================"

            return 1
          }

          # ============================================================
          # EXECUTION AGENT
          # ============================================================

          run_agent() {

            local model="$1"
            local session_suffix="$2"

            echo "======================================"
            echo "Test avec $model"
            echo "Site : ${{ matrix.site.url }}"
            echo "======================================"

            ~/.npm-global/bin/openclaw models set "$model" || true

            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}-$session_suffix" \
              --message-file task.md \
              --json > output.json 2>&1

            cat output.json
          }

          # ============================================================
          # DETECTION SUCCES
          # ============================================================

          is_success() {

            local status

            status=$(jq -r \
              '[.. | .status? // empty] |
              map(select(type == "string")) |
              first // empty' \
              output.json 2>/dev/null)

            echo "Statut détecté : $status"

            echo "$status" | grep -qiE '^(up|ok)$'
          }

          # ============================================================
          # DETECTION GATEWAY
          # ============================================================

          gateway_actually_down() {

            grep -qi \
              "ECONNREFUSED\|gateway not reachable\|Gateway not reachable" \
              output.json 2>/dev/null
          }

          # ============================================================
          # DETECTION AUTH
          # ============================================================

          auth_error() {

            grep -qi \
              "401\|unauthorized\|invalid api key\|no api key" \
              output.json 2>/dev/null
          }

          # ============================================================
          # DETECTION MODELE INTROUVABLE
          # ============================================================

          model_not_found() {

            grep -qi \
              "model was not found\|model_not_found\|model.*not.*found\|unknown model" \
              output.json 2>/dev/null
          }

          # ============================================================
          # DETECTION RATE LIMIT
          # ============================================================

          rate_limit() {

            grep -qi \
              "429\|rate limit\|too many requests\|quota" \
              output.json 2>/dev/null
          }

          # ============================================================
          # DEMARRAGE GATEWAY
          # ============================================================

          if ! start_gateway; then

            echo "❌ Impossible de démarrer le Gateway."

            echo "agent_failed=true" >> "$GITHUB_OUTPUT"

          else

            # ==========================================================
            # ESSAI 1 : MINIMAX
            # ==========================================================

            run_agent \
              "openrouter/minimax/minimax-m3:free" \
              "minimax1"

            if is_success; then

              echo "✅ Succès avec MiniMax"

              echo "agent_failed=false" >> "$GITHUB_OUTPUT"

              exit 0

            fi

            # ==========================================================
            # SI GATEWAY TOMBE
            # ==========================================================

            if gateway_actually_down; then

              echo "🔄 Gateway injoignable."

              if start_gateway; then

                run_agent \
                  "openrouter/minimax/minimax-m3:free" \
                  "minimax2"

                if is_success; then

                  echo "✅ Succès avec MiniMax après redémarrage"

                  echo "agent_failed=false" >> "$GITHUB_OUTPUT"

                  exit 0

                fi

              fi

            elif rate_limit; then

              echo "⚠️ Rate limit MiniMax."

              sleep 30

              run_agent \
                "openrouter/minimax/minimax-m3:free" \
                "minimax2"

              if is_success; then

                echo "✅ Succès avec MiniMax après rate limit"

                echo "agent_failed=false" >> "$GITHUB_OUTPUT"

                exit 0

              fi

            fi

            # ==========================================================
            # FALLBACK GLM
            # ==========================================================

            echo "======================================"
            echo "🔁 Fallback OpenRouter"
            echo "======================================"

            run_agent \
              "openrouter/z-ai/glm-5.2:free" \
              "glm1"

            if is_success; then

              echo "✅ Succès avec GLM"

              echo "agent_failed=false" >> "$GITHUB_OUTPUT"

              exit 0

            fi

            # ==========================================================
            # DIAGNOSTIC FINAL
            # ==========================================================

            if auth_error; then

              echo "🛑 Erreur d'authentification OpenRouter."

            elif model_not_found; then

              echo "🛑 Modèle OpenRouter introuvable."

            elif rate_limit; then

              echo "🛑 Rate limit OpenRouter."

            elif gateway_actually_down; then

              echo "🛑 Gateway OpenClaw inaccessible."

            else

              echo "🛑 Erreur OpenClaw non catégorisée."

            fi

            echo "❌ Aucun modèle OpenRouter gratuit n'a fonctionné."

            echo "agent_failed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Extraire et envoyer le résultat
        if: always()
        run: |

          if [ ! -f output.json ] || [ ! -s output.json ]; then

            STATUS="ERROR"
            REASON="Agent output missing or empty"

          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then

            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"

          else

            AGENT_TEXT=$(jq -r \
              '[.. | .text? // empty] |
              map(select(type == "string")) |
              first // ""' \
              output.json 2>/dev/null)

            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ {
                capture=1
                buf=""
                next
              }

              /```/ {
                if (capture) {
                  last=buf
                  capture=0
                }
                next
              }

              capture {
                buf = buf $0 "\n"
              }

              END {
                printf "%s", last
              }
            ')

            if echo "$PAGES_JSON" | \
              jq -e '.overall_status and .pages' \
              > /dev/null 2>&1; then

              STATUS=$(echo "$PAGES_JSON" | \
                jq -r '.overall_status // "UNKNOWN"')

              REASON=$(echo "$PAGES_JSON" | \
                jq -c '.pages')

              echo "$PAGES_JSON" > pages.json

              echo "📄 Pages rapportées :"

              echo "$PAGES_JSON" | \
                jq -r \
                '.pages[] |
                "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.note // "")"'

            else

              echo "⚠️ Bloc JSON structuré introuvable."

              STATUS=$(jq -r \
                '[.. | .status? // empty] |
                map(select(type == "string")) |
                first // "UNKNOWN"' \
                output.json 2>/dev/null)

              REASON=$(jq -r \
                '[.. | .text? // empty] |
                map(select(type == "string")) |
                first // ""' \
                output.json 2>/dev/null |
                head -c 300)

              if [ -z "$STATUS" ] || [ "$STATUS" == "null" ]; then

                if grep -qi "up" output.json; then

                  STATUS="UP"
                  REASON="Site appears operational"

                elif grep -qi "down" output.json; then

                  STATUS="DOWN"
                  REASON="Site appears down"

                else

                  STATUS="UNKNOWN"
                  REASON="No status indicator found in output"

                fi

              fi

            fi

          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          jq -n \
            --arg status "$STATUS" \
            --arg message "$REASON" \
            '{
              status: $status,
              message: $message
            }' |
          curl \
            -X POST \
            "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "Relay report failed"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: openclaw-${{ matrix.site.id }}

          path: |
            gateway.log
            output.json
            pages.json
            ~/.openclaw/workspace/screenshots/
