name: AutoSpec Agent - Monitoring Autonome Multi-Sites
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "ID du site à tester spécifiquement (optionnel)"
        required: false
        type: string
  # 2 runs/jour (8h et 20h) : préserve quotas gratuits ET minutes GitHub
  schedule:
    - cron: "0 8,20 * * *"

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. RÉCUPÉRER LES SITES ACTIFS
  # ============================================================
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID="${SITE_ID_INPUT:-}"
          if [ -n "$SITE_ID" ]; then
            echo "Test cible sur $SITE_ID"
            DETAIL=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors/$SITE_ID")
            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')
            if [ -z "$MONITOR" ] || [ "$MONITOR" = "null" ]; then
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ALL_MONITORS=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent | tostring) == $sid) | {url: .url, name: .name}]')
            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            RAW=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/active-sites")
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "[]")
            [ -z "$SITES_RAW" ] || [ "$SITES_RAW" = "null" ] && SITES_RAW="[]"
            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              SID=$(echo "$site" | jq -r '.id')
              ALL_MONITORS=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
              PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$SID" '[.monitors[]? | select(.type == "http" and (.parent | tostring) == $sid) | {url: .url, name: .name}]')
              SITE_WITH_PAGES=$(echo "$site" | jq -c --argjson pages "$PAGES" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$SITE_WITH_PAGES" '. + [$site]')
            done < <(echo "$SITES_RAW" | jq -c '.[]?')
            SITES="$SITES_ARRAY"
          fi
          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "Sites a monitorer :"
          echo "$SITES" | jq .

  # ============================================================
  # 2. AGENT OPENBROWSER-AI (APINEX : free/mimo-v2.6-pro)
  # ============================================================
  autospec-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: autospec-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer OpenBrowser-AI + ffmpeg (compression preview)
        run: |
          set -euo pipefail
          pip install --quiet "openbrowser-ai[agent,video]"
          pip install --quiet openai
          pip install --quiet langchain-core
          pip install --quiet cactus-needle
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "ffmpeg : $(which ffmpeg)"

      - name: Détecter le type de site
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ matrix.site.url }}"
          HTML=$(curl -fsSL --max-time 15 "$URL" 2>/dev/null || echo "")
          if echo "$HTML" | grep -qiE '(marketplace|vendeur|seller|multi-vendor|boutique)'; then
            TYPE="marketplace"
          elif echo "$HTML" | grep -qiE '(panier|cart|checkout|prix|price|produit|acheter)'; then
            TYPE="ecommerce"
          elif echo "$HTML" | grep -qiE '(login|connexion|dashboard|subscription|pricing)'; then
            TYPE="saas"
          elif echo "$HTML" | grep -qiE '(blog|article|post|news)'; then
            TYPE="blog"
          else
            TYPE="generic"
          fi
          echo "TYPE=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Type detecte : $TYPE"

      - name: Générer le prompt adaptatif
        id: prompt
        shell: bash
        run: |
          TYPE="${{ steps.detect.outputs.TYPE }}"
          case "$TYPE" in
            marketplace)
              REQ="1. Type a product name in the search bar, click Search, assert results appear. 2. Click the first product, assert the detail page loads."
              ;;
            ecommerce)
              REQ="1. Find a product listing, assert price visible. 2. Click Add to Cart, assert cart count updates."
              ;;
            saas)
              REQ="1. Locate login form, fill with fake creds, submit, assert dashboard or clear error."
              ;;
            blog)
              REQ="1. Assert 3+ articles listed. 2. Click first article, assert full content loads."
              ;;
            *)
              REQ="1. Assert page title is not a placeholder. 2. Click a link, assert URL changes."
              ;;
          esac
          echo "REQUIREMENTS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REQ" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Préparer les dossiers
        run: |
          mkdir -p recordings recordings-preview

      - name: Exécuter le monitoring (APINEX)
        env:
          SITE_URL: ${{ matrix.site.url }}
          SITE_ID: ${{ matrix.site.id }}
          SITE_TYPE: ${{ steps.detect.outputs.TYPE }}
          REQUIREMENTS: ${{ steps.prompt.outputs.REQUIREMENTS }}
          PAGES_JSON: ${{ toJSON(matrix.site.pages) }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          APINEX_BASE_URL: "https://api.apinex.bond/v1"
          APINEX_MODEL: "free/mimo-v2.6-pro"
          USE_VISION: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -u run_monitor.py 2>&1 | tee execution.log

      - name: Afficher le résultat
        if: always()
        run: |
          if [ -f output.json ]; then jq . output.json; else echo "output.json absent"; fi

      - name: Envoyer le rapport des pages
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          [ ! -f output.json ] && exit 0
          if jq -e '.pages' output.json >/dev/null 2>&1; then
            jq -c '{pages: .pages}' output.json > pages_payload.json
            curl -sS --retry 3 -X POST "$RELAY_URL/sites/$SITE_ID/pages-report" \
              -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @pages_payload.json
          fi

      - name: Envoyer le statut global
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          STATUS="ERROR"; MESSAGE="OpenBrowser-AI error"
          if [ -f output.json ]; then
            STATUS=$(jq -r '.overall_status // "ERROR"' output.json | tr '[:lower:]' '[:upper:]')
            MESSAGE=$(jq -c '{actions_completed, model_used, pages}' output.json)
          fi
          jq -nc --arg status "$STATUS" --arg message "$MESSAGE" \
            '{status: $status, message: $message}' > status_payload.json
          curl -sS --retry 3 -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @status_payload.json

      - name: Compresser la vidéo (preview mobile)
        if: always()
        run: |
          set +e
          FOUND=$(ls recordings/*.mp4 2>/dev/null | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Aucune vidéo trouvée dans recordings/ — étape ignorée"
            exit 0
          fi
          echo "Vidéo source : $FOUND ($(du -h "$FOUND" | cut -f1))"
          ffmpeg -y -i "$FOUND" \
            -vf "scale=640:-2" -c:v libx264 -crf 30 -preset veryfast \
            -movflags +faststart -an \
            recordings-preview/preview.mp4
          ffmpeg -y -ss 1 -i "$FOUND" -frames:v 1 -update 1 \
            recordings-preview/thumb.jpg
          if [ -f recordings-preview/preview.mp4 ]; then
            echo "Preview générée : $(du -h recordings-preview/preview.mp4 | cut -f1)"
          else
            echo "Échec de la compression ffmpeg"
          fi
          if [ -f recordings-preview/thumb.jpg ]; then
            echo "Miniature générée : $(du -h recordings-preview/thumb.jpg | cut -f1)"
          else
            echo "Échec de la génération de la miniature"
          fi

      - name: Uploader vidéo + miniature vers Supabase Storage
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          BUCKET="monitoring-videos"
          TS=$(date +%s)
          VIDEO_URL=""
          THUMB_URL=""

          if [ -f recordings-preview/preview.mp4 ]; then
            VIDEO_PATH="${SITE_ID}/latest.mp4"
            HTTP_CODE=$(curl -sS -o /tmp/upload_video.log -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${VIDEO_PATH}?upsert=true" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: video/mp4" \
              --data-binary "@recordings-preview/preview.mp4")
            echo "Upload vidéo -> HTTP $HTTP_CODE"
            cat /tmp/upload_video.log
            if [ "$HTTP_CODE" = "200" ]; then
              VIDEO_URL="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${VIDEO_PATH}?t=${TS}"
            fi
          fi

          if [ -f recordings-preview/thumb.jpg ]; then
            THUMB_PATH="${SITE_ID}/latest.jpg"
            HTTP_CODE=$(curl -sS -o /tmp/upload_thumb.log -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${THUMB_PATH}?upsert=true" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: image/jpeg" \
              --data-binary "@recordings-preview/thumb.jpg")
            echo "Upload miniature -> HTTP $HTTP_CODE"
            cat /tmp/upload_thumb.log
            if [ "$HTTP_CODE" = "200" ]; then
              THUMB_URL="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${THUMB_PATH}?t=${TS}"
            fi
          fi

          echo "video_url=${VIDEO_URL}"
          echo "thumbnail_url=${THUMB_URL}"

          if [ -n "$VIDEO_URL" ] || [ -n "$THUMB_URL" ]; then
            jq -nc --arg v "$VIDEO_URL" --arg t "$THUMB_URL" \
              '{video_url: $v, thumbnail_url: $t}' > video_payload.json
            curl -sS --retry 3 -X POST "$RELAY_URL/sites/$SITE_ID/attach-video" \
              -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" \
              -d @video_payload.json
          else
            echo "Rien à envoyer au relay (pas de vidéo/miniature uploadée)"
          fi

      - name: Uploader les artifacts (debug/fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbrowser-monitoring-${{ matrix.site.id }}
          path: |
            recordings/
            recordings-preview/
            output.json
            execution.log
          if-no-files-found: warn
          retention-days: 3
