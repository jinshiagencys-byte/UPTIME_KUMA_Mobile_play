name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (fichier minimal)
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "mistral": {
                  "api": "openai",
                  "baseUrl": "https://api.mistral.ai/v1",
                  "models": [
                    { "id": "mistral-small-latest", "name": "mistral-small-latest" }
                  ]
                },
                "google": {
                  "models": [
                    { "id": "gemini-2.5-pro", "name": "gemini-2.5-pro" }
                  ]
                }
              }
            }
          }
          EOF

          # Consentement de capacités requis pour que le plugin mistral
          # se charge correctement au démarrage du Gateway (sinon "Plugin
          # mistral requires capability consent" et le Gateway ne démarre pas)
          ~/.npm-global/bin/openclaw plugins install mistral --accept-capabilities 2>/dev/null || true
          ~/.npm-global/bin/openclaw plugins enable mistral --accept-capabilities 2>/dev/null || true

          # Enregistrer les clés API dans le auth store d'OpenClaw : les
          # variables d'env seules ne sont PAS reprises automatiquement par
          # tous les providers (vu en CI : "No API key found for provider").
          printf "%s\n" "$MISTRAL_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider mistral || echo "⚠️ Échec enregistrement clé Mistral"
          printf "%s\n" "$GOOGLE_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider google || echo "⚠️ Échec enregistrement clé Google"

          # Utiliser `models set` (et non `config set agents.defaults.model`) :
          # cette commande configure aussi le runtime associé au modèle, ce qui
          # évite que le Gateway retombe sur son défaut openai/* nécessitant
          # le plugin "codex" (non installé/non authentifié ici).
          ~/.npm-global/bin/openclaw models set mistral/mistral-small-latest || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.
          3. Teste chacune de ces actions et vérifie le résultat attendu.
          4. Si erreur JS, page blanche, ou action qui ne fait rien, prends une capture d'écran et note-le.
          5. Termine par un verdict UP ou DOWN avec la liste des actions testées.
          EOF

      - name: Lancer OpenClaw (avec Gateway persistent)
        id: agent_run
        run: |
          set +e

          # Fonction pour démarrer le Gateway avec vérification.
          # Appelée UNE SEULE FOIS pour tout le job : changer de modèle entre
          # tentatives ne nécessite pas de redémarrage ("Change will apply
          # without restarting the gateway"), et le check de statut par grep
          # s'est révélé peu fiable (faux "not running" alors que le process
          # tournait), provoquant des conflits "already owns this state
          # directory". On ne redémarre donc plus qu'en tout dernier recours,
          # si l'agent ne peut vraiment plus joindre le Gateway.
          start_gateway() {
            echo "🔧 Démarrage du Gateway..."
            ~/.npm-global/bin/openclaw gateway stop 2>/dev/null || true
            pkill -f "openclaw gateway" || true
            sleep 3
            ~/.npm-global/bin/openclaw plugins enable mistral --accept-capabilities 2>/dev/null || true
            nohup ~/.npm-global/bin/openclaw gateway --force --port 18789 --allow-unconfigured > gateway.log 2>&1 &
            echo "⏳ Attente du Gateway (30s)..."
            sleep 30
            if ~/.npm-global/bin/openclaw gateway status 2>&1 | grep -q "running"; then
              echo "✅ Gateway opérationnel"
              return 0
            else
              echo "❌ Gateway non disponible"
              cat gateway.log
              return 1
            fi
          }

          # Fonction pour exécuter l'agent avec un modèle donné.
          # Ne touche jamais au Gateway — seulement au modèle par défaut.
          run_agent() {
            local model=$1
            local session_suffix=$2
            echo "======================================"
            echo "Test avec $model pour ${{ matrix.site.url }}"
            echo "======================================"
            ~/.npm-global/bin/openclaw models set "$model" || true
            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}-$session_suffix" \
              --message-file task.md \
              --json > output.json 2>&1
            cat output.json
          }

          is_success() {
            # Utilise jq pour trouver n'importe quel champ "status" à
            # n'importe quelle profondeur (le JSON de sortie est indenté et
            # sa structure peut varier — un grep sur une forme compacte
            # ratait les succès réels et déclenchait un fallback inutile)
            local status
            status=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // empty' "$1" 2>/dev/null)
            echo "$status" | grep -qiE '^(up|ok)$'
          }

          # Le Gateway ne meurt vraiment que si le message d'erreur le confirme
          # explicitement (ECONNREFUSED / gateway not reachable) — pas sur un
          # simple échec applicatif (mauvais modèle, clé manquante, etc.)
          gateway_actually_down() {
            grep -qi "ECONNREFUSED\|gateway not reachable\|gateway may still be running" "$1"
          }

          # Démarrage unique du Gateway pour tout le job
          start_gateway || true

          # Essai 1 : Mistral
          run_agent "mistral/mistral-small-latest" "mistral1"

          if is_success output.json; then
            echo "✅ Succès avec Mistral"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Si le Gateway est vraiment injoignable, un seul redémarrage puis nouvel essai Mistral
          if gateway_actually_down output.json; then
            echo "🔄 Gateway injoignable, redémarrage..."
            start_gateway || true
            run_agent "mistral/mistral-small-latest" "mistral2"
            if is_success output.json; then
              echo "✅ Succès avec Mistral (2e tentative)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          elif grep -q "rate limit" output.json; then
            echo "⚠️ Rate limit détecté, nouvelle tentative dans 30s..."
            sleep 30
            run_agent "mistral/mistral-small-latest" "mistral2"
            if is_success output.json; then
              echo "✅ Succès avec Mistral (2e tentative)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Fallback : Google Gemini (même Gateway, juste un changement de modèle)
          echo "======================================"
          echo "🔁 Fallback sur Google Gemini"
          echo "======================================"
          run_agent "google/gemini-2.5-pro" "gemini1"

          if is_success output.json; then
            echo "✅ Succès avec Google Gemini"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Échec final avec Google Gemini"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat
        if: always()
        run: |
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
          else
            # Recherche récursive du champ "status" à n'importe quelle
            # profondeur, plus fiable que des chemins jq fixes (`.result.
            # payloads[0].status`) quand la structure de sortie varie.
            STATUS=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // "UNKNOWN"' output.json 2>/dev/null)
            REASON=$(jq -r '[.. | .text? // empty] | map(select(type == "string")) | first // ""' output.json 2>/dev/null | head -c 300)
            if [ -z "$STATUS" ] || [ "$STATUS" == "null" ]; then
              if grep -qi "up" output.json; then
                STATUS="UP"
                REASON="Site appears operational (extracted from text)"
              elif grep -qi "down" output.json; then
                STATUS="DOWN"
                REASON="Site appears down (extracted from text)"
              else
                STATUS="UNKNOWN"
                REASON="No status indicator found in output"
              fi
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" \
            || echo "Relay report failed"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
