name: OpenClaw - Test Autonome sur usinformatique.com (fallback fiable)

on:
  workflow_dispatch:

jobs:
  autonomous-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright (pour le navigateur)
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenClaw (via script officiel)
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (browser et gateway)
        run: |
          ~/.npm-global/bin/openclaw config set browser.enabled true
          ~/.npm-global/bin/openclaw config set browser.headless true
          ~/.npm-global/bin/openclaw config set browser.noSandbox true
          ~/.npm-global/bin/openclaw config set browser.defaultProfile openclaw
          ~/.npm-global/bin/openclaw config set gateway.mode "local"
          ~/.npm-global/bin/openclaw config set gateway.auth.token "ci-test-token-12345"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Démarrer le Gateway OpenClaw en arrière-plan
        run: |
          nohup ~/.npm-global/bin/openclaw gateway --force > gateway.log 2>&1 &
          echo "Attente du démarrage du Gateway..."
          sleep 10
          ~/.npm-global/bin/openclaw gateway status || true
          cat gateway.log
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Écrire la tâche dans un fichier
        run: |
          cat > task.md << 'EOF'
          Va sur https://usinformatique.com avec l'outil browser. Explore le site comme un humain : scroll, clique sur un produit, ajoute-le au panier, puis vérifie que le produit est bien présent dans le panier après l'ajout. Si tu vois des erreurs JavaScript ou des pages blanches, prends une capture d'écran. À la fin, dis-moi si le site est UP ou DOWN, avec une explication précise de ce que tu as testé (y compris si le panier a réellement fonctionné ou affiché une erreur).
          EOF

      - name: Lancer OpenClaw avec fallback sur modèles confirmés
        id: agent_run
        run: |
          set +e

          # Liste des modèles gratuits fiables (identifiants exacts)
          MODELS=(
            "nvidia/nemotron-3-ultra:free"
            "nvidia/nemotron-3.5-lightning:free"
            "nvidia/nemotron-3-super:free"
            "thinkingmachines/inkling:free"
            "minimax/minimax-m2.7:free"
            "cohere/north-mini-code:free"
            "openrouter/free"   # fallback ultime : choisit automatiquement le meilleur disponible
          )

          SUCCESS=false
          for MODEL in "${MODELS[@]}"; do
            echo "======================================"
            echo "Essai du modèle : $MODEL"
            echo "======================================"

            ~/.npm-global/bin/openclaw config set agents.defaults.model.primary "$MODEL"

            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:usinformatique-test" \
              --message-file task.md \
              --json > output.json 2>&1

            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Succès avec le modèle $MODEL"
              SUCCESS=true
              cat output.json
              break
            else
              echo "❌ Échec avec le modèle $MODEL (code $EXIT_CODE)"
              echo "--- Sortie d'erreur ---"
              cat output.json
              echo "----------------------"
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "Aucun modèle n'a fonctionné."
            exit 1
          fi

          exit 0

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Upload des logs et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-screenshots
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
