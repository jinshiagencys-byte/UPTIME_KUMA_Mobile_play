````yaml
name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}

    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout du code
        uses: actions/checkout@v4

      # ============================================================
      # PLAYWRIGHT
      # ============================================================

      - name: Installer Playwright
        run: |
          npx playwright install --with-deps chromium

      # ============================================================
      # OPENCLAW
      # ============================================================

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash

          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

          ~/.npm-global/bin/openclaw --version

      # ============================================================
      # CONFIGURATION OPENCLAW + OPENROUTER
      # ============================================================

      - name: Configurer OpenClaw
        run: |
          mkdir -p ~/.openclaw

          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },

            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },

            "models": {
              "providers": {
                "openrouter": {
                  "api": "openai-completions",
                  "baseUrl": "https://openrouter.ai/api/v1"
                }
              }
            },

            "agents": {
              "defaults": {
                "model": {
                  "primary": "openrouter/free",
                  "fallbacks": [
                    "openrouter/minimax/minimax-m3:free",
                    "openrouter/z-ai/glm-5.2:free"
                  ]
                }
              }
            }
          }
          EOF

          echo "======================================"
          echo "Configuration OpenClaw"
          echo "======================================"

          cat ~/.openclaw/openclaw.json

          echo "======================================"
          echo "Enregistrement de la clé OpenRouter"
          echo "======================================"

          printf "%s\n" "$OPENROUTER_API_KEY" | \
            ~/.npm-global/bin/openclaw models auth paste-api-key \
            --provider openrouter || {
              echo "⚠️ Impossible d'enregistrer la clé OpenRouter"
              exit 1
            }

          echo "======================================"
          echo "Configuration du modèle principal"
          echo "======================================"

          ~/.npm-global/bin/openclaw models set openrouter/free

          echo "======================================"
          echo "Modèles configurés"
          echo "======================================"

          ~/.npm-global/bin/openclaw models status || true

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # ============================================================
      # GENERATION DE LA TACHE
      # ============================================================

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.

          Tu dois effectuer un monitoring autonome du site comme un humain.

          1. Ouvre le site.

          2. Explore le site :
             - observe la structure ;
             - fais défiler la page ;
             - identifie les éléments importants ;
             - vérifie que les éléments visibles fonctionnent.

          3. Identifie toi-même les 2 ou 3 actions les plus importantes
             de ce site.

          Exemples :
             - navigation vers une page importante ;
             - clic sur un bouton ;
             - recherche ;
             - ouverture d'un menu ;
             - soumission d'un formulaire ;
             - accès à une page de contact ;
             - accès à une page produit/service.

          4. Teste chacune de ces actions et vérifie le résultat attendu.

          5. Si une action entraîne une NOUVELLE URL :
             - considère cette URL comme une page indépendante ;
             - vérifie son fonctionnement ;
             - note son statut individuellement.

          6. Si tu observes :
             - erreur JavaScript ;
             - page blanche ;
             - bouton qui ne fonctionne pas ;
             - navigation bloquée ;
             - contenu qui ne charge pas ;
             - erreur HTTP ;
             - formulaire qui ne fonctionne pas ;

             alors prends une capture d'écran si l'outil browser le permet
             et note précisément le problème.

          7. Ne considère pas automatiquement le site comme DOWN simplement
             parce qu'une fonctionnalité particulière échoue.

          8. À la fin, donne un verdict clair en langage naturel.

          9. Puis termine IMPÉRATIVEMENT ta réponse par un unique bloc
             JSON respectant exactement cette structure :

          ```json
          {
            "overall_status": "UP",
            "pages": [
              {
                "url": "URL exacte visitée",
                "status": "UP",
                "http_code": 200,
                "note": "brève explication en une phrase"
              }
            ]
          }
          ```

          RÈGLES DU JSON :

          - "overall_status" vaut uniquement "UP" ou "DOWN".
          - "status" vaut uniquement "UP" ou "DOWN".
          - "pages" doit contenir l'URL de départ.
          - "pages" doit également contenir chaque URL distincte atteinte.
          - Inclus également les URLs ayant retourné une erreur.
          - "http_code" doit être le code HTTP observé si disponible.
          - Si le code HTTP n'est pas déterminable, utilise null.
          - "note" doit être courte et descriptive.
          - Ne mets aucun commentaire dans le JSON.
          - Le bloc JSON doit être le DERNIER élément de ta réponse.
          EOF

      # ============================================================
      # GATEWAY
      # ============================================================

      - name: Lancer OpenClaw avec Gateway persistent
        id: agent_run
        run: |
          set +e

          echo "======================================"
          echo "Démarrage du Gateway OpenClaw"
          echo "======================================"

          start_gateway() {
            echo "🔧 Arrêt d'une éventuelle ancienne instance..."

            ~/.npm-global/bin/openclaw gateway stop 2>/dev/null || true

            pkill -f "openclaw gateway" 2>/dev/null || true

            sleep 3

            echo "🚀 Démarrage du Gateway..."

            nohup ~/.npm-global/bin/openclaw gateway \
              --force \
              --port 18789 \
              --allow-unconfigured \
              > gateway.log 2>&1 &

            echo "⏳ Attente du Gateway..."

            sleep 30

            if ~/.npm-global/bin/openclaw gateway status 2>&1 | grep -qi "running"; then
              echo "✅ Gateway opérationnel"
              return 0
            fi

            echo "⚠️ Le statut du Gateway n'est pas confirmé."

            echo "===== gateway.log ====="
            cat gateway.log
            echo "======================="

            return 1
          }

          start_gateway

          echo "======================================"
          echo "Modèle principal"
          echo "======================================"

          ~/.npm-global/bin/openclaw models set openrouter/free

          echo "======================================"
          echo "Lancement de l'agent"
          echo "======================================"

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          AGENT_EXIT=$?

          echo "======================================"
          echo "Résultat OpenClaw"
          echo "======================================"

          cat output.json

          if [ $AGENT_EXIT -eq 0 ]; then
            echo "agent_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ OpenClaw a retourné le code $AGENT_EXIT"

            echo "agent_failed=true" >> "$GITHUB_OUTPUT"
          fi

          # Si le Gateway est explicitement devenu inaccessible,
          # on effectue une seule nouvelle tentative.

          if grep -qiE \
            "ECONNREFUSED|gateway not reachable|gateway may still be running" \
            output.json; then

            echo "======================================"
            echo "🔄 Gateway injoignable"
            echo "======================================"

            start_gateway

            echo "🔁 Nouvelle tentative..."

            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}-retry" \
              --message-file task.md \
              --json > output.json 2>&1

            RETRY_EXIT=$?

            cat output.json

            if [ $RETRY_EXIT -eq 0 ]; then
              echo "agent_failed=false" >> "$GITHUB_OUTPUT"
            else
              echo "agent_failed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      # ============================================================
      # EXTRACTION DU RESULTAT
      # ============================================================

      - name: Extraire et envoyer le résultat
        if: always()
        run: |

          echo "======================================"
          echo "Extraction du résultat"
          echo "======================================"

          if [ ! -f output.json ] || [ ! -s output.json ]; then

            STATUS="ERROR"
            REASON="Agent output missing or empty"

          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then

            STATUS="ERROR"
            REASON="Agent execution failed"

          else

            # ------------------------------------------------------
            # Récupération du texte final
            # ------------------------------------------------------

            AGENT_TEXT=$(jq -r '
              [.. | .text? // empty]
              | map(select(type == "string"))
              | last // ""
            ' output.json 2>/dev/null)

            echo "===== Texte agent ====="
            printf '%s\n' "$AGENT_TEXT"
            echo "======================="

            # ------------------------------------------------------
            # Extraction du dernier bloc JSON
            # ------------------------------------------------------

            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ {
                capture=1
                buf=""
                next
              }

              /```/ {
                if (capture) {
                  last=buf
                  capture=0
                }
                next
              }

              capture {
                buf = buf $0 "\n"
              }

              END {
                printf "%s", last
              }
            ')

            echo "===== JSON détecté ====="
            printf '%s\n' "$PAGES_JSON"
            echo "========================"

            # ------------------------------------------------------
            # Validation du JSON
            # ------------------------------------------------------

            if echo "$PAGES_JSON" | jq -e '
              (.overall_status == "UP" or .overall_status == "DOWN")
              and (.pages | type == "array")
            ' > /dev/null 2>&1; then

              echo "✅ JSON structuré valide"

              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status')

              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')

              echo "$PAGES_JSON" > pages.json

              PAGE_COUNT=$(echo "$PAGES_JSON" | jq '.pages | length')

              echo "📄 $PAGE_COUNT page(s) rapportée(s)"

              echo "$PAGES_JSON" | jq -r '
                .pages[]
                | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.note // "")"
              '

            else

              echo "⚠️ JSON structuré introuvable ou invalide"

              # ----------------------------------------------------
              # Fallback extraction
              # ----------------------------------------------------

              STATUS=$(jq -r '
                [.. | .status? // empty]
                | map(select(type == "string"))
                | map(ascii_upcase)
                | map(select(. == "UP" or . == "DOWN"))
                | first // "UNKNOWN"
              ' output.json 2>/dev/null)

              REASON=$(jq -r '
                [.. | .text? // empty]
                | map(select(type == "string"))
                | last // ""
              ' output.json 2>/dev/null | head -c 500)

              if [ "$STATUS" == "UNKNOWN" ]; then

                if grep -qi "UP" output.json; then
                  STATUS="UP"
                  REASON="Site appears operational"

                elif grep -qi "DOWN" output.json; then
                  STATUS="DOWN"
                  REASON="Site appears unavailable"

                else
                  STATUS="UNKNOWN"
                  REASON="No status indicator found"
                fi

              fi

            fi

          fi

          # ========================================================
          # AFFICHAGE
          # ========================================================

          echo "======================================"
          echo "Statut final : $STATUS"
          echo "Message      : $REASON"
          echo "======================================"

          # ========================================================
          # ENVOI AU RELAY
          # ========================================================

          jq -n \
            --arg status "$STATUS" \
            --arg message "$REASON" \
            '{
              status: $status,
              message: $message
            }' |
          curl \
            --fail-with-body \
            -X POST \
            "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "⚠️ Relay report failed"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      # ============================================================
      # ARTEFACTS
      # ============================================================

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: openclaw-${{ matrix.site.id }}

          path: |
            gateway.log
            output.json
            pages.json
            ~/.openclaw/workspace/screenshots/
````
