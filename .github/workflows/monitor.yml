name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (fichier minimal)
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "auth": {
                "token": "ci-test-token-12345"
              }
            }
          }
          EOF
          # Forcer le modèle par défaut
          ~/.npm-global/bin/openclaw config set agents.defaults.model "mistral/mistral-small-latest" 2>/dev/null || true

      - name: Démarrer le Gateway et vérifier
        id: gateway_start
        run: |
          # Nettoyer les éventuels processus résiduels
          pkill -f "openclaw gateway" || true
          sleep 2

          # Démarrer le gateway
          nohup ~/.npm-global/bin/openclaw gateway --force --port 18789 > gateway.log 2>&1 &
          echo "Attente du démarrage du Gateway..."
          sleep 15

          # Vérifier qu'il répond
          if ~/.npm-global/bin/openclaw gateway status 2>&1 | grep -q "running"; then
            echo "✅ Gateway opérationnel"
            echo "gateway_ok=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Gateway non disponible"
            echo "gateway_ok=false" >> $GITHUB_OUTPUT
            cat gateway.log
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.
          3. Teste chacune de ces actions et vérifie le résultat attendu.
          4. Si erreur JS, page blanche, ou action qui ne fait rien, prends une capture d'écran et note-le.
          5. Termine par un verdict UP ou DOWN avec la liste des actions testées.
          EOF

      - name: Lancer OpenClaw (Mistral)
        id: agent_mistral
        run: |
          set +e

          echo "======================================"
          echo "Essai avec Mistral pour ${{ matrix.site.url }}"
          echo "======================================"

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}-mistral" \
            --message-file task.md \
            --json > output.json 2>&1

          cat output.json

          # Vérifier le succès
          if grep -q '"status":"ok"' output.json || grep -q '"status":"UP"' output.json || grep -qi "up" output.json; then
            echo "✅ Succès avec Mistral"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            echo "used_model=mistral" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Si rate limit, attendre et réessayer une fois
          if grep -q "rate limit" output.json; then
            echo "⚠️ Rate limit détecté, nouvelle tentative dans 30s..."
            sleep 30
            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}-mistral-retry" \
              --message-file task.md \
              --json > output.json 2>&1
            cat output.json
            if grep -q '"status":"ok"' output.json || grep -q '"status":"UP"' output.json || grep -qi "up" output.json; then
              echo "✅ Succès avec Mistral (2e tentative)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              echo "used_model=mistral" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Échec Mistral, on passe au fallback
          echo "❌ Échec de Mistral, fallback sur Google"
          echo "agent_failed=true" >> $GITHUB_OUTPUT

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Relancer le Gateway si nécessaire (avant fallback)
        if: steps.agent_mistral.outputs.agent_failed == 'true'
        run: |
          echo "🔄 Relance du Gateway pour le fallback..."
          pkill -f "openclaw gateway" || true
          sleep 2
          nohup ~/.npm-global/bin/openclaw gateway --force --port 18789 > gateway_fallback.log 2>&1 &
          sleep 15
          if ~/.npm-global/bin/openclaw gateway status 2>&1 | grep -q "running"; then
            echo "✅ Gateway relancé avec succès"
          else
            echo "❌ Échec du redémarrage du gateway"
            cat gateway_fallback.log
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Fallback sur Google Gemini
        if: steps.agent_mistral.outputs.agent_failed == 'true'
        run: |
          set +e

          echo "======================================"
          echo "🔁 Fallback sur Google Gemini pour ${{ matrix.site.url }}"
          echo "======================================"

          ~/.npm-global/bin/openclaw config set agents.defaults.model "google/gemini-2.5-flash" 2>/dev/null || true

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}-gemini" \
            --message-file task.md \
            --json > output_fallback.json 2>&1

          cat output_fallback.json

          if grep -q '"status":"ok"' output_fallback.json || grep -q '"status":"UP"' output_fallback.json || grep -qi "up" output_fallback.json; then
            echo "✅ Succès avec Google Gemini"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            echo "used_model=google-gemini" >> $GITHUB_OUTPUT
            cp output_fallback.json output.json
          else
            echo "❌ Échec final avec Google Gemini"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
            cp output_fallback.json output.json
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat
        if: always()
        run: |
          # Déterminer le fichier de sortie final
          if [ -f output.json ]; then
            FINAL_OUTPUT="output.json"
          elif [ -f output_fallback.json ]; then
            FINAL_OUTPUT="output_fallback.json"
          else
            echo "Aucun output.json trouvé"
            STATUS="ERROR"
            REASON="No output file found"
            curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
              -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" \
              || echo "Relay report failed"
            exit 0
          fi

          # Extraire le statut
          if jq -e '.result.payloads[0].status' "$FINAL_OUTPUT" > /dev/null 2>&1; then
            STATUS=$(jq -r '.result.payloads[0].status // "UNKNOWN"' "$FINAL_OUTPUT")
            REASON=$(jq -r '.result.payloads[0].text' "$FINAL_OUTPUT" | head -c 300)
          elif jq -e '.status' "$FINAL_OUTPUT" > /dev/null 2>&1; then
            STATUS=$(jq -r '.status // "UNKNOWN"' "$FINAL_OUTPUT")
            REASON=$(jq -r '.text // .message // ""' "$FINAL_OUTPUT" | head -c 300)
          else
            # Fallback sur détection textuelle
            if grep -qi "up" "$FINAL_OUTPUT"; then
              STATUS="UP"
              REASON="Site appears operational (extracted from text)"
            elif grep -qi "down" "$FINAL_OUTPUT"; then
              STATUS="DOWN"
              REASON="Site appears down (extracted from text)"
            else
              STATUS="UNKNOWN"
              REASON="No status indicator found in output"
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          # Envoyer au relay
          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" \
            || echo "Relay report failed"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            gateway_fallback.log
            output.json
            output_fallback.json
            ~/.openclaw/workspace/screenshots/
