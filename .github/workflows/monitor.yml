name: AutoSpec Agent - Monitoring Autonome Multi-Sites (OpenBrowser-AI)

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "ID du site à tester spécifiquement (optionnel)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. RÉCUPÉRER LES SITES (inchangé)
  # ============================================================
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_ID="${SITE_ID_INPUT:-}"

          if [ -n "$SITE_ID" ]; then
            echo "🔍 Test ciblé sur le site $SITE_ID"
            DETAIL=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors/$SITE_ID")
            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')

            if [ -z "$MONITOR" ] || [ "$MONITOR" = "null" ]; then
              echo "❌ Site $SITE_ID introuvable ou erreur relay"
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MONITORS=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent | tostring) == $sid) | {url: .url, name: .name}]')
            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            echo "📡 Récupération de tous les sites actifs..."
            RAW=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/active-sites")
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "[]")
            [ -z "$SITES_RAW" ] || [ "$SITES_RAW" = "null" ] && SITES_RAW="[]"

            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              SID=$(echo "$site" | jq -r '.id')
              ALL_MONITORS=$(curl -fsS --retry 3 --retry-delay 2 -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
              PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$SID" '[.monitors[]? | select(.type == "http" and (.parent | tostring) == $sid) | {url: .url, name: .name}]')
              SITE_WITH_PAGES=$(echo "$site" | jq -c --argjson pages "$PAGES" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$SITE_WITH_PAGES" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]?')"
            SITES="$SITES_ARRAY"
          fi

          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "📡 Sites à monitorer :"
          echo "$SITES" | jq .

  # ============================================================
  # 2. AGENT OPENBROWSER-AI
  # ============================================================
  autospec-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: autospec-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer OpenBrowser-AI + ffmpeg
        run: |
          set -euo pipefail
          pip install --quiet "openbrowser-ai[agent,video]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Détecter le type de site (zéro token)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ matrix.site.url }}"
          HTML=$(curl -fsSL --max-time 15 "$URL" 2>/dev/null || echo "")

          if echo "$HTML" | grep -qiE '(marketplace|vendeur|seller|multi-vendor|boutique)'; then
            TYPE="marketplace"
          elif echo "$HTML" | grep -qiE '(panier|cart|checkout|prix|price|produit|product|acheter|buy)'; then
            TYPE="ecommerce"
          elif echo "$HTML" | grep -qiE '(login|connexion|dashboard|subscription|abonnement|pricing|tarif|sign.up|inscription)'; then
            TYPE="saas"
          elif echo "$HTML" | grep -qiE '(blog|article|post|actualite|news)'; then
            TYPE="blog"
          else
            TYPE="generic"
          fi

          echo "TYPE=$TYPE" >> "$GITHUB_OUTPUT"
          echo "🔎 Type détecté : $TYPE"

      - name: Générer le prompt adaptatif (zéro token)
        id: prompt
        shell: bash
        run: |
          TYPE="${{ steps.detect.outputs.TYPE }}"
          case "$TYPE" in
            marketplace)
              REQUIREMENTS="1. Type a product name in the search bar and click Search. Assert that result items appear. 2. Apply a filter (price or category). Assert that results change. 3. Click the first product. Assert that a product detail page loads."
              ;;
            ecommerce)
              REQUIREMENTS="1. Find a product listing. Assert that price and availability are visible. 2. Click 'Add to Cart'. Assert that the cart icon/count updates. 3. Open the cart. Assert the product is there."
              ;;
            saas)
              REQUIREMENTS="1. Locate the login form. Fill it with fake credentials (test+ci-${GITHUB_RUN_ID}@example.com). Submit. Assert that either a dashboard loads or a clear error message appears (not a blank page). 2. Find a contact form. Fill with 'TEST AUTOMATISÉ'. Submit. Assert a success message."
              ;;
            blog)
              REQUIREMENTS="1. Assert that at least 3 articles are listed with titles and dates. 2. Click the first article. Assert that the full content loads (more than 500 characters) and a publication date is visible."
              ;;
            *)
              REQUIREMENTS="1. Assert the page title is not empty and not a default placeholder ('It works!', 'Index of /', etc.). 2. Find a clickable link, click it, and assert that the URL changes or the content updates."
              ;;
          esac

          echo "REQUIREMENTS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REQUIREMENTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Exécuter le monitoring fonctionnel
        env:
          SITE_URL: ${{ matrix.site.url }}
          SITE_ID: ${{ matrix.site.id }}
          SITE_TYPE: ${{ steps.detect.outputs.TYPE }}
          REQUIREMENTS: ${{ steps.prompt.outputs.REQUIREMENTS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_monitor.py

      - name: Afficher le résultat
        if: always()
        run: |
          if [ -f output.json ]; then jq . output.json; else echo "❌ output.json absent"; fi

      - name: Envoyer le rapport des pages
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          [ ! -f output.json ] && exit 0
          if jq -e '.pages' output.json >/dev/null 2>&1; then
            jq -c '{pages: .pages}' output.json > pages_payload.json
            curl -sS --retry 3 --retry-delay 2 -X POST "$RELAY_URL/sites/$SITE_ID/pages-report" \
              -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @pages_payload.json
          fi

      - name: Envoyer le statut global
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set +e
          STATUS="ERROR"; MESSAGE="OpenBrowser-AI execution error"
          if [ -f output.json ]; then
            STATUS=$(jq -r '.overall_status // "ERROR"' output.json | tr '[:lower:]' '[:upper:]')
            MESSAGE=$(jq -c '{actions_completed, model_used, pages}' output.json)
          fi
          jq -nc --arg status "$STATUS" --arg message "$MESSAGE" '{status: $status, message: $message}' > status_payload.json
          curl -sS --retry 3 --retry-delay 2 -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @status_payload.json

      - name: Uploader les artifacts (vidéos, rapport)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbrowser-monitoring-${{ matrix.site.id }}
          path: |
            recordings/
            output.json
          if-no-files-found: ignore
          retention-days: 7
