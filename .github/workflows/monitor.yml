name: AutoInspector Monitoring

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "ID d'un site précis (vide = tous les sites dus)"
        required: false
        default: ""
      max_pages:
        description: "Nombre max de pages testées par site"
        required: false
        default: "2"
  # schedule:            # à activer seulement après un premier run manuel réussi
  #   - cron: "0 */3 * * *"

env:
  RELAY_URL: ${{ secrets.RELAY_URL }}

jobs:
  # ------------------------------------------------------------------
  # 1) Récupérer les sites à tester + leurs pages
  # ------------------------------------------------------------------
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.fetch.outputs.sites }}
    steps:
      - name: Récupérer sites et pages depuis le relay
        id: fetch
        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          SITE_ID: ${{ inputs.site_id }}
          MAX_PAGES: ${{ inputs.max_pages || '2' }}
        run: |
          set -euo pipefail
          H="x-relay-secret: $RELAY_SECRET"

          SITES=$(curl -fsS -H "$H" "$RELAY_URL/active-sites" | jq -c '.sites // []')
          if [ -n "$SITE_ID" ]; then
            SITES=$(echo "$SITES" | jq -c --arg id "$SITE_ID" '[.[] | select((.id|tostring)==$id)]')
          fi

          MON=$(curl -fsS -H "$H" "$RELAY_URL/monitors")

          RESULT=$(jq -cn --argjson sites "$SITES" --argjson mon "$MON" --argjson max "$MAX_PAGES" '
            [ $sites[] as $s
              | ([ $mon.monitors[]?
                   | select(.type=="http" and ((.parent|tostring)==($s.id|tostring)))
                   | {url:.url, name:.name} ]) as $pages
              | { id: $s.id,
                  name: $s.client_name,
                  url: $s.site_url,
                  pages: ( (if ($pages|length)==0
                            then [{url:$s.site_url, name:$s.client_name}]
                            else $pages end) | .[:$max] ) } ]')

          echo "sites=$RESULT" >> "$GITHUB_OUTPUT"
          echo "$RESULT" | jq .

  # ------------------------------------------------------------------
  # 2) Un job par site : auto-inspector -> rapport -> vidéo
  # ------------------------------------------------------------------
  autospec-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autoinspector-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    env:
      SITE_ID: ${{ matrix.site.id }}
      RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

    steps:
      - name: Checkout du workflow
        uses: actions/checkout@v4

      - name: Checkout auto-inspector (code patché)
        uses: actions/checkout@v4
        with:
          repository: TON_ORG/auto-inspector        # <-- à remplacer
          token: ${{ secrets.AUTO_INSPECTOR_REPO_TOKEN }}   # inutile si repo public
          path: auto-inspector

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: auto-inspector/backend
        run: npm ci

      - name: Installer Chromium
        working-directory: auto-inspector/backend
        run: npx playwright install --with-deps chromium

      - name: Générer le fichier de scénarios
        env:
          PAGES: ${{ toJson(matrix.site.pages) }}
          SITE_URL: ${{ matrix.site.url }}
        run: |
          mkdir -p auto-inspector/tests auto-inspector/backend/recordings
          jq -cn --argjson pages "$PAGES" --arg url "$SITE_URL" '
            { context: { variables: [ {name:"main_url", value:$url, is_secret:false} ] },
              cases: ($pages | map({start_url: .url})) }' \
            > "auto-inspector/tests/site-$SITE_ID.json"
          jq . "auto-inspector/tests/site-$SITE_ID.json"

      - name: Exécuter Auto Inspector
        id: run
        continue-on-error: true
        working-directory: auto-inspector/backend
        env:
          HEADLESS: "true"
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: nvidia/nemotron-3.5-content-safety:free
        run: npm run scenario -- --file=../tests/site-${{ matrix.site.id }}.json

      - name: Envoyer le rapport de pages au relay
        if: always()
        run: |
          set -euo pipefail
          OUT=auto-inspector/backend/output.json
          if [ ! -f "$OUT" ]; then
            echo "Pas d'output.json (crash avant la boucle) : pages-report NON envoyé"
            exit 0
          fi
          jq -c '{pages: [ .cases[] | {
                url: .start_url,
                status: (if .status=="passed" then "UP"
                         elif .status=="failed" then "DOWN"
                         else "ERROR" end),
                note: .reason,
                source: "playwright" } ]}' "$OUT" > pages-report.json
          curl -fsS -X POST "$RELAY_URL/sites/$SITE_ID/pages-report" \
            -H "x-relay-secret: $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @pages-report.json

      - name: Fusionner et compresser les vidéos
        if: always()
        id: video
        run: |
          set -euo pipefail
          cd auto-inspector/backend/recordings
          if ! ls *.webm >/dev/null 2>&1; then
            echo "has_video=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          : > list.txt
          for f in $(ls -tr *.webm); do echo "file '$PWD/$f'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt \
            -vf scale=640:-2 -c:v libx264 -crf 30 -preset veryfast \
            -movflags +faststart -an merged.mp4
          ffmpeg -y -i merged.mp4 -frames:v 1 thumb.jpg
          echo "has_video=true" >> "$GITHUB_OUTPUT"

      - name: Upload vidéo vers Supabase et lier au site
        if: always() && steps.video.outputs.has_video == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          cd auto-inspector/backend/recordings
          B="$SUPABASE_URL/storage/v1/object/monitoring-videos/$SITE_ID"
          for pair in "merged.mp4:latest.mp4:video/mp4" "thumb.jpg:latest.jpg:image/jpeg"; do
            SRC="${pair%%:*}"; REST="${pair#*:}"; DST="${REST%%:*}"; CT="${REST#*:}"
            curl -fsS -X POST "$B/$DST" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "x-upsert: true" -H "Content-Type: $CT" \
              --data-binary "@$SRC"
          done
          PUB="$SUPABASE_URL/storage/v1/object/public/monitoring-videos/$SITE_ID"
          curl -fsS -X POST "$RELAY_URL/sites/$SITE_ID/attach-video" \
            -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" \
            -d "{\"video_url\":\"$PUB/latest.mp4\",\"thumbnail_url\":\"$PUB/latest.jpg\"}"

      - name: Marquer le site comme crawlé
        if: always()
        run: |
          OUT=auto-inspector/backend/output.json
          if [ -f "$OUT" ]; then
            STATUS=$(jq -r '.status' "$OUT")
            MSG=$(jq -r '"\(.passed)/\(.total) OK, \(.failed) échec(s), \(.errors) erreur(s)"' "$OUT")
          else
            STATUS="error"; MSG="auto-inspector a planté avant de produire un rapport"
          fi
          # Aligne les valeurs de status avec ton bloc mark-crawled actuel si elles diffèrent
          curl -fsS -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg s "$STATUS" --arg m "$MSG" '{status:$s, message:$m}')"

      - name: Artefacts de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoinspector-${{ matrix.site.id }}
          path: |
            auto-inspector/backend/recordings/
            auto-inspector/backend/output.json
            auto-inspector/backend/execution.log
          retention-days: 3
