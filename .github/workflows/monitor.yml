name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (fichier avec bons adaptateurs)
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "mistral": {
                  "api": "openai-completions",
                  "baseUrl": "https://api.mistral.ai/v1",
                  "models": [
                    { "id": "mistral-small-latest", "name": "mistral-small-latest" }
                  ]
                },
                "google": {
                  "api": "google-generative-ai",
                  "models": [
                    { "id": "gemini-2.5-flash", "name": "gemini-2.5-flash" },
                    { "id": "gemini-2.5-pro", "name": "gemini-2.5-pro" }
                  ]
                }
              }
            }
          }
          EOF

          # Installer et activer le plugin Mistral (nécessaire pour l'API Mistral)
          ~/.npm-global/bin/openclaw plugins install mistral --accept-capabilities 2>/dev/null || true
          ~/.npm-global/bin/openclaw plugins enable mistral --accept-capabilities 2>/dev/null || true

          # Enregistrer les clés API dans le store d'authentification
          printf "%s\n" "$MISTRAL_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider mistral || echo "⚠️ Échec enregistrement clé Mistral"
          printf "%s\n" "$GOOGLE_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider google || echo "⚠️ Échec enregistrement clé Google"

          # Définir le modèle par défaut (Mistral)
          ~/.npm-global/bin/openclaw models set mistral/mistral-small-latest || true

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche (prompt enrichi)
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.
          3. Teste chacune de ces actions et vérifie le résultat attendu.
          4. Si une action t'amène sur une NOUVELLE URL (navigation, clic sur un
             lien, soumission de formulaire, etc.), traite cette URL comme une
             page à part entière à surveiller : note son statut individuellement,
             pas seulement l'action qui y a mené.
          5. Si erreur JS, page blanche, ou action qui ne fait rien, prends une
             capture d'écran et note-le.
          6. Termine ta réponse par TON VERDICT EN LANGAGE NATUREL COMME AVANT,
             puis ajoute IMPÉRATIVEMENT à la toute fin, dans un bloc de code
             ```json, un objet structuré au format EXACT suivant (rien d'autre
             dans ce bloc, pas de commentaire) :

             ```json
             {
               "overall_status": "UP",
               "pages": [
                 {
                   "url": "URL exacte visitée",
                   "status": "UP",
                   "http_code": 200,
                   "note": "brève explication en une phrase"
                 }
               ]
             }
