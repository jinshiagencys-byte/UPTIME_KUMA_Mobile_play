name: Hermes Agent - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'ID du site à tester spécifiquement (optionnel)'
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          SITE_ID="$SITE_ID_INPUT"

          if [ -n "$SITE_ID" ]; then
            DETAIL=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors/$SITE_ID")
            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')
            if [ -z "$MONITOR" ] || [ "$MONITOR" == "null" ]; then
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ALL_MONITORS=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')
            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            RAW=$(curl -s https://kuma-relay.up.railway.app/active-sites)
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "")
            if [ -z "$SITES_RAW" ] || [ "$SITES_RAW" == "null" ]; then
              SITES_RAW="[]"
            fi
            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              sid=$(echo "$site" | jq -r '.id')
              all=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
              pages=$(echo "$all" | jq -c --arg sid "$sid" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')
              site_with_pages=$(echo "$site" | jq -c --argjson pages "$pages" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$site_with_pages" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]?')"
            SITES="$SITES_ARRAY"
          fi
          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  hermes-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: hermes-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - uses: actions/checkout@v4

      - name: Installer Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          source ~/.bashrc || true
          hermes --version

      - name: Dépendances système
        run: |
          set -e
          command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg
          if ! command -v chromium >/dev/null 2>&1 && command -v google-chrome >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium
          fi
          npm install -g agent-browser || true
          sudo npx playwright install-deps chromium || true
          npx playwright install chromium || true

      - name: Diagnostic des check_fn browser
        run: |
          SRC="$HOME/.hermes/hermes-agent"
          echo "=== Recherche check_browser_requirements ==="
          grep -rn "def check_browser_requirements" "$SRC" --include="*.py" | head -5
          echo ""
          echo "=== Corps de la fonction ==="
          grep -A 30 "def check_browser_requirements" "$SRC" -r --include="*.py" | head -50
          echo ""
          echo "=== Recherche check_browser_navigate_requirements ==="
          grep -A 30 "def check_browser_navigate_requirements" "$SRC" -r --include="*.py" | head -50

      - name: Configurer Hermes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_BROWSER_ARGS: "--headless=new,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-blink-features=AutomationControlled,--window-size=1280,800"
        run: |
          mkdir -p ~/.hermes ~/.hermes/browser_recordings

          unset BROWSERBASE_API_KEY || true
          unset BROWSER_USE_API_KEY || true

          cat > ~/.hermes/.env << EOF
          MISTRAL_API_KEY=${MISTRAL_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}
          HF_TOKEN=${HF_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          AGENT_BROWSER_ENGINE=chrome
          AGENT_BROWSER_HEADED=false
          EOF

          cat > ~/.hermes/config.yaml << 'EOF'
          browser:
            enabled: true
            cloud_provider: local
            record_sessions: true
            engine: chrome
            headed: false
            inactivity_timeout: 120
            command_timeout: 30

          toolsets:
            - browser
            - terminal
            - web_search
            - web_extract

          display:
            tool_progress: "off"

          sessions:
            auto_prune: false

          model:
            provider: openrouter
            default: openrouter/free

          custom_providers:
            - name: mistral
              base_url: https://api.mistral.ai/v1
              key_env: MISTRAL_API_KEY
          EOF

          echo "=== Réchauffement agent-browser ==="
          agent-browser open "https://example.com" || true
          agent-browser close --all || true

          echo "=== hermes doctor --fix ==="
          hermes doctor --fix || true

      - name: Générer tâche
        env:
          PAGES_JSON: ${{ toJson(matrix.site.pages) }}
          SITE_URL: ${{ matrix.site.url }}
        run: |
          PAGES_LIST=$(echo "$PAGES_JSON" | jq -c . | jq -r '[.[]? | .url] | join("\n")')

          cat > task.md << 'EOF'
          Va sur SITE_URL_PLACEHOLDER avec l'outil de navigateur. Explore comme un humain et détecte le type de site.

          VÉRIFICATION CRITIQUE : le contenu correspond-il vraiment au site attendu ou est-ce une page par défaut d'hébergeur ?
          Si le frontend affiche des sections censées recevoir des données du backend mais qu'elles restent vides, c'est DOWN.

          PAGES À VÉRIFIER :
          PAGES_LIST_PLACEHOLDER

          Choisis 2-3 actions selon le type détecté (e-commerce: panier ; auth: signup/login ; contact: form ; recherche).

          Termine par un verdict puis ce bloc JSON exact :

          ```json
          {
            "overall_status": "UP",
            "site_type": "ecommerce",
            "pages": [{"url": "URL", "status": "UP", "http_code": 200, "action_tested": "action", "note": "note"}]
          }
          ```
          EOF

          sed -i "s|SITE_URL_PLACEHOLDER|$SITE_URL|g" task.md
          sed -i "s|PAGES_LIST_PLACEHOLDER|$PAGES_LIST|g" task.md

      - name: Lancer Hermes Agent
        id: agent_run
        env:
          HERMES_DEBUG: "1"
          HERMES_LOG_LEVEL: "DEBUG"
        run: |
          set +e
          TASK_CONTENT=$(cat task.md)
          mkdir -p recordings

          run_agent() {
            local provider=$1 model=$2 label=$3
            echo "=== Test $provider/$model ==="
            
            hermes -z "$TASK_CONTENT" --provider "$provider" -m "$model" -t "browser,terminal" --yolo > "output-${label}.json" 2>&1
            echo "exit_code=$?"

            if [ -d ~/.hermes/browser_recordings ]; then
              echo "=== Contenu browser_recordings ==="
              ls -lah ~/.hermes/browser_recordings/
            fi

            latest_webm=$(ls -t ~/.hermes/browser_recordings/*.webm 2>/dev/null | head -n1)
            if [ -n "$latest_webm" ]; then
              cp -v "$latest_webm" "recordings/${label}.webm"
              echo "✅ Vidéo enregistrée : ${label}.webm"
            fi

            echo "=== Warnings check_fn browser ==="
            grep -i "check_fn.*browser" "output-${label}.json" | head -5 || true
          }

          is_success() {
            grep -qiE '"overall_status"\s*:\s*"(up|down)"' "$1"
          }

          echo "=== Chaîne OpenRouter ==="
          for OR_MODEL in "poolside/laguna-s-2.1:free" "inclusionai/ling-3.0-flash-fin:free" "thinkingmachines/inkling:free" "openrouter/free"; do
            label="openrouter-$(echo "$OR_MODEL" | tr '/:' '--')"
            run_agent "openrouter" "$OR_MODEL" "$label"
            cp "output-${label}.json" output.json
            if is_success output.json; then
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              echo "winning_label=${label}" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "=== Fallback providers ==="
          for PAIR in "custom:mistral|mistral-small-latest" "gemini|gemini-3.1-pro-preview" "huggingface|openai/gpt-oss-120b:cerebras"; do
            provider="${PAIR%%|*}"
            model="${PAIR#*|}"
            label="$(echo "${provider}-${model}" | tr '/:' '--')"
            run_agent "$provider" "$model" "$label"
            cp "output-${label}.json" output.json
            if is_success output.json; then
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              echo "winning_label=${label}" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "=== NVIDIA ==="
          run_agent "nvidia" "moonshotai/kimi-k3" "nvidia1"
          cp "output-nvidia1.json" output.json
          if is_success output.json; then
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            echo "winning_label=nvidia1" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "agent_failed=true" >> $GITHUB_OUTPUT

      - name: Extraire et envoyer résultat
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          WINNING_LABEL: ${{ steps.agent_run.outputs.winning_label }}
        run: |
          if [ -f output.json ] && [ -s output.json ]; then
            AGENT_TEXT=$(cat output.json)
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk 'BEGIN{c=0;b=""} /```json/{c=1;b="";next} /```/{if(c){l=b;c=0};next} c{b=b $0 "\n"} END{printf "%s",l}')
            if echo "$PAGES_JSON" | jq -e '.overall_status and .pages' > /dev/null 2>&1; then
              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status // "UNKNOWN"' | tr '[:lower:]' '[:upper:]')
              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')
              echo "$PAGES_JSON" | jq -c '{pages: .pages}' > pp.json
              curl -s -X POST "https://kuma-relay.up.railway.app/pages-report" -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @pp.json || true
            else
              STATUS="UNKNOWN"
              REASON="No JSON block"
            fi
          else
            STATUS="ERROR"
            REASON="No output"
          fi
          
          jq -nc --arg id "$SITE_ID" --arg s "$STATUS" --arg r "$REASON" --arg l "${WINNING_LABEL:-unknown}" '{site_id: $id, status: $s, reason: $r, agent_label: $l}' > sp.json
          curl -s -X POST "https://kuma-relay.up.railway.app/status" -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @sp.json || true

      - name: Uploader vidéo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-recordings-${{ matrix.site.id }}
          path: recordings/*.webm
          if-no-files-found: ignore
          retention-days: 7
