name: OpenClaw - Test Autonome sur usinformatique.com

on:
  workflow_dispatch:

jobs:
  autonomous-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer OpenClaw (via script officiel)
        run: |
          # Téléchargement et exécution du script d'installation
          curl -fsSL https://openclaw.ai/install.sh | bash
          # Ajout du binaire au PATH pour les étapes suivantes
          echo "$HOME/.openclaw/bin" >> $GITHUB_PATH
          # Vérification de l'installation
          ~/.openclaw/bin/openclaw --version

      - name: Configurer OpenClaw avec OpenRouter
        run: |
          # On utilise la clé OpenRouter (les modèles gratuits sont dispo)
          export OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          ~/.openclaw/bin/openclaw config --set provider=openrouter
          ~/.openclaw/bin/openclaw config --set model=openrouter/free
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Lancer OpenClaw en mode autonome (sans code Playwright)
        run: |
          # OpenClaw va ouvrir le navigateur, explorer, cliquer, et juger par lui-même
          ~/.openclaw/bin/openclaw run "Test du site usinformatique.com" \
            --task "Va sur https://usinformatique.com. Explore le site comme un humain : scroll, clique sur les produits, vérifie que le panier fonctionne, et que les données s'affichent correctement. Si tu vois des erreurs JavaScript ou des pages blanches, prends une capture d'écran. À la fin, dis-moi si le site est UP ou DOWN, avec une explication de ce que tu as testé." \
            --browser true \
            --output json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload des captures (si OpenClaw en a pris)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-screenshots
          path: ~/.openclaw/workspace/screenshots/
