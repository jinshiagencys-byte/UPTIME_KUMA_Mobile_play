name: OpenClaw - Test Autonome sur usinformatique.com

on:
  workflow_dispatch:

jobs:
  autonomous-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright (pour le navigateur)
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenClaw (via script officiel)
        run: |
          curl -fsSL https://openclaw.ai | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Lancer OpenClaw en mode autonome
        run: |
          ~/.npm-global/bin/openclaw run "Test du site usinformatique.com" \
            --task "Va sur https://usinformatique.com. Explore le site comme un humain : scroll, clique sur les produits, vérifie que le panier fonctionne, et que les données s'affichent correctement. Si tu vois des erreurs JavaScript ou des pages blanches, prends une capture d'écran. À la fin, dis-moi si le site est UP ou DOWN, avec une explication de ce que tu as testé." \
            --browser true \
            --output json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCLAW_AGENTS_DEFAULTS_MODEL_PROVIDER: "openrouter"
          OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY: "openrouter/free"

      - name: Upload des captures (si OpenClaw en a pris)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-screenshots
          path: ~/.openclaw/workspace/screenshots/
