name: OpenClaw - Test Autonome (Groq → Mistral → OpenRouter) - v2

on:
  workflow_dispatch:

jobs:
  autonomous-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Installer les providers (Groq + OpenRouter)
        run: |
          ~/.npm-global/bin/openclaw plugins install @openclaw/groq-provider || true
          ~/.npm-global/bin/openclaw plugins install @openclaw/openrouter-provider || true

      - name: Configurer OpenClaw (browser + gateway)
        run: |
          ~/.npm-global/bin/openclaw config set browser.enabled true
          ~/.npm-global/bin/openclaw config set browser.headless true
          ~/.npm-global/bin/openclaw config set browser.noSandbox true
          ~/.npm-global/bin/openclaw config set browser.defaultProfile openclaw
          ~/.npm-global/bin/openclaw config set gateway.mode "local"
          ~/.npm-global/bin/openclaw config set gateway.auth.token "ci-test-token-12345"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Démarrer le Gateway
        run: |
          nohup ~/.npm-global/bin/openclaw gateway --force > gateway.log 2>&1 &
          echo "Attente du démarrage du Gateway..."
          sleep 10
          ~/.npm-global/bin/openclaw gateway status || true
          cat gateway.log
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Écrire la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur https://usinformatique.com avec l'outil browser. Explore le site comme un humain : scroll, clique sur un produit, ajoute-le au panier, puis vérifie que le produit est bien présent dans le panier après l'ajout. Si tu vois des erreurs JavaScript ou des pages blanches, prends une capture d'écran. À la fin, dis-moi si le site est UP ou DOWN, avec une explication précise de ce que tu as testé.
          EOF

      - name: Lancer OpenClaw (fallback Groq → Mistral → OpenRouter)
        id: agent_run
        run: |
          set +e

          # Liste des modèles actifs en août 2026 (ordre : Groq → Mistral → OpenRouter)
          CONFIGS=(
            # Groq - modèles encore supportés
            "groq/mixtral-8x7b-32768"
            "groq/gemma2-9b-it"

            # Mistral - gamme 2026
            "mistral/mistral-large-latest"
            "mistral/mistral-small-latest"
            "mistral/codestral-latest"
            "mistral/mistral-medium"  # alias pour medium 3.5

            # OpenRouter - syntaxe exacte (double namespace)
            "openrouter/openrouter/fusion"
            "openrouter/meta-llama/llama-3-8b-instruct:free"
          )

          SUCCESS=false
          for CONFIG in "${CONFIGS[@]}"; do
            echo "======================================"
            echo "Essai de la configuration : $CONFIG"
            echo "======================================"

            ~/.npm-global/bin/openclaw config set agents.defaults.model.primary "$CONFIG"

            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:usinformatique-test" \
              --message-file task.md \
              --json > output.json 2>&1

            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Succès avec $CONFIG"
              SUCCESS=true
              cat output.json
              break
            else
              echo "❌ Échec avec $CONFIG (code $EXIT_CODE)"
              echo "--- Sortie ---"
              cat output.json
              echo "--------------"
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "Aucune configuration n'a fonctionné."
            exit 1
          fi

          exit 0

        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Upload des logs et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-artifacts
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
