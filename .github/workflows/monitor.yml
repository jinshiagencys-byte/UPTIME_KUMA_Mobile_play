name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Mesurer SSL + temps de chargement (avant OpenClaw)
        run: |
          node check-metrics.js "${{ matrix.site.id }}" "${{ matrix.site.url }}" || echo "⚠️ Échec mesure métriques (non bloquant)"
        env:
          RELAY_URL: https://kuma-relay.up.railway.app
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Configurer OpenClaw (fichier minimal)
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "mistral": {
                  "api": "openai-completions",
                  "baseUrl": "https://api.mistral.ai/v1",
                  "models": [
                    { "id": "mistral-small-latest", "name": "mistral-small-latest" }
                  ]
                },
                "google": {
                  "models": [
                    { "id": "gemini-2.5-pro", "name": "gemini-2.5-pro" }
                  ]
                },
                "huggingface": {
                  "api": "openai-completions",
                  "baseUrl": "https://router.huggingface.co/v1",
                  "models": [
                    { "id": "openai/gpt-oss-120b:cerebras", "name": "openai/gpt-oss-120b:cerebras" }
                  ]
                }
              }
            }
          }
          EOF

          ~/.npm-global/bin/openclaw plugins install mistral --accept-capabilities 2>/dev/null || true
          ~/.npm-global/bin/openclaw plugins enable mistral --accept-capabilities 2>/dev/null || true

          printf "%s\n" "$MISTRAL_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider mistral || echo "⚠️ Échec enregistrement clé Mistral"
          printf "%s\n" "$GOOGLE_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider google || echo "⚠️ Échec enregistrement clé Google"
          printf "%s\n" "$HF_API_KEY" | ~/.npm-global/bin/openclaw models auth paste-api-key --provider huggingface || echo "⚠️ Échec enregistrement clé HuggingFace"

          ~/.npm-global/bin/openclaw models set mistral/mistral-small-latest || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser. Explore comme un
          humain (scroll, structure) et détecte le type de site.

          VÉRIFICATION CRITIQUE avant tout le reste : le contenu affiché
          correspond-il vraiment au site attendu, ou est-ce une page par
          défaut d'hébergeur/registrar (ex: "o2switch", "It works!", page de
          parking de domaine, message DNS/SSL non configuré) ? Si le frontend
          affiche des sections censées recevoir des données du backend
          (liste de produits, résultats, profil, prix, etc.) mais qu'elles
          restent vides, bloquées en chargement, ou affichent une erreur/
          "undefined"/"null" à la place des vraies données, c'est un backend
          en panne : DOWN, même si la page HTTP répond 200.

          Choisis 2-3 actions à tester selon le type détecté :
          - E-commerce : ajoute un produit au panier, VÉRIFIE qu'il apparaît
            bien dans le panier (nom/qté/prix) — ces données viennent du
            backend, vérifie qu'elles sont réelles et pas un état vide/figé.
          - Compte utilisateur : inscris-toi avec des données fictives
            (test+ci-<horodatage>@example.com), puis connecte-toi avec ces
            identifiants. Si compte existant seulement, teste juste qu'un
            login invalide donne une erreur propre (pas de vraie connexion).
          - Formulaire de contact : soumets-le en indiquant "TEST AUTOMATISÉ"
            dans le message.
          - Recherche : vérifie que des résultats s'affichent réellement.
          - Sinon : les 2-3 actions les plus représentatives du site.

          Vérifie le résultat RÉEL de chaque action (pas juste "la page
          charge"). Toute nouvelle URL atteinte (clic, form, etc.) = une page
          distincte à noter individuellement. Repère aussi images cassées,
          erreurs JS console, liens morts du menu/footer si le temps le
          permet. Capture d'écran si erreur/page blanche/action sans effet.

          Termine par ton verdict en langage naturel (type de site + parcours
          testés, en précisant si le contenu venait bien du backend ou si
          c'était un placeholder/backend en panne), puis ce bloc JSON exact
          en toute fin (rien d'autre dedans) :

          ```json
          {
            "overall_status": "UP",
            "site_type": "ecommerce",
            "pages": [
              {
                "url": "URL exacte",
                "status": "UP",
                "http_code": 200,
                "action_tested": "action testée ou null",
                "note": "explication en une phrase"
              }
            ]
          }
          ```
          Règles : status/overall_status = "UP" ou "DOWN" uniquement.
          site_type = ecommerce|auth|vitrine|blog|autre. Une entrée par page
          visitée (départ + chaque URL distincte, y compris erreurs/404). Un
          parcours métier qui échoue (panier vide après ajout, recherche sans
          résultat, form qui ne soumet rien) = DOWN même si HTTP 200. Une page
          par défaut d'hébergeur ou des données backend manquantes/vides
          alors qu'elles sont attendues = DOWN même si HTTP 200.
          EOF

      - name: Lancer OpenClaw (avec Gateway persistent)
        id: agent_run
        run: |
          set +e

          start_gateway() {
            echo "🔧 Démarrage du Gateway..."
            ~/.npm-global/bin/openclaw gateway stop 2>/dev/null || true
            pkill -f "openclaw gateway" || true
            sleep 3
            ~/.npm-global/bin/openclaw plugins enable mistral --accept-capabilities 2>/dev/null || true
            nohup ~/.npm-global/bin/openclaw gateway --force --port 18789 --allow-unconfigured > gateway.log 2>&1 &
            echo "⏳ Attente du Gateway (30s)..."
            sleep 30
            if ~/.npm-global/bin/openclaw gateway status 2>&1 | grep -q "running"; then
              echo "✅ Gateway opérationnel"
              return 0
            else
              echo "❌ Gateway non disponible"
              cat gateway.log
              return 1
            fi
          }

          run_agent() {
            local model=$1
            local session_suffix=$2
            echo "======================================"
            echo "Test avec $model pour ${{ matrix.site.url }}"
            echo "======================================"
            ~/.npm-global/bin/openclaw models set "$model" || true
            ~/.npm-global/bin/openclaw agent \
              --session-key "ci:${{ matrix.site.id }}-$session_suffix" \
              --message-file task.md \
              --json > output.json 2>&1
            cat output.json
          }

          is_success() {
            local status
            status=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // empty' "$1" 2>/dev/null)
            echo "$status" | grep -qiE '^(up|ok)$'
          }

          gateway_actually_down() {
            grep -qi "ECONNREFUSED\|gateway not reachable\|gateway may still be running" "$1"
          }

          start_gateway || true

          run_agent "mistral/mistral-small-latest" "mistral1"

          if is_success output.json; then
            echo "✅ Succès avec Mistral"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gateway_actually_down output.json; then
            echo "🔄 Gateway injoignable, redémarrage..."
            start_gateway || true
            run_agent "mistral/mistral-small-latest" "mistral2"
            if is_success output.json; then
              echo "✅ Succès avec Mistral (2e tentative)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          elif grep -qi "rate limit" output.json; then
            echo "⚠️ Rate limit détecté, nouvelle tentative dans 30s..."
            sleep 30
            run_agent "mistral/mistral-small-latest" "mistral2"
            if is_success output.json; then
              echo "✅ Succès avec Mistral (2e tentative)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "======================================"
          echo "🔁 Fallback sur Google Gemini"
          echo "======================================"
          run_agent "google/gemini-2.5-pro" "gemini1"

          if is_success output.json; then
            echo "✅ Succès avec Google Gemini"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "======================================"
          echo "🔁 Fallback sur Hugging Face"
          echo "======================================"
          run_agent "huggingface/openai/gpt-oss-120b:cerebras" "hf1"

          if is_success output.json; then
            echo "✅ Succès avec Hugging Face"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Échec final avec Hugging Face"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat
        if: always()
        run: |
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
            PAGES_JSON=""
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
            PAGES_JSON=""
          else
            AGENT_TEXT=$(jq -r '[.. | .text? // empty] | map(select(type == "string")) | first // ""' output.json 2>/dev/null)
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ { capture=1; buf=""; next }
              /```/ { if (capture) { last=buf; capture=0 } ; next }
              capture { buf = buf $0 "\n" }
              END { printf "%s", last }
            ')

            if echo "$PAGES_JSON" | jq -e '.overall_status and .pages' > /dev/null 2>&1; then
              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status // "UNKNOWN"')
              SITE_TYPE=$(echo "$PAGES_JSON" | jq -r '.site_type // "non détecté"')
              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')
              echo "$PAGES_JSON" > pages.json
              echo "🏷️ Type de site détecté : $SITE_TYPE"
              echo "📄 $(echo "$PAGES_JSON" | jq '.pages | length') page(s) rapportée(s) :"
              echo "$PAGES_JSON" | jq -r '.pages[] | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.action_tested // "navigation simple") — \(.note // "")"'
            else
              echo "⚠️ Bloc JSON structuré introuvable, repli sur l'ancienne extraction"
              STATUS=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // "UNKNOWN"' output.json 2>/dev/null)
              REASON=$(jq -r '[.. | .text? // empty] | map(select(type == "string")) | first // ""' output.json 2>/dev/null | head -c 300)
              if [ -z "$STATUS" ] || [ "$STATUS" == "null" ]; then
                if grep -qi "up" output.json; then
                  STATUS="UP"
                  REASON="Site appears operational (extracted from text)"
                elif grep -qi "down" output.json; then
                  STATUS="DOWN"
                  REASON="Site appears down (extracted from text)"
                else
                  STATUS="UNKNOWN"
                  REASON="No status indicator found in output"
                fi
              fi
              PAGES_JSON=""
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          if [ -n "$PAGES_JSON" ] && echo "$PAGES_JSON" | jq -e '.pages' > /dev/null 2>&1; then
            echo "📤 Envoi du rapport pages à /pages-report"
            echo "$PAGES_JSON" | jq -c '{pages: .pages}' | \
            curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/pages-report" \
              -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
              -H "Content-Type: application/json" \
              -d @- \
              || echo "⚠️ Envoi pages-report échoué"
          else
            echo "ℹ️ Aucun rapport pages structuré à envoyer"
          fi

          jq -n --arg status "$STATUS" --arg message "$REASON" '{status: $status, message: $message}' | \
          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "⚠️ Envoi mark-crawled échoué"

        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            pages.json
            ~/.openclaw/workspace/screenshots/
