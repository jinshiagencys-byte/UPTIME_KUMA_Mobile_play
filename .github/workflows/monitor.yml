name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}

    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -fsS https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          "$HOME/.npm-global/bin/openclaw" --version

      - name: Configurer OpenClaw / OpenRouter
        run: |
          set -e

          mkdir -p "$HOME/.openclaw"

          echo "======================================"
          echo "Configuration OpenClaw / OpenRouter"
          echo "======================================"

          cat > "$HOME/.openclaw/openclaw.json" << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "openrouter": {
                  "api": "openai-completions",
                  "baseUrl": "https://openrouter.ai/api/v1",
                  "models": [
                    {
                      "id": "minimax/minimax-m3:free",
                      "name": "minimax/minimax-m3:free"
                    },
                    {
                      "id": "z-ai/glm-5.2:free",
                      "name": "z-ai/glm-5.2:free"
                    },
                    {
                      "id": "openrouter/free",
                      "name": "openrouter/free"
                    },
                    {
                      "id": "nvidia/nemotron-3-ultra-550b-a55b:free",
                      "name": "nvidia/nemotron-3-ultra-550b-a55b:free"
                    },
                    {
                      "id": "meta-llama/llama-3.3-70b-instruct:free",
                      "name": "meta-llama/llama-3.3-70b-instruct:free"
                    },
                    {
                      "id": "openai/gpt-oss-120b:free",
                      "name": "openai/gpt-oss-120b:free"
                    }
                  ]
                }
              }
            },
            "plugins": {
              "entries": {
                "perplexity": {
                  "enabled": false
                }
              }
            }
          }
          EOF

          echo "======================================"
          echo "Désactivation Perplexity"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" config set plugins.entries.perplexity.enabled false || true

          echo "======================================"
          echo "Enregistrement de la clé OpenRouter"
          echo "======================================"

          printf "%s\n" "$OPENROUTER_API_KEY" | \
            "$HOME/.npm-global/bin/openclaw" models auth paste-api-key \
            --provider openrouter

          echo "======================================"
          echo "Configuration du modèle principal"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" models set \
            "openrouter/minimax/minimax-m3:free"

          echo "======================================"
          echo "Configuration des fallbacks OpenClaw"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" models fallbacks clear || true

          # Ajout de la chaîne de secours par ordre de priorité
          "$HOME/.npm-global/bin/openclaw" models fallbacks add "openrouter/z-ai/glm-5.2:free"
          "$HOME/.npm-global/bin/openclaw" models fallbacks add "openrouter/openrouter/free"
          "$HOME/.npm-global/bin/openclaw" models fallbacks add "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
          "$HOME/.npm-global/bin/openclaw" models fallbacks add "openrouter/meta-llama/llama-3.3-70b-instruct:free"
          "$HOME/.npm-global/bin/openclaw" models fallbacks add "openrouter/openai/gpt-oss-120b:free"

          echo "======================================"
          echo "Vérification de la configuration"
          echo "======================================"

          "$HOME/.npm-global/bin/openclaw" models status || true

        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << 'EOF'
          Va sur ${{ matrix.site.url }} avec l'outil browser.

          1. Explore le site comme un humain : scroll, observe la structure.

          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.

          3. Teste chacune de ces actions et vérifie le résultat attendu.

          4. Si une action t'amène sur une NOUVELLE URL
             (navigation, clic sur un lien, soumission de formulaire, etc.),
             traite cette URL comme une page à part entière à surveiller :
             note son statut individuellement, pas seulement l'action qui y a mené.

          5. Si erreur JS, page blanche, ou action qui ne fait rien,
             prends une capture d'écran et note-le.

          6. Termine ta réponse par TON VERDICT EN LANGAGE NATUREL.

          7. À la toute fin, ajoute IMPÉRATIVEMENT un bloc JSON exactement
             au format suivant :

          ```json
          {
            "overall_status": "UP",
            "pages": [
              {
                "url": "URL exacte visitée",
                "status": "UP",
                "http_code": 200,
                "note": "brève explication en une phrase"
              }
            ]
          }
