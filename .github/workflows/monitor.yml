name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'ID du site à tester spécifiquement (optionnel)'
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          # 🛡️ SÉCURITÉ : entrée utilisateur passée par env, jamais interpolée
          # directement dans le script (protection contre l'injection de commande)
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          SITE_ID="$SITE_ID_INPUT"

          if [ -n "$SITE_ID" ]; then
            echo "🔍 Test ciblé sur le site $SITE_ID"
            DETAIL=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors/$SITE_ID")

            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')

            if [ -z "$MONITOR" ] || [ "$MONITOR" == "null" ]; then
              echo "❌ Site $SITE_ID introuvable ou erreur relay"
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MONITORS=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')

            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            RAW=$(curl -s https://kuma-relay.up.railway.app/active-sites)
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "")

            if [ -z "$SITES_RAW" ] || [ "$SITES_RAW" == "[]" ] || [ "$SITES_RAW" == "null" ]; then
              echo "⚠️ Aucun site exploitable, utilisation d'une valeur par défaut"
              SITES_RAW='[{"id":"test","url":"https://example.com"}]'
            fi

            SITES_ARRAY="[]"
            while IFS= read -r site; do
              sid=$(echo "$site" | jq -r '.id')
              all=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "https://kuma-relay.up.railway.app/monitors")
              pages=$(echo "$all" | jq -c --arg sid "$sid" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')
              site_with_pages=$(echo "$site" | jq -c --argjson pages "$pages" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$site_with_pages" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]')"
            SITES="$SITES_ARRAY"
          fi

          # 🛠️ COMPACTER : garantir une seule ligne JSON
          SITES=$(echo "$SITES" | jq -c .)

          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "📡 Sites à monitorer: $SITES"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    concurrency:
      group: openclaw-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js 26 (requis par OpenClaw)
        run: |
          export NVM_DIR="$HOME/.nvm"
          if [ ! -d "$NVM_DIR" ]; then
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
          fi
          \. "$NVM_DIR/nvm.sh"
          nvm install 26
          nvm use 26
          nvm alias default 26
          echo "$NVM_DIR/versions/node/$(node --version)/bin" >> "$GITHUB_PATH"
          node --version

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          openclaw --version

      - name: Configurer OpenClaw (fichier minimal)
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "gateway": {
              "mode": "local",
              "auth": {
                "token": "ci-test-token-12345"
              }
            },
            "models": {
              "providers": {
                "mistral": {
                  "api": "openai-completions",
                  "baseUrl": "https://api.mistral.ai/v1",
                  "models": [
                    { "id": "mistral-small-latest", "name": "mistral-small-latest" }
                  ]
                },
                "google": {
                  "models": [
                    { "id": "gemini-2.5-flash", "name": "gemini-2.5-flash" },
                    { "id": "gemini-2.5-flash-lite", "name": "gemini-2.5-flash-lite" },
                    { "id": "gemini-1.5-flash", "name": "gemini-1.5-flash" }
                  ]
                },
                "huggingface": {
                  "api": "openai-completions",
                  "baseUrl": "https://router.huggingface.co/v1",
                  "models": [
                    { "id": "openai/gpt-oss-120b:cerebras", "name": "openai/gpt-oss-120b:cerebras" }
                  ]
                },
                "openrouter": {
                  "api": "openai-completions",
                  "baseUrl": "https://openrouter.ai/api/v1",
                  "models": [
                    { "id": "poolside/laguna-s-2.1:free", "name": "laguna-s-2.1-free" },
                    { "id": "inclusionai/ling-3.0-flash-fin:free", "name": "ling-3.0-flash-fin-free" },
                    { "id": "thinkingmachines/inkling:free", "name": "inkling-free" },
                    { "id": "openrouter/free", "name": "openrouter-auto-free" }
                  ]
                },
                "nvidia": {
                  "api": "openai-completions",
                  "baseUrl": "https://integrate.api.nvidia.com/v1",
                  "models": [
                    { "id": "moonshotai/kimi-k3", "name": "moonshotai/kimi-k3" }
                  ]
                }
              }
            }
          }
          EOF

          openclaw plugins install mistral --accept-capabilities || echo "⚠️ install mistral échoué"
          openclaw plugins enable mistral --accept-capabilities || echo "⚠️ enable mistral échoué"
          openclaw plugins registry --refresh || true

          printf "%s\n" "$MISTRAL_API_KEY" | openclaw models auth paste-api-key --provider mistral || echo "⚠️ Échec enregistrement clé Mistral"
          printf "%s\n" "$GOOGLE_API_KEY" | openclaw models auth paste-api-key --provider google || echo "⚠️ Échec enregistrement clé Google"
          printf "%s\n" "$HF_API_KEY" | openclaw models auth paste-api-key --provider huggingface || echo "⚠️ Échec enregistrement clé HuggingFace"
          printf "%s\n" "$OPENROUTER_API_KEY" | openclaw models auth paste-api-key --provider openrouter || echo "⚠️ Échec enregistrement clé OpenRouter"
          printf "%s\n" "$NVIDIA_API_KEY" | openclaw models auth paste-api-key --provider nvidia || echo "⚠️ Échec enregistrement clé NVIDIA"

          openclaw models set mistral/mistral-small-latest || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Générer la tâche
        env:
          # 🛠️ CORRECTION : on passe le JSON via une variable d'env (pas via substitution
          # textuelle ${{ }} dans le script) pour éviter que des caractères comme les
          # apostrophes (ex: "Page d'accueil") ne cassent le bash généré.
          PAGES_JSON: ${{ toJson(matrix.site.pages) }}
          # 🛡️ SÉCURITÉ : site.url vient d'une API externe (kuma-relay). Le passer par env
          # évite l'injection de commande : s'il contenait des backticks ou $(...), une
          # interpolation ${{ }} directe dans le heredoc non quoté les ferait EXÉCUTER.
          SITE_URL: ${{ matrix.site.url }}
        run: |
          # 🛠️ CORRECTION : matrix.site.pages est déjà un ARRAY (pas un objet {pages: [...]}),
          # donc on itère directement avec .[] et non .pages[]
          PAGES_LIST=$(echo "$PAGES_JSON" | jq -c . | jq -r '[.[]? | .url] | join("\n")')

          cat > task.md << EOF
          Va sur $SITE_URL avec l'outil browser. Explore comme un
          humain (scroll, structure) et détecte le type de site.

          VÉRIFICATION CRITIQUE avant tout le reste : le contenu affiché
          correspond-il vraiment au site attendu, ou est-ce une page par
          défaut d'hébergeur/registrar (ex: "o2switch", "It works!", page de
          parking de domaine, message DNS/SSL non configuré) ? Si le frontend
          affiche des sections censées recevoir des données du backend
          (liste de produits, résultats, profil, prix, etc.) mais qu'elles
          restent vides, bloquées en chargement, ou affichent une erreur/
          "undefined"/"null" à la place des vraies données, c'est un backend
          en panne : DOWN, même si la page HTTP répond 200.

          PAGES À VÉRIFIER OBLIGATOIREMENT :
          $PAGES_LIST

          Choisis 2-3 actions à tester selon le type détecté :
          - E-commerce : ajoute un produit au panier, VÉRIFIE qu'il apparaît
            bien dans le panier (nom/qté/prix) — ces données viennent du
            backend, vérifie qu'elles sont réelles et pas un état vide/figé.
          - Compte utilisateur : inscris-toi avec des données fictives
            (test+ci-<horodatage>@example.com), puis connecte-toi avec ces
            identifiants. Si compte existant seulement, teste juste qu'un
            login invalide donne une erreur propre (pas de vraie connexion).
          - Formulaire de contact : soumets-le en indiquant "TEST AUTOMATISÉ"
            dans le message.
          - Recherche : vérifie que des résultats s'affichent réellement.
          - Sinon : les 2-3 actions les plus représentatives du site.

          Pour chaque page listée, vérifie au minimum qu'elle répond correctement
          (HTTP 200, contenu attendu). Explores aussi les liens internes pour
          détecter d'éventuelles pages non listées et signale-les dans le JSON
          final. Toute nouvelle URL atteinte = une page distincte à noter.

          Termine par ton verdict en langage naturel (type de site + parcours
          testés, en précisant si le contenu venait bien du backend ou si
          c'était un placeholder/backend en panne), puis ce bloc JSON exact
          en toute fin (rien d'autre dedans) :

          \`\`\`json
          {
            "overall_status": "UP",
            "site_type": "ecommerce",
            "pages": [
              {
                "url": "URL exacte",
                "status": "UP",
                "http_code": 200,
                "action_tested": "action testée ou null",
                "note": "explication en une sentence"
              }
            ]
          }
          \`\`\`
          Règles : status/overall_status = "UP" ou "DOWN" uniquement.
          site_type = ecommerce|auth|vitrine|blog|autre. Une entrée par page
          visitée (départ + chaque URL distincte, y compris erreurs/404). Un
          parcours métier qui échoue (panier vide après ajout, recherche sans
          résultat, form qui ne soumet rien) = DOWN même si HTTP 200. Une page
          par défaut d'hébergeur ou des données backend manquantes/vides
          alors qu'elles sont attendues = DOWN même si HTTP 200.
          EOF

      - name: Lancer OpenClaw (avec Gateway persistent)
        id: agent_run
        env:
          # 🛡️ SÉCURITÉ : mêmes raisons que ci-dessus, on évite l'interpolation directe
          # de données externes (site.url, site.id) dans le script bash.
          SITE_URL: ${{ matrix.site.url }}
          SITE_ID: ${{ matrix.site.id }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"
        run: |
          set +e

          mkdir -p videos

          start_gateway() {
            echo "🔧 Démarrage du Gateway..."
            openclaw gateway stop 2>/dev/null || true
            pkill -f "openclaw gateway" || true
            sleep 3

            echo "🔧 Rafraîchissement du registre de plugins..."
            openclaw plugins registry --refresh || echo "⚠️ registry --refresh échoué (non bloquant)"

            echo "🔧 Désactivation de perplexity..."
            openclaw plugins disable perplexity 2>&1 | tail -5 || true
            openclaw config set plugins.entries.perplexity.enabled false || true

            echo "🔧 Activation de mistral avec consentement..."
            if ! openclaw plugins enable mistral --accept-capabilities; then
              echo "❌ Consentement mistral échoué"
              openclaw plugins enable mistral --accept-capabilities 2>&1 | tail -20
            fi

            openclaw plugins list --json | jq -r '.plugins[]? | "\(.id): \(.status)"' | head -20 || true

            nohup openclaw gateway run --force --port 18789 --allow-unconfigured > gateway.log 2>&1 &

            echo "⏳ Attente du Gateway (polling 60s)..."
            for i in $(seq 1 30); do
              if openclaw gateway status 2>&1 | grep -qi "running"; then
                echo "✅ Gateway opérationnel"
                return 0
              fi
              sleep 2
            done
            echo "❌ Gateway non disponible après 60s"
            tail -50 gateway.log
            return 1
          }

          run_agent() {
            local model=$1
            local session_suffix=$2
            echo "======================================"
            echo "Test avec $model pour $SITE_URL"
            echo "======================================"
            openclaw models set "$model" || true

            # 🎥 On ne compte plus sur l'agent pour prendre des captures lui-même
            # (testé : il n'appelle pas l'outil screenshot spontanément même sur
            # instruction explicite). On pilote la capture nous-mêmes en tâche de
            # fond, en parallèle de l'agent, sans dépendre de ses décisions.
            mkdir -p "frames-${session_suffix}"
            : > "frames-${session_suffix}/capture.log"

            openclaw browser start --headless || true

            openclaw agent \
              --session-key "ci:${SITE_ID}-$session_suffix" \
              --message-file task.md \
              --json > output.json 2>&1 &
            AGENT_PID=$!

            (
              n=0
              while kill -0 "$AGENT_PID" 2>/dev/null; do
                n=$((n+1))
                shot_out=$(openclaw browser screenshot --full-page --labels 2>>"frames-${session_suffix}/capture.log")
                echo "$shot_out" >> "frames-${session_suffix}/capture.log"
                # 🛠️ CORRECTION (confirmé sur un run réel) : pas de préfixe "MEDIA:" en
                # pratique, la commande affiche le chemin brut, ex:
                # "~/.openclaw/media/browser/<uuid>.png". On extrait cette ligne et on
                # étend le "~" nous-mêmes (le shell ne le fait pas sur une variable).
                media_path=$(echo "$shot_out" | grep -oE '~/\.openclaw/media/browser/[^ ]+\.(png|jpg|jpeg)' | head -1)
                media_path="${media_path/#\~/$HOME}"
                if [ -n "$media_path" ] && [ -f "$media_path" ]; then
                  ext="${media_path##*.}"
                  cp "$media_path" "frames-${session_suffix}/$(printf "%04d" "$n").${ext}"
                fi
                # Intervalle plus large qu'au premier essai (2s) pour réduire la
                # contention avec l'agent sur le même navigateur (observé : la
                # plupart des tentatives échouaient avec "previous screenshot...
                # still running" / "Frame changed while snapshot was being captured").
                sleep 4
              done
            ) &
            CAPTURE_PID=$!

            wait "$AGENT_PID"
            kill "$CAPTURE_PID" 2>/dev/null || true
            wait "$CAPTURE_PID" 2>/dev/null || true

            cat output.json

            # 🎥 Assemblage des frames capturées en une vraie vidéo. On renumérote
            # d'abord en continu dans un dossier séparé (les captures peuvent être
            # en .png OU .jpg selon le run — observé sur un vrai test — donc on
            # reconvertit chaque frame en .jpg uniforme au passage avec ffmpeg,
            # plutôt que de risquer un mélange d'extensions dans la séquence).
            mkdir -p videos "clean-${session_suffix}"
            command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y ffmpeg
            i=0
            for f in $(ls "frames-${session_suffix}"/*.png "frames-${session_suffix}"/*.jpg "frames-${session_suffix}"/*.jpeg 2>/dev/null | sort); do
              i=$((i+1))
              ffmpeg -y -i "$f" "clean-${session_suffix}/$(printf "%04d" "$i").jpg" >/dev/null 2>&1
            done
            shot_count=$i
            if [ "$shot_count" -gt 0 ]; then
              ffmpeg -y -framerate "1/2" -i "clean-${session_suffix}/%04d.jpg" \
                -vf "scale=1280:-2:flags=lanczos" -c:v libx264 -pix_fmt yuv420p \
                "videos/run-${session_suffix}.mp4" \
                || echo "⚠️ Assemblage vidéo échoué (non bloquant)"
              echo "🎥 $shot_count frame(s) capturée(s) pour cette tentative"
            else
              echo "ℹ️ Aucune frame capturée pour cette tentative (le poller n'a peut-être pas eu le temps de tourner, ou aucune ligne MEDIA: n'a été trouvée — voir frames-${session_suffix}/capture.log)"
            fi
          }

          is_success() {
            local status
            status=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // empty' "$1" 2>/dev/null)
            echo "$status" | grep -qiE '^(up|ok)$'
          }

          gateway_actually_down() {
            grep -qi "ECONNREFUSED\|gateway not reachable\|gateway may still be running\|plugin verification failed" "$1"
          }

          start_gateway || true

          echo "======================================"
          echo "🔁 OpenRouter (modèles gratuits) — Mistral/Gemini/HF retirés pour ce test (temps perdu sur quotas/erreurs)"
          echo "======================================"

          for OR_MODEL in \
            "openrouter/poolside/laguna-s-2.1:free" \
            "openrouter/inclusionai/ling-3.0-flash-fin:free" \
            "openrouter/thinkingmachines/inkling:free" \
            "openrouter/openrouter/free"; do
            run_agent "$OR_MODEL" "openrouter-$(echo "$OR_MODEL" | tr '/:' '--')"
            if is_success output.json; then
              echo "✅ Succès avec OpenRouter ($OR_MODEL)"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "======================================"
          echo "🔁 Fallback sur NVIDIA NIM"
          echo "======================================"
          run_agent "nvidia/moonshotai/kimi-k3" "nvidia1"
          if is_success output.json; then
            echo "✅ Succès avec NVIDIA (moonshotai/kimi-k3)"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Échec final après OpenRouter et NVIDIA"
          echo "agent_failed=true" >> $GITHUB_OUTPUT

      - name: Extraire et envoyer le résultat
        if: always()
        env:
          # 🛡️ SÉCURITÉ : site.id vient de l'API externe, on le passe par env
          # plutôt que de l'interpoler directement dans les commandes curl.
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
            PAGES_JSON=""
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
            PAGES_JSON=""
          else
            AGENT_TEXT=$(jq -r '[.. | .text? // empty] | map(select(type == "string")) | first // ""' output.json 2>/dev/null)
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ { capture=1; buf=""; next }
              /```/ { if (capture) { last=buf; capture=0 } ; next }
              capture { buf = buf $0 "\n" }
              END { printf "%s", last }
            ')

            if echo "$PAGES_JSON" | jq -e '.overall_status and .pages' > /dev/null 2>&1; then
              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status // "UNKNOWN"')
              SITE_TYPE=$(echo "$PAGES_JSON" | jq -r '.site_type // "non détecté"')
              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')
              echo "$PAGES_JSON" > pages.json
              echo "🏷️ Type de site détecté : $SITE_TYPE"
              echo "📄 $(echo "$PAGES_JSON" | jq '.pages | length') page(s) rapportée(s) :"
              echo "$PAGES_JSON" | jq -r '.pages[] | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.action_tested // "navigation simple") — \(.note // "")"'
            else
              echo "⚠️ Bloc JSON structuré introuvable, repli sur l'ancienne extraction"
              STATUS=$(jq -r '[.. | .status? // empty] | map(select(type == "string")) | first // "UNKNOWN"' output.json 2>/dev/null)
              REASON=$(jq -r '[.. | .text? // empty] | map(select(type == "string")) | first // ""' output.json 2>/dev/null | head -c 300)
              if [ -z "$STATUS" ] || [ "$STATUS" == "null" ]; then
                if grep -qi "up" output.json; then
                  STATUS="UP"
                  REASON="Site appears operational (extracted from text)"
                elif grep -qi "down" output.json; then
                  STATUS="DOWN"
                  REASON="Site appears down (extracted from text)"
                else
                  STATUS="UNKNOWN"
                  REASON="No status indicator found in output"
                fi
              fi
              PAGES_JSON=""
            fi
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          if [ -n "$PAGES_JSON" ] && echo "$PAGES_JSON" | jq -e '.pages' > /dev/null 2>&1; then
            echo "📤 Envoi du rapport pages à /pages-report"
            echo "$PAGES_JSON" | jq -c '{pages: .pages}' | \
            curl -X POST "https://kuma-relay.up.railway.app/sites/${SITE_ID}/pages-report" \
              -H "x-relay-secret: $RELAY_SECRET" \
              -H "Content-Type: application/json" \
              -d @- \
              || echo "⚠️ Envoi pages-report échoué"
          else
            echo "ℹ️ Aucun rapport pages structuré à envoyer"
          fi

          jq -n --arg status "$STATUS" --arg message "$REASON" '{status: $status, message: $message}' | \
          curl -X POST "https://kuma-relay.up.railway.app/sites/${SITE_ID}/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            -d @- \
            || echo "⚠️ Envoi mark-crawled échoué"

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            pages.json
            videos/
            frames-*/capture.log
