name: OpenClaw - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs
        id: get-sites
        run: |
          SITES=$(curl -s https://kuma-relay.up.railway.app/active-sites | jq -c '[.sites[] | {id: .id, url: .site_url}]')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

  autonomous-test:
    needs: fetch-sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer OpenClaw
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          ~/.npm-global/bin/openclaw --version

      - name: Générer une configuration OpenClaw valide
        run: |
          mkdir -p ~/.openclaw
          # On utilise la configuration minimale valide
          cat > ~/.openclaw/openclaw.json << 'EOF'
          {
            "browser": {
              "enabled": true,
              "headless": true,
              "noSandbox": true
            },
            "providers": {
              "google": {
                "api": "google-generative-ai"
              }
            }
          }
          EOF
          echo "Contenu du fichier de configuration :"
          cat ~/.openclaw/openclaw.json
          echo "Validation :"
          ~/.npm-global/bin/openclaw config validate || echo "Validation échouée, on continue"

      - name: Démarrer le Gateway
        run: |
          nohup ~/.npm-global/bin/openclaw gateway --force > gateway.log 2>&1 &
          sleep 10
          ~/.npm-global/bin/openclaw gateway status || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Générer la tâche
        run: |
          cat > task.md << EOF
          Va sur ${{ matrix.site.url }} avec l'outil browser.
          1. Explore le site comme un humain : scroll, observe la structure.
          2. Identifie toi-même les 2 ou 3 actions les plus importantes de ce site.
          3. Teste chacune de ces actions et vérifie le résultat attendu.
          4. Si erreur JS, page blanche, ou action qui ne fait rien, prends une capture d'écran et note-le.
          5. Termine par un verdict UP ou DOWN avec la liste des actions testées.
          EOF

      - name: Lancer OpenClaw (avec fallback manuel)
        id: agent_run
        run: |
          set +e

          # === 1er essai : Mistral ===
          echo "======================================"
          echo "Essai avec Mistral pour ${{ matrix.site.url }}"
          echo "======================================"
          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          # Afficher le contenu de output.json pour debug
          echo "Contenu de output.json :"
          cat output.json

          if grep -q "rate limit\|429" output.json; then
            echo "⚠️ Rate limit détecté (Mistral), on va réessayer plus tard"
          elif grep -q "success\|UP\|DOWN" output.json; then
            echo "✅ Succès avec Mistral"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "❌ Échec Mistral, on passe au fallback"
          fi

          # === 2e essai : Mistral (rate limit temporaire) ===
          echo "======================================"
          echo "⚠️ Échec Mistral, nouvelle tentative dans 10s..."
          echo "======================================"
          sleep 10
          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          echo "Contenu de output.json :"
          cat output.json

          if grep -q "success\|UP\|DOWN" output.json; then
            echo "✅ Succès avec Mistral (2e tentative)"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # === Fallback forcé sur Google Gemini ===
          echo "======================================"
          echo "🔁 Fallback forcé sur Google Gemini pour ${{ matrix.site.url }}"
          echo "======================================"

          # Changer le modèle primaire (si cette commande est supportée)
          ~/.npm-global/bin/openclaw config set agents.defaults.model "google/gemini-2.5-flash" || echo "Impossible de changer le modèle, on continue"

          ~/.npm-global/bin/openclaw agent \
            --session-key "ci:${{ matrix.site.id }}" \
            --message-file task.md \
            --json > output.json 2>&1

          echo "Contenu de output.json :"
          cat output.json

          if grep -q "success\|UP\|DOWN" output.json; then
            echo "✅ Succès avec Google Gemini"
            echo "agent_failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Échec final avec Google Gemini"
            echo "agent_failed=true" >> $GITHUB_OUTPUT
          fi

        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCLAW_GATEWAY_TOKEN: "ci-test-token-12345"

      - name: Extraire et envoyer le résultat au Relay
        if: always()
        run: |
          if [ ! -f output.json ]; then
            STATUS="ERROR"
            REASON="Agent did not produce output.json"
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
          else
            # Utiliser grep pour extraire le statut (moins fragile que jq)
            if grep -q '"status": "UP"' output.json; then
              STATUS="UP"
            elif grep -q '"status": "DOWN"' output.json; then
              STATUS="DOWN"
            else
              STATUS="UNKNOWN"
            fi
            # Récupérer le message de 200 caractères
            REASON=$(grep -o '"text": "[^"]*"' output.json | head -1 | cut -d'"' -f4 | head -c 300)
            if [ -z "$REASON" ]; then
              REASON="No text found in output"
            fi
          fi

          curl -X POST "https://kuma-relay.up.railway.app/sites/${{ matrix.site.id }}/mark-crawled" \
            -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"message\": \"$REASON\"}" \
            || echo "Relay report failed"
        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Upload des artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ matrix.site.id }}
          path: |
            gateway.log
            output.json
            ~/.openclaw/workspace/screenshots/
