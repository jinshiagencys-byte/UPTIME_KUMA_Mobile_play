name: Hermes Agent - Monitoring Autonome Multi-Sites

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'ID du site à tester spécifiquement (optionnel)'
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Récupérer les sites actifs et leurs pages
        id: get-sites
        env:
          SITE_ID_INPUT: ${{ github.event.inputs.site_id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          SITE_ID="$SITE_ID_INPUT"

          if [ -n "$SITE_ID" ]; then
            echo "🔍 Test ciblé sur le site $SITE_ID"
            DETAIL=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors/$SITE_ID")

            MONITOR=$(echo "$DETAIL" | jq -c '.monitor | if .type == "http" then {id: .parent, url: .url, name: .parentName} else {id: .id, url: .url, name: .name} end')

            if [ -z "$MONITOR" ] || [ "$MONITOR" == "null" ]; then
              echo "❌ Site $SITE_ID introuvable ou erreur relay"
              echo "sites=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MONITORS=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
            PAGES=$(echo "$ALL_MONITORS" | jq -c --arg sid "$(echo "$MONITOR" | jq -r '.id')" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')

            SITES=$(jq -cn --argjson mon "$MONITOR" --argjson pages "$PAGES" '[{id: $mon.id, url: $mon.url, name: $mon.name, pages: $pages}]')
          else
            RAW=$(curl -s "$RELAY_URL/active-sites")
            SITES_RAW=$(echo "$RAW" | jq -c '[.sites[]? | {id: .id, url: .site_url}]' 2>/dev/null || echo "")

            if [ -z "$SITES_RAW" ] || [ "$SITES_RAW" == "null" ]; then
              echo "⚠️ Réponse Supabase/relay illisible ou vide — aucun test ne sera lancé"
              SITES_RAW="[]"
            fi

            if [ "$SITES_RAW" == "[]" ]; then
              echo "ℹ️ Aucun site actif trouvé sur Supabase — aucun run de vérification ce cycle"
            fi

            SITES_ARRAY="[]"
            while IFS= read -r site; do
              [ -z "$site" ] && continue
              sid=$(echo "$site" | jq -r '.id')
              all=$(curl -s -H "x-relay-secret: $RELAY_SECRET" "$RELAY_URL/monitors")
              pages=$(echo "$all" | jq -c --arg sid "$sid" '[.monitors[]? | select(.type == "http" and (.parent|tostring) == $sid) | {url: .url, name: .name}]')
              site_with_pages=$(echo "$site" | jq -c --argjson pages "$pages" '. + {pages: $pages}')
              SITES_ARRAY=$(echo "$SITES_ARRAY" | jq -c --argjson site "$site_with_pages" '. + [$site]')
            done <<< "$(echo "$SITES_RAW" | jq -c '.[]?')"
            SITES="$SITES_ARRAY"
          fi

          SITES=$(echo "$SITES" | jq -c .)
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          echo "📡 Sites à monitorer: $SITES"

  hermes-test:
    needs: fetch-sites
    if: needs.fetch-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: hermes-check-${{ matrix.site.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          source ~/.bashrc || true
          hermes --version

      - name: Dépendances système (ffmpeg + chromium + agent-browser + Playwright + Xvfb + WM)
        run: |
          set -e

          echo "=== ffmpeg ==="
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version 2>/dev/null | head -1

          echo "=== symlink chromium ==="
          if ! command -v chromium >/dev/null 2>&1 && command -v google-chrome >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium
          fi
          command -v chromium && chromium --version

          echo "=== agent-browser global ==="
          npm install -g agent-browser || echo "⚠️ npm install failed"
          which agent-browser && agent-browser --version || true

          echo "=== Playwright deps ==="
          sudo npx playwright install-deps chromium || echo "⚠️ playwright install-deps failed"
          npx playwright install chromium || echo "⚠️ playwright install chromium failed"

          echo "=== Xvfb + gestionnaire de fenêtres ==="
          sudo apt-get install -y -qq matchbox-window-manager || echo "⚠️ matchbox non installé"
          which Xvfb && echo "✅ Xvfb présent" || echo "❌ Xvfb absent"

      - name: Démarrer Xvfb + WM + Configurer Hermes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISPLAY: ":99"
          AGENT_BROWSER_HEADED: "1"
          AGENT_BROWSER_ARGS: |
            --no-sandbox
            --disable-dev-shm-usage
            --disable-blink-features=AutomationControlled
            --start-maximized
            --no-first-run
            --no-default-browser-check
        run: |
          mkdir -p ~/.hermes
          mkdir -p ~/.hermes/browser_recordings

          unset BROWSERBASE_API_KEY || true
          unset BROWSER_USE_API_KEY || true

          echo "=== Démarrage de Xvfb ==="
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          if kill -0 $XVFB_PID 2>/dev/null; then
            echo "✅ Xvfb actif sur DISPLAY=:99"
            echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          else
            echo "❌ Xvfb n'a pas démarré"
            cat /tmp/xvfb.log
            exit 1
          fi

          echo "=== Démarrage du gestionnaire de fenêtres ==="
          DISPLAY=:99 matchbox-window-manager > /tmp/wm.log 2>&1 &
          sleep 1
          echo "✅ matchbox-window-manager lancé"

          cat > ~/.hermes/.env << EOF
          MISTRAL_API_KEY=${MISTRAL_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}
          HF_TOKEN=${HF_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          DISPLAY=:99
          AGENT_BROWSER_HEADED=1
          EOF

          cat > ~/.hermes/config.yaml << 'EOF'
          browser:
            enabled: true
            cloud_provider: local
            record_sessions: true
            engine: chrome
            headed: true
            inactivity_timeout: 300
            command_timeout: 30

          toolsets:
            - browser
            - terminal
            - web_search
            - web_extract

          display:
            tool_progress: "off"

          sessions:
            auto_prune: false

          model:
            provider: openrouter
            default: openrouter/free

          custom_providers:
            - name: mistral
              base_url: https://api.mistral.ai/v1
              key_env: MISTRAL_API_KEY
          EOF

          echo "=== hermes doctor --fix ==="
          hermes doctor --fix || true

      - name: Générer la tâche
        env:
          PAGES_JSON: ${{ toJson(matrix.site.pages) }}
          SITE_URL: ${{ matrix.site.url }}
        run: |
          PAGES_LIST=$(echo "$PAGES_JSON" | jq -c . | jq -r '[.[]? | .url] | join("\n")')

          cat > task.md << EOF
          Va sur $SITE_URL avec l'outil de navigateur. Explore comme un
          humain (scroll, structure) et détecte le type de site.

          GESTION DES ONGLETS (IMPORTANT POUR LA VIDÉO) :
          - Reste dans UN SEUL onglet autant que possible : utilise la
            navigation dans l'onglet courant plutôt que d'ouvrir de nouveaux
            onglets.
          - Si un clic ouvre un nouvel onglet, ferme l'onglet précédent.
          - Ignore et ferme tout onglet "Loading..." ou affichant une URL
            du type "0.0.3.32" qui ne charge jamais.

          VÉRIFICATION CRITIQUE avant tout le reste : le contenu affiché
          correspond-il vraiment au site attendu, ou est-ce une page par
          défaut d'hébergeur/registrar (ex: "o2switch", "It works!", page de
          parking de domaine, message DNS/SSL non configuré) ? Si le frontend
          affiche des sections censées recevoir des données du backend
          (liste de produits, résultats, profil, prix, etc.) mais qu'elles
          restent vides, bloquées en chargement, ou affichent une erreur/
          "undefined"/"null" à la place des vraies données, c'est un backend
          en panne : DOWN, même si la page HTTP répond 200.

          PAGES À VÉRIFIER OBLIGATOIREMENT :
          $PAGES_LIST

          Choisis 2-3 actions à tester selon le type détecté :
          - E-commerce : ajoute un produit au panier, VÉRIFIE qu'il apparaît
            bien dans le panier (nom/qté/prix) — ces données viennent du
            backend, vérifie qu'elles sont réelles et pas un état vide/figé.
          - Compte utilisateur : inscris-toi avec des données fictives
            (test+ci-<horodatage>@example.com), puis connecte-toi avec ces
            identifiants. Si compte existant seulement, teste juste qu'un
            login invalide donne une erreur propre (pas de vraie connexion).
          - Formulaire de contact : soumets-le en indiquant "TEST AUTOMATISÉ"
            dans le message.
          - Recherche : vérifie que des résultats s'affichent réellement.
          - Sinon : les 2-3 actions les plus représentatives du site.

          IMPORTANT — CHAQUE page listée doit être RÉELLEMENT VISITÉE
          INDIVIDUELLEMENT, et chaque action choisie RÉELLEMENT EXÉCUTÉE
          (cliquée/soumise), pas seulement observée depuis une autre page.
          "Le panier a une structure" n'est PAS un test — le test est "j'ai
          cliqué ajouter, PUIS j'ai vérifié que le produit apparaît". Si deux
          pages différentes ont exactement la même note, c'est suspect : tu
          ne les as probablement pas visitées séparément. Si tu ne peux pas
          exécuter une action ou visiter une page, dis-le explicitement dans
          "note" ET mets actions_completed à false — ne mets JAMAIS
          actions_completed à true juste parce qu'une page a chargé.

          Pour chaque page listée, vérifie au minimum qu'elle répond correctement
          (HTTP 200, contenu attendu). Explore aussi les liens internes pour
          détecter d'éventuelles pages non listées et signale-les dans le JSON
          final. Toute nouvelle URL atteinte = une page distincte à noter.

          Termine par ton verdict en langage naturel (type de site + parcours
          testés, en précisant si le contenu venait bien du backend ou si
          c'était un placeholder/backend en panne), puis ce bloc JSON exact
          en toute fin (rien d'autre dedans) :

          \`\`\`json
          {
            "overall_status": "UP",
            "site_type": "ecommerce",
            "actions_completed": true,
            "pages": [
              {
                "url": "URL exacte",
                "status": "UP",
                "http_code": 200,
                "action_tested": "action testée ou null",
                "note": "explication en une sentence"
              }
            ]
          }
          \`\`\`
          Règles : status/overall_status = "UP" ou "DOWN" uniquement.
          site_type = ecommerce|auth|vitrine|blog|autre. actions_completed =
          true UNIQUEMENT si tu as réellement exécuté chaque action choisie ET
          observé son résultat ; false si tu as seulement navigué sans
          compléter les étapes interactives. Une entrée par page visitée
          (départ + chaque URL distincte, y compris erreurs/404). Un parcours
          métier qui échoue (panier vide après ajout, recherche sans résultat,
          form qui ne soumet rien) = DOWN même si HTTP 200. Une page par
          défaut d'hébergeur ou des données backend manquantes/vides alors
          qu'elles sont attendues = DOWN même si HTTP 200.
          EOF

      - name: Lancer Hermes Agent avec capture vidéo
        id: agent_run
        env:
          DISPLAY: ":99"
          AGENT_BROWSER_HEADED: "1"
          AGENT_BROWSER_ARGS: |
            --no-sandbox
            --disable-dev-shm-usage
            --disable-blink-features=AutomationControlled
            --start-maximized
            --no-first-run
            --no-default-browser-check
        run: |
          set +e

          if ! pgrep -f "Xvfb :99" > /dev/null; then
            echo "⚠️ Xvfb arrêté, redémarrage..."
            Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
            sleep 2
          fi
          if ! pgrep -f matchbox-window-manager > /dev/null; then
            DISPLAY=:99 matchbox-window-manager > /tmp/wm.log 2>&1 &
            sleep 1
          fi

          TASK_CONTENT=$(cat task.md)
          mkdir -p recordings
          rm -f /tmp/best_partial.json
          BEST_PARTIAL_LABEL=""

          run_agent() {
            local provider=$1
            local model=$2
            local label=$3
            echo "======================================"
            echo "Test avec $provider/$model pour ${{ matrix.site.url }}"
            echo "======================================"

            export DISPLAY=:99
            RECORDING_PATH="recordings/${label}.mp4"

            echo "🎥 Démarrage capture ffmpeg optimisée (léger) sur DISPLAY=:99..."
            ffmpeg -y -f x11grab -video_size 1280x800 -framerate 10 \
              -i :99.0 \
              -c:v libx264 -crf 28 -preset fast -tune stillimage -pix_fmt yuv420p -an \
              "$RECORDING_PATH" > /tmp/ffmpeg-${label}.log 2>&1 &
            FFMPEG_PID=$!
            sleep 1
            if kill -0 $FFMPEG_PID 2>/dev/null; then
              echo "✅ ffmpeg actif (PID $FFMPEG_PID)"
            else
              echo "❌ ffmpeg n'a pas démarré"
              cat /tmp/ffmpeg-${label}.log | tail -10
            fi

            hermes -z "$TASK_CONTENT" --provider "$provider" -m "$model" -t "browser,terminal" --yolo > "output-${label}.json" 2>&1
            HERMES_EXIT=$?

            echo "🎥 Arrêt de ffmpeg..."
            if kill -0 $FFMPEG_PID 2>/dev/null; then
              kill -INT $FFMPEG_PID
              wait $FFMPEG_PID 2>/dev/null || true
              echo "✅ ffmpeg arrêté"
            fi

            agent-browser close --all 2>/dev/null || true

            echo "exit_code=$HERMES_EXIT"

            if ! grep -qiE '"overall_status"\s*:\s*"(up|down)"' "output-${label}.json" && grep -qiE 'bloc json|json (ci-dessus|généré|generated above)' "output-${label}.json"; then
              echo "⚠️ ${label} : vérification terminée mais bloc JSON final tronqué — voir output-${label}.json"
            fi

            if [ -f "$RECORDING_PATH" ] && [ -s "$RECORDING_PATH" ]; then
              FILE_SIZE=$(ls -lh "$RECORDING_PATH" | awk '{print $5}')
              echo "✅ Vidéo enregistrée : $RECORDING_PATH ($FILE_SIZE)"
            else
              echo "❌ Fichier vidéo absent ou vide"
              echo "=== Log ffmpeg ==="
              cat /tmp/ffmpeg-${label}.log | tail -30
              echo "=== Dernières lignes des logs Hermes ==="
              tail -50 "output-${label}.json" || true
            fi
          }

          is_json_valid() {
            grep -qiE '"overall_status"\s*:\s*"(up|down)"' "$1"
          }

          is_fully_verified() {
            is_json_valid "$1" && ! grep -qiE '"actions_completed"\s*:\s*false' "$1"
          }

          try_result() {
            cp "$1" output.json
            if is_fully_verified output.json; then
              echo "✅ Succès complet avec ${2}"
              echo "agent_failed=false" >> $GITHUB_OUTPUT
              echo "winning_label=${2}" >> $GITHUB_OUTPUT
              echo "verification_partial=false" >> $GITHUB_OUTPUT
              exit 0
            elif is_json_valid output.json; then
              echo "⚠️ ${2} : JSON valide mais actions_completed=false — mis en réserve, on continue la chaîne"
              cp output.json /tmp/best_partial.json
              BEST_PARTIAL_LABEL="${2}"
            fi
          }

          # ======================================
          # 🥇 PRIORITÉ 1 : NVIDIA NIM (Modèle principal)
          # ======================================
          echo "======================================"
          echo "🥇 PRIORITÉ 1 : NVIDIA NIM"
          echo "======================================"
          run_agent "nvidia" "moonshotai/kimi-k3" "nvidia1"
          try_result "output-nvidia1.json" "nvidia1"

          # ======================================
          # 🥈 PRIORITÉ 2 : Chaîne de repli OpenRouter (modèles gratuits)
          # ======================================
          echo "======================================"
          echo "🔁 PRIORITÉ 2 : Chaîne de repli OpenRouter"
          echo "======================================"
          for OR_MODEL in "poolside/laguna-s-2.1:free" "inclusionai/ling-3.0-flash-fin:free" "thinkingmachines/inkling:free" "openrouter/free"; do
            label="openrouter-$(echo "$OR_MODEL" | tr '/:' '--')"
            run_agent "openrouter" "$OR_MODEL" "$label"
            try_result "output-${label}.json" "$label"
          done

          # ======================================
          # 🥉 PRIORITÉ 3 : Fallback sur Mistral / Gemini / HuggingFace
          # ======================================
          echo "======================================"
          echo "🔁 PRIORITÉ 3 : Fallback sur Mistral / Gemini / HuggingFace"
          echo "======================================"
          for PAIR in "custom:mistral|mistral-small-latest" "gemini|gemini-3.1-pro-preview" "huggingface|openai/gpt-oss-120b:cerebras"; do
            provider="${PAIR%%|*}"
            model="${PAIR#*|}"
            label="$(echo "${provider}-${model}" | tr '/:' '--')"
            run_agent "$provider" "$model" "$label"
            try_result "output-${label}.json" "$label"
          done

          # Aucun modèle n'a complété toutes les actions demandées : on utilise le meilleur essai partiel
          if [ -f /tmp/best_partial.json ]; then
            echo "⚠️ Aucun modèle n'a complété toutes les actions — utilisation du meilleur essai partiel (${BEST_PARTIAL_LABEL})"
            cp /tmp/best_partial.json output.json
            echo "agent_failed=false" >> $GITHUB_OUTPUT
            echo "winning_label=${BEST_PARTIAL_LABEL}" >> $GITHUB_OUTPUT
            echo "verification_partial=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Échec final après tous les providers"
          echo "agent_failed=true" >> $GITHUB_OUTPUT

      - name: Extraire et envoyer le résultat
        if: always()
        env:
          SITE_ID: ${{ matrix.site.id }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          WINNING_LABEL: ${{ steps.agent_run.outputs.winning_label }}
          VERIFICATION_PARTIAL: ${{ steps.agent_run.outputs.verification_partial }}
        run: |
          if [ ! -f output.json ] || [ ! -s output.json ]; then
            STATUS="ERROR"
            REASON="Agent output missing or empty"
            PAGES_JSON=""
          elif [ "${{ steps.agent_run.outputs.agent_failed }}" == "true" ]; then
            STATUS="ERROR"
            REASON="Agent execution failed after all attempts"
            PAGES_JSON=""
          else
            AGENT_TEXT=$(cat output.json)
            PAGES_JSON=$(printf '%s' "$AGENT_TEXT" | awk '
              /```json/ { capture=1; buf=""; next }
              /```/ { if (capture) { last=buf; capture=0 } ; next }
              capture { buf = buf $0 "\n" }
              END { printf "%s", last }
            ')

            if echo "$PAGES_JSON" | jq -e '.overall_status and .pages' > /dev/null 2>&1; then
              STATUS=$(echo "$PAGES_JSON" | jq -r '.overall_status // "UNKNOWN"' | tr '[:lower:]' '[:upper:]')
              SITE_TYPE=$(echo "$PAGES_JSON" | jq -r '.site_type // "non détecté"')
              PAGES_JSON=$(echo "$PAGES_JSON" | jq -c '.pages |= map(.status |= (if . then ascii_upcase else "UNKNOWN" end))')
              REASON=$(echo "$PAGES_JSON" | jq -c '.pages')
              echo "$PAGES_JSON" > pages.json
              echo "🏷️ Type de site détecté : $SITE_TYPE"
              echo "📄 $(echo "$PAGES_JSON" | jq '.pages | length') page(s) rapportée(s) :"
              echo "$PAGES_JSON" | jq -r '.pages[] | "  - \(.url) → \(.status) (http=\(.http_code // "n/a")) : \(.action_tested // "navigation simple") — \(.note // "")"'

              MAX_DUP=$(echo "$PAGES_JSON" | jq '[.pages[].note] | group_by(.) | map(length) | max')
              TOTAL_PAGES=$(echo "$PAGES_JSON" | jq '.pages | length')
              if [ -n "$MAX_DUP" ] && [ -n "$TOTAL_PAGES" ] && [ "$TOTAL_PAGES" -gt 0 ] && [ "$MAX_DUP" -ge $(( (TOTAL_PAGES + 1) / 2 )) ]; then
                echo "⚠️ ${MAX_DUP}/${TOTAL_PAGES} pages partagent une note identique — vérification probablement bâclée"
                REASON="⚠️ VÉRIFICATION SUSPECTE (notes dupliquées, ${MAX_DUP}/${TOTAL_PAGES} pages identiques) — $REASON"
              fi
            else
              echo "⚠️ Bloc JSON structuré introuvable, repli sur extraction texte"
              if echo "$AGENT_TEXT" | grep -qi "up"; then
                STATUS="UP"
                REASON="Site appears operational (extracted from text)"
              elif echo "$AGENT_TEXT" | grep -qi "down"; then
                STATUS="DOWN"
                REASON="Site appears down (extracted from text)"
              else
                STATUS="UNKNOWN"
                REASON="No status indicator found in output"
              fi
              PAGES_JSON=""
            fi
          fi

          if [ "$VERIFICATION_PARTIAL" == "true" ]; then
            REASON="⚠️ VÉRIFICATION PARTIELLE (aucun modèle n'a complété toutes les actions demandées) — $REASON"
          fi

          echo "Statut final: $STATUS"
          echo "Message: $REASON"

          if [ -n "$PAGES_JSON" ] && echo "$PAGES_JSON" | jq -e '.pages' > /dev/null 2>&1; then
            echo "📤 Envoi du rapport pages à $RELAY_URL/sites/$SITE_ID/pages-report"
            echo "$PAGES_JSON" | jq -c '{pages: .pages}' > pages_payload.json
            curl -X POST "$RELAY_URL/sites/$SITE_ID/pages-report" -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @pages_payload.json || echo "⚠️ Échec envoi pages-report"
          fi

          echo "📤 Envoi du statut global à $RELAY_URL/sites/$SITE_ID/mark-crawled"
          jq -nc --arg status "$STATUS" --arg message "$REASON" '{status: $status, message: $message}' > status_payload.json
          curl -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" -H "x-relay-secret: $RELAY_SECRET" -H "Content-Type: application/json" -d @status_payload.json || echo "⚠️ Échec envoi mark-crawled"

      - name: Lister toutes les vidéos enregistrées (Aucun filtrage)
        if: always()
        run: |
          echo "=== Vidéos enregistrées (TOUTES conservées pour l'artefact) ==="
          ls -lah recordings/ 2>/dev/null || echo "(aucune vidéo trouvée)"

      - name: Uploader la vidéo (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-recordings-${{ matrix.site.id }}
          path: recordings/*
          if-no-files-found: ignore
          retention-days: 7
