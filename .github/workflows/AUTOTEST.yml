name: AUTOTEST Monitoring - Génération + Rejeu

on:
  schedule:
    # Rejeu toutes les 3h (Phase B, sans LLM)
    - cron: "0 */3 * * *"
    # Génération mensuelle, le 1er à 2h du matin (Phase A, avec LLM)
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à forcer manuellement"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - generate
          - regenerate-pending

env:
  PYTHONPATH: ${{ github.workspace }}/autotest-monitoring/autotest_package

jobs:
  # ──────────────────────────────────────────
  # Détermine si ce run est "generate", "run" ou "regenerate-pending"
  # ──────────────────────────────────────────
  decide-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      # ⚠️ Un dispatch via API / `gh workflow run` SANS -f mode=... n'est pas
      # bloqué par `required: true` (non appliqué hors formulaire UI) :
      # github.event.inputs.mode vaut alors "" et AUCUN job conditionnel ne
      # tourne (run silencieux sans erreur). On rétablit donc explicitement
      # le défaut "run" et on échoue net si le mode est invalide.
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_MODE:-}" ]; then
              echo "::warning::Aucun input 'mode' reçu (dispatch API/CLI sans -f mode=...). Repli sur le mode par défaut : run."
            fi
            MODE="${INPUT_MODE:-run}"
          elif [ "$CRON" = "0 2 1 * *" ]; then
            MODE="generate"
          else
            MODE="run"
          fi

          case "$MODE" in
            run|generate|regenerate-pending) ;;
            *)
              echo "::error::mode invalide : '$MODE' (attendu : run | generate | regenerate-pending)"
              exit 1
              ;;
          esac

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode résolu : $MODE (event=$EVENT_NAME, cron=${CRON:-aucun})"
          {
            echo "### decide-mode"
            echo ""
            echo "| event | cron | mode retenu |"
            echo "| --- | --- | --- |"
            echo "| $EVENT_NAME | ${CRON:-—} | \`$MODE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────
  # Récupère les sites actifs depuis le relay.
  # Toutes les routes du relay exigent le header x-relay-secret.
  # /active-sites renvoie : {"success":true,"sites":[{id, client_name, site_url}, ...]}
  # (ne remonte que les sites is_active=true, crawl_acknowledged null/true, et "dus")
  # ──────────────────────────────────────────
  fetch-sites:
    needs: decide-mode
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get.outputs.sites }}
      has_sites: ${{ steps.get.outputs.has_sites }}
    steps:
      - id: get
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RELAY_URL:-}" ]; then
            echo "::error::secret RELAY_URL manquant"
            exit 1
          fi

          if ! RAW=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" \
            "$RELAY_URL/active-sites"); then
            echo "::error::appel $RELAY_URL/active-sites impossible (voir le message curl ci-dessus)"
            exit 1
          fi
          echo "Réponse brute /active-sites :"
          echo "$RAW"

          echo "$RAW" | jq -e '.success == true' > /dev/null \
            || { echo "::error::réponse invalide du relay"; exit 1; }

          SITES=$(echo "$RAW" | jq -c '[(.sites // [])[] | .site_url] | map(select(. != null and . != ""))')
          echo "sites=$SITES" >> "$GITHUB_OUTPUT"

          COUNT=$(echo "$SITES" | jq 'length')
          echo "Sites exploitables (site_url non vide) renvoyés par /active-sites : $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "has_sites=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sites=false" >> "$GITHUB_OUTPUT"
            echo "Aucun site à traiter : les jobs generate / run-monitoring seront ignorés."
            echo "::notice::/active-sites n'a renvoyé aucun site (is_active=false, crawl non acquitté, ou site déjà crawlé donc non dû)."
          fi

          {
            echo "### fetch-sites"
            echo ""
            echo "\`/active-sites\` → **$COUNT** site(s) à traiter"
            echo ""
            echo '```json'
            echo "$SITES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────
  # PHASE A — génération (mensuelle ou manuelle), un job par site
  # Utilise le système de providers natif d'AUTOTEST (--provider), pas un
  # endpoint générique : provider apinex (API compatible OpenAI, modèle
  # gratuit free/mimo-v2.6-pro), clé lue via APINEX_API_KEY (nom exact
  # confirmé dans llm_wrapper.py : provider "apinex" →
  # os.getenv("APINEX_API_KEY")). Remplace google-gemini suite aux rate
  # limits rencontrés sur ce dernier.
  # ──────────────────────────────────────────
  generate:
    needs: [decide-mode, fetch-sites]
    if: needs.decide-mode.outputs.mode == 'generate' && needs.fetch-sites.outputs.has_sites == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}

    env:
      APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}

    steps:
      # Ce workflow tourne dans un autre repo que AUTOTEST-monitoring : GITHUB_TOKEN
      # ne peut pas y pousser. AUTOTEST_REPO_TOKEN = PAT fine-grained limité au repo
      # AUTOTEST-monitoring avec la permission "Contents: Read and write".
      - name: Checkout AUTOTEST-monitoring
        uses: actions/checkout@v4
        with:
          repository: jinshiagencys-byte/AUTOTEST-monitoring
          path: autotest-monitoring
          token: ${{ secrets.AUTOTEST_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r autotest-monitoring/autotest_package/requirements.txt

      - name: Vérifier la clé apinex
        run: |
          if [ -z "$APINEX_API_KEY" ]; then
            echo "ERREUR : secret APINEX_API_KEY manquant"
            exit 1
          fi
          echo "Clé apinex présente."

      - name: Restaurer le cache des artefacts de monitoring
        uses: actions/cache@v4
        with:
          path: autotest-monitoring/monitoring_artifacts
          key: monitoring-artifacts-${{ github.run_id }}
          restore-keys: monitoring-artifacts-

      - name: Générer les scripts (Phase A)
        run: |
          python -m autotest.monitoring generate \
            --site "${{ matrix.site }}" --max-depth 2 \
            --provider 6 \
            --store autotest-monitoring/monitoring_artifacts

      - name: Committer les artefacts générés
        working-directory: autotest-monitoring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitoring_artifacts/
          git diff --cached --quiet || git commit -m "Régénération monitoring: ${{ matrix.site }} [skip ci]"
          git pull --rebase origin main
          git push origin main

  # ──────────────────────────────────────────
  # PHASE A bis — traite la file "pending" (dom_changed)
  # ──────────────────────────────────────────
  regenerate-pending:
    needs: decide-mode
    if: needs.decide-mode.outputs.mode == 'regenerate-pending'
    runs-on: ubuntu-latest
    env:
      APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
    steps:
      - name: Checkout AUTOTEST-monitoring
        uses: actions/checkout@v4
        with:
          repository: jinshiagencys-byte/AUTOTEST-monitoring
          path: autotest-monitoring
          token: ${{ secrets.AUTOTEST_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r autotest-monitoring/autotest_package/requirements.txt

      - name: Régénérer les pages en attente
        run: |
          python -m autotest.monitoring regenerate \
            --pending --provider 6 \
            --store autotest-monitoring/monitoring_artifacts

      - name: Committer si changements
        working-directory: autotest-monitoring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitoring_artifacts/
          git diff --cached --quiet || git commit -m "Régénération (file pending) [skip ci]"
          git pull --rebase origin main
          git push origin main

  # ──────────────────────────────────────────
  # PHASE B — rejeu déterministe, zéro LLM, un job par site
  # ──────────────────────────────────────────
  run-monitoring:
    needs: [decide-mode, fetch-sites]
    if: needs.decide-mode.outputs.mode == 'run' && needs.fetch-sites.outputs.has_sites == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.fetch-sites.outputs.sites) }}
    steps:
      - name: Checkout AUTOTEST-monitoring
        uses: actions/checkout@v4
        with:
          repository: jinshiagencys-byte/AUTOTEST-monitoring
          path: autotest-monitoring
          # GITHUB_TOKEN est limité à CE repo : impossible de cloner un autre
          # dépôt avec (404). Il faut le PAT fine-grained, comme dans les jobs
          # generate / regenerate-pending.
          token: ${{ secrets.AUTOTEST_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Chrome et ChromeDriver sont préinstallés sur ubuntu-latest.
      # Aucune dépendance LLM ici (Phase B est 100% déterministe).
      - name: Installer Selenium uniquement
        run: |
          pip install selenium==4.15.2 requests
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version

      - name: Rejeu (Phase B, sans LLM)
        env:
          MONITOR_CHROME_BINARY: /usr/bin/google-chrome
        run: |
          mkdir -p monitoring_reports
          export MONITOR_CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          python -m autotest.monitoring run \
            --site "${{ matrix.site }}" --page-timeout 120 \
            --store autotest-monitoring/monitoring_artifacts \
            --output monitoring_reports/${{ strategy.job-index }}.json

      # ⚠️ Le format de sortie de `run --output` (pages avec OK/SKIP/FAIL,
      # motif, version script, flag regenerate) ne correspond PAS forcément
      # tel quel au schéma attendu par /sites/:id/pages-report côté relay
      # (status UP/DOWN/ERROR/UNKNOWN, http_code, response_time_ms, note).
      # Une transformation jq (ou un petit script Python) sera probablement
      # nécessaire ici avant l'envoi — pas encore fait/vérifié.
      - name: Envoyer le rapport au relay (frontière Phase C)
        if: always()
        run: |
          F="monitoring_reports/${{ strategy.job-index }}.json"
          if [ ! -f "$F" ]; then
            echo "Aucun rapport à envoyer ($F absent)."
            exit 0
          fi
          # SITE_ID nécessaire pour construire la route ; à récupérer via
          # /active-sites (id) plutôt que de deviner à partir de l'URL.
          echo "TODO: résoudre SITE_ID pour ${{ matrix.site }} avant l'envoi."
          # curl -sS -X POST -H "x-relay-secret: ${{ secrets.RELAY_SECRET }}" \
          #   -H "Content-Type: application/json" \
          #   "${{ secrets.RELAY_URL }}/sites/$SITE_ID/pages-report" \
          #   --data-binary @"$F"

      - name: Uploader le rapport comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report-${{ strategy.job-index }}
          path: monitoring_reports/
