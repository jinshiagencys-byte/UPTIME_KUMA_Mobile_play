# .github/workflows/run-goals.yml
# Runs the goals of ONE site with jev-ultrafast, judges them, uploads the traces.
# Manual only for now (no cron).
name: Run goals (jev)

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "sites.id (uuid)"
        required: true
      dry_run:
        description: "Do not write last_result to Supabase"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Clone YOUR fork of jev-ultrafast (with the patched model.py).
      # github.repository_owner = the account that owns this repo. If your fork lives
      # under another account, replace it by that username. The fork must be public.
      - name: Clone jev-ultrafast (fork)
        run: git clone --depth 1 "https://github.com/jinshiagencys-byte/jev-ultrafast.git"

      # Secrets: TYPESAFE_API_KEY and OPENROUTER_API_KEY. Model names / base URL are not secret.
      - name: Write jev .env
        working-directory: jev-ultrafast
        run: |
          {
            echo "TYPESAFE_API_KEY=$TYPESAFE_API_KEY"
            echo "TYPESAFE_MODEL=jev-1.13-free"
            echo "TEXT_MODEL_API_KEY=$TEXT_MODEL_API_KEY"
            echo "TEXT_MODEL_BASE_URL=https://openrouter.ai/api/v1"
            echo "TEXT_MODEL=stealth/space-bunny-alpha"
          } > .env
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TEXT_MODEL_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Install jev
        working-directory: jev-ultrafast
        run: uv sync

      # browser_harness.helpers.cdp() plafonne chaque appel CDP a 5 s (constante
      # DEFAULT_IPC_RESPONSE_TIMEOUT_SECONDS), alors que la boucle d'attente de
      # Browser.__init__ dans browser.py est calibree a 15 s et que le README revendique
      # des sites reels. Sur une marketplace en CI (runner 2 vCPU, profil Chrome froid,
      # aucun cache), Page.navigate depasse 5 s : l'agent meurt en _IPCResponseTimeout,
      # run_goals.py renvoie un verdict ERROR, et sys.exit(2) rend le job rouge.
      #
      # On remonte le defaut au niveau de Browser.call : la valeur transite par **params
      # jusqu'au parametre NOMME _response_timeout de cdp() (elle n'est donc pas rangee
      # dans params, qui ne contient que des parametres CDP). Cela couvre aussi
      # Runtime.evaluate, dont le snapshot DOM d'une grosse page peut depasser 5 s aussi.
      - name: Patch timeout CDP (5s -> 45s)
        working-directory: jev-ultrafast
        run: |
          set -euo pipefail
          F="jev_ultrafast/browser.py"
          [ -f "$F" ] || { echo "::error::Fichier absent : $F"; exit 1; }

          echo "--- Browser.call avant patch ---"
          grep -n "def call\|return cdp(method" "$F"

          sed -i \
            -e 's/^    def call(self, method, \*\*params):$/    def call(self, method, _response_timeout=45, **params):/' \
            -e 's/^        return cdp(method, session_id=self.session, \*\*params)$/        return cdp(method, session_id=self.session, _response_timeout=_response_timeout, **params)/' \
            "$F"

          echo "--- Browser.call apres patch ---"
          grep -n "def call\|return cdp(method" "$F"

          # Garde-fou : si le fork est refactorise, on veut un job ROUGE bruyamment,
          # pas un patch silencieux qui ne corrige plus rien.
          grep -q 'def call(self, method, _response_timeout=45, \*\*params):' "$F" \
            || { echo "::error::Ancre 'def call' introuvable : patch non applique."; exit 1; }
          grep -q 'return cdp(method, session_id=self.session, _response_timeout=_response_timeout, \*\*params)' "$F" \
            || { echo "::error::Ancre 'return cdp' introuvable : patch non applique."; exit 1; }

          uv run python -m py_compile "$F" || { echo "::error::browser.py ne compile plus."; exit 1; }

          # _response_timeout doit exister dans la version INSTALLEE de browser_harness.
          # S'il n'existe pas, le parametre ajoute ci-dessus partirait dans **params et
          # n'aurait aucun effet : on le verifie plutot que de le presumer.
          uv run python -c 'import inspect, sys
          from browser_harness.helpers import cdp
          p = inspect.signature(cdp).parameters
          if "_response_timeout" not in p:
              sys.exit("::error::cdp() n expose pas _response_timeout : patch inoperant")
          print("[patch] defaut cdp() =", p["_response_timeout"].default, "s -> surcharge a 45s via Browser.call")'

      # Same setup as the local tests: Chrome with remote debugging, Browser Harness attaches via BU_CDP_WS.
      - name: Start Chrome (headless, remote debugging)
        run: |
          # --disable-dev-shm-usage : /dev/shm ne fait que 64 Mo sur les runners GitHub.
          # Un renderer qui le sature se fait tuer par le kernel, ce qui fait pendre
          # Page.navigate (et reproduit le timeout de 5 s meme apres le patch CDP).
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/jev-chrome \
            --disable-blink-features=AutomationControlled about:blank > /tmp/chrome.log 2>&1 &
          WS=""
          for i in $(seq 1 30); do
            WS=$(curl -s http://127.0.0.1:9222/json/version | python3 -c "import sys,json; print(json.load(sys.stdin)['webSocketDebuggerUrl'])" 2>/dev/null) && [ -n "$WS" ] && break
            sleep 1
          done
          [ -n "$WS" ] || { echo "Chrome did not start"; cat /tmp/chrome.log; exit 1; }
          echo "BU_CDP_WS=$WS" >> "$GITHUB_ENV"

      # Page.navigate timed out after 5s on a cold first load: warm Chrome up first.
      - name: Warm up Chrome
        run: |
          curl -s -X PUT "http://127.0.0.1:9222/json/new?https://example.com" > /dev/null || true
          sleep 5

      - name: Debug layout
        run: |
          pwd
          ls -la
          ls -la goalgen || echo "goalgen/ MISSING"
          # Chemin reel : jev-ultrafast/jev_ultrafast/model.py. L'ancien "jev/model.py"
          # n'existe pas et le "||" de la version precedente masquait l'echec, donc cette
          # etape n'affichait rien d'utile.
          ls -la jev-ultrafast/jev_ultrafast
          grep -n "opencode.ai\|typesafe.ai" jev-ultrafast/jev_ultrafast/model.py \
            || echo "model.py introuvable ou endpoint attendu absent"

      - name: Run goals
        working-directory: jev-ultrafast
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOALGEN_MODEL: stealth/space-bunny-alpha
        run: |
          uv run --with requests --env-file .env python "${{ github.workspace }}/goalgen/run_goals.py" \
            --site-id "${{ inputs.site_id }}" \
            --out-dir "${{ github.workspace }}/runs" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-runs
          path: runs/
          if-no-files-found: ignore
