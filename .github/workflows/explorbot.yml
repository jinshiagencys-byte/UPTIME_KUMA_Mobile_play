name: "Explorbot - Exploration autonome (Cloudflare)"

on:
workflow_dispatch:
inputs:
site_url:
description: "URL du site à explorer"
required: false
type: string
default: "https://odjafrik.com"

```
  max_tests:
    description: "Nombre de scénarios maximum"
    required: false
    type: string
    default: "3"
```

permissions:
contents: read

jobs:
explore:
runs-on: ubuntu-latest
timeout-minutes: 30

```
steps:
  - name: "Checkout"
    uses: actions/checkout@v4

  - name: "Installer Node.js"
    uses: actions/setup-node@v4
    with:
      node-version: "24"

  - name: "Installer Explorbot et client OpenAI"
    run: |
      npm install explorbot @ai-sdk/openai
      npx playwright install --with-deps chromium

  - name: "Créer la configuration Explorbot"
    run: |
      cat > explorbot.config.js <<'EOF'
      import { createOpenAI } from '@ai-sdk/openai';

      const cloudflare = createOpenAI({
        apiKey: process.env.CLOUDFLARE_AUTH_TOKEN,
        baseURL:
          `https://api.cloudflare.com/client/v4/accounts/` +
          `${process.env.CLOUDFLARE_ACCOUNT_ID}/ai/v1`,
      });

      const model = cloudflare('@cf/zai-org/glm-4.7-flash');

      const visionModel =
        cloudflare('@cf/meta/llama-4-scout-17b-16e-instruct');

      export default {
        web: {
          url: process.env.SITE_URL,
        },

        ai: {
          model,
          visionModel,
          agenticModel: model,

          agents: {
            historian: {
              framework: 'playwright',
              screencast: true,
            },
          },
        },

        playwright: {
          browser: 'chromium',
          show: false,
          timeout: 30000,
          waitForNavigation: 'networkidle',
          waitForTimeout: 2000,

          args: [
            '--no-sandbox',
            '--disable-gpu',
            '--disable-dev-shm-usage',
          ],
        },

        reporter: {
          markdown: true,
          html: true,
        },

        dirs: {
          output: 'output',
        },
      };
      EOF

  - name: "Vérifier les secrets Cloudflare"
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
    run: |
      set -euo pipefail

      if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
        echo "ERREUR: CLOUDFLARE_ACCOUNT_ID est absent."
        exit 1
      fi

      if [ -z "$CLOUDFLARE_AUTH_TOKEN" ]; then
        echo "ERREUR: CLOUDFLARE_AUTH_TOKEN est absent."
        exit 1
      fi

      echo "CLOUDFLARE_ACCOUNT_ID : présent"
      echo "CLOUDFLARE_AUTH_TOKEN : présent"

  - name: "Tester GLM-4.7-Flash"
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
    run: |
      set -euo pipefail

      curl --fail-with-body \
        --request POST \
        --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1/chat/completions" \
        --header "Authorization: Bearer ${CLOUDFLARE_AUTH_TOKEN}" \
        --header "Content-Type: application/json" \
        --data '{
          "model": "@cf/zai-org/glm-4.7-flash",
          "messages": [
            {
              "role": "user",
              "content": "Reply with exactly: CLOUDFLARE_OK"
            }
          ],
          "max_tokens": 20
        }'

  - name: "Lancer Explorbot"
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      SITE_URL: ${{ inputs.site_url }}
    run: |
      set -euo pipefail

      npx explorbot explore / \
        --max-tests "${{ inputs.max_tests }}"

  - name: "Afficher les résultats"
    if: always()
    run: |
      echo "===== RAPPORTS ====="
      find output/reports -type f 2>/dev/null || true

      echo "===== TESTS ====="
      find output/tests -type f 2>/dev/null || true

      echo "===== SCREENCASTS ====="
      find output/screencasts -type f 2>/dev/null || true

  - name: "Uploader les résultats"
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: "explorbot-cloudflare-${{ github.run_id }}"
      path: "output/"
      if-no-files-found: warn
      retention-days: 14
```
