name: Explorbot LLM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorbot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Pour changer de fournisseur, modifie uniquement ces 3 lignes
    env:
      LLM_API_KEY: ${{ secrets.COMET_API_KEY }}
      LLM_BASE_URL: https://api.cometapi.com/v1
      LLM_MODEL: qwen3.8-omni-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Explorbot
        run: |
          npm install explorbot @ai-sdk/openai-compatible
          npx playwright install --with-deps chromium

      - name: Check API key
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "ERROR: API key secret is missing"
            exit 1
          fi

          echo "API key is present"

      - name: Verify LLM connection
        run: |
          echo "Testing $LLM_MODEL (simple call)..."

          RESPONSE=$(curl -sS -w "\nTemps: %{time_total}s\n" \
            "$LLM_BASE_URL/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -d "{
              \"model\": \"$LLM_MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Réponds uniquement par: OK\"
                }
              ],
              \"max_tokens\": 500
            }")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "ERROR: the API rejected the request."
            exit 1
          fi

          echo "LLM connection OK."

      - name: Verify tool calling (informational)
        run: |
          echo "Testing forced tool calling..."

          RESPONSE=$(curl -sS -w "\nTemps: %{time_total}s\n" \
            "$LLM_BASE_URL/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -d "{
              \"model\": \"$LLM_MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Appelle la fonction ping.\"
                }
              ],
              \"tools\": [
                {
                  \"type\": \"function\",
                  \"function\": {
                    \"name\": \"ping\",
                    \"description\": \"Ping\",
                    \"parameters\": {
                      \"type\": \"object\",
                      \"properties\": {}
                    }
                  }
                }
              ],
              \"tool_choice\": \"required\",
              \"max_tokens\": 500
            }")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"tool_calls"'; then
            echo "Tool calling OK."
          else
            echo "WARNING: no tool call returned, Explorbot may struggle with this model."
          fi

      - name: Create Explorbot config
        run: |
          cat > explorbot.config.js <<'EOF'
          import { createOpenAICompatible } from '@ai-sdk/openai-compatible';

          const provider = createOpenAICompatible({
            name: 'llm',
            baseURL: process.env.LLM_BASE_URL,
            apiKey: process.env.LLM_API_KEY,
          });

          const model = provider(process.env.LLM_MODEL);

          export default {
            web: {
              url: 'https://odjafrik.com',
            },

            ai: {
              model,
              agenticModel: model,
              visionModel: model,

              agents: {
                planner: { model },
                researcher: { model },
                tester: { model },
                navigator: { model },
                pilot: { model },
                historian: {
                  model,
                  screencast: {
                    size: { width: 1280, height: 720 },
                    quality: 95,
                  },
                },
                analyst: { model },
                'experience-compactor': { model },
              },
            },

            playwright: {
              show: false,
              timeout: 30000,
              waitForNavigation: 'domcontentloaded',
              args: [
                '--no-sandbox',
                '--disable-gpu',
                '--disable-dev-shm-usage',
              ],
            },

            reporter: {
              markdown: true,
              html: true,
            },
          };
          EOF

          echo "Explorbot configuration created."

      - name: Run Explorbot
        run: |
          echo "========================================"
          echo "Starting Explorbot"
          echo "Model: $LLM_MODEL"
          echo "Target: https://odjafrik.com"
          echo "Maximum tests: 3"
          echo "Maximum duration: 600"
          echo "========================================"

          timeout 22m npx explorbot explore https://odjafrik.com \
            --max-tests 3 \
            --max-duration 600

      - name: Show results
        if: always()
        run: |
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          if [ -d output ]; then
            find output -type f -printf '%p\n' | sort
          else
            echo "No output directory found."
          fi

          echo ""
          echo "========================================"
          echo "SCREENCASTS"
          echo "========================================"

          if [ -d output/screencasts ]; then
            find output/screencasts -type f -printf '%p\n' | sort
          else
            echo "No screencasts directory found."
          fi

      - name: Upload Explorbot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorbot-results
          path: |
            output/
            explorbot.config.js
          if-no-files-found: warn
          retention-days: 14
