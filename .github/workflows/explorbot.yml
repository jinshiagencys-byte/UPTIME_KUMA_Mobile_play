name: Explorbot OmniRoute

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorbot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      # URL publique de ton OmniRoute, avec /v1 a la fin
      # ex: https://omniroute.mondomaine.com/v1
      OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Explorbot
        run: |
          npm install explorbot @ai-sdk/openai-compatible
          npx playwright install --with-deps chromium

      - name: Check OmniRoute secrets
        run: |
          if [ -z "$OMNIROUTE_API_KEY" ]; then
            echo "ERROR: OMNIROUTE_API_KEY is missing"
            exit 1
          fi

          if [ -z "$OMNIROUTE_BASE_URL" ]; then
            echo "ERROR: OMNIROUTE_BASE_URL is missing"
            exit 1
          fi

          echo "OmniRoute secrets are present"

      - name: Verify OmniRoute connection
        run: |
          echo "Testing OmniRoute..."

          RESPONSE=$(curl -sS \
            "$OMNIROUTE_BASE_URL/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" \
            -d '{
              "model": "kr/claude-haiku-4.5",
              "messages": [
                {
                  "role": "user",
                  "content": "Réponds uniquement par: OK"
                }
              ],
              "max_tokens": 20
            }')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "ERROR: OmniRoute rejected the request."
            exit 1
          fi

          echo "OmniRoute connection OK."

      - name: Create Explorbot config
        run: |
          cat > explorbot.config.js <<'EOF'
          import { createOpenAICompatible } from '@ai-sdk/openai-compatible';

          const omniroute = createOpenAICompatible({
            name: 'omniroute',
            baseURL: process.env.OMNIROUTE_BASE_URL,
            apiKey: process.env.OMNIROUTE_API_KEY,
          });

          const model = omniroute('kr/claude-haiku-4.5');

          export default {
            web: {
              url: 'https://odjafrik.com',
            },

            ai: {
              model,
              agenticModel: model,
              visionModel: model,

              agents: {
                planner: { model },
                researcher: { model },
                tester: { model },
                navigator: { model },
                pilot: { model },
                historian: { model },
                analyst: { model },
                'experience-compactor': { model },
              },
            },

            playwright: {
              show: false,
              timeout: 30000,
              waitForNavigation: 'domcontentloaded',
              args: [
                '--no-sandbox',
                '--disable-gpu',
                '--disable-dev-shm-usage',
              ],
            },

            reporter: {
              markdown: true,
              html: true,
            },
          };
          EOF

          echo "Explorbot configuration created."

      - name: Run Explorbot
        run: |
          echo "========================================"
          echo "Starting Explorbot"
          echo "Provider: OmniRoute"
          echo "Model: kr/claude-haiku-4.5"
          echo "Target: https://odjafrik.com"
          echo "Maximum tests: 7"
          echo "Maximum duration: 900"
          echo "========================================"

          npx explorbot explore https://odjafrik.com \
            --max-tests 7 \
            --max-duration 900

      - name: Show results
        if: always()
        run: |
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          if [ -d output ]; then
            find output -type f -printf '%p\n' | sort
          else
            echo "No output directory found."
          fi

          echo ""
          echo "========================================"
          echo "SCREENCASTS"
          echo "========================================"

          if [ -d output/screencasts ]; then
            find output/screencasts -type f -printf '%p\n' | sort
          else
            echo "No screencasts directory found."
          fi

      - name: Upload Explorbot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorbot-omniroute-haiku
          path: |
            output/
            explorbot.config.js
          if-no-files-found: warn
          retention-days: 14
