name: Explorbot Ollama Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorbot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Explorbot
        run: |
          npm install explorbot ollama-ai-provider-v2
          npx playwright install --with-deps chromium

      - name: Check Ollama API key
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "ERROR: OLLAMA_API_KEY is missing"
            exit 1
          fi

          echo "OLLAMA_API_KEY is present"

      - name: Verify Ollama Cloud connection
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          echo "Testing Ollama Cloud..."

          RESPONSE=$(curl -sS \
            https://ollama.com/api/chat \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OLLAMA_API_KEY" \
            -d '{
              "model": "gemma4:31b",
              "messages": [
                {
                  "role": "user",
                  "content": "Réponds uniquement par: OK"
                }
              ],
              "stream": false
            }')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "ERROR: Ollama Cloud rejected the request."
            exit 1
          fi

          echo "Ollama Cloud connection OK."

      - name: Create Explorbot config
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          cat > explorbot.config.js <<'EOF'
          import { createOllama } from 'ollama-ai-provider-v2';

          const ollamaCloud = createOllama({
            baseURL: 'https://ollama.com/api',
            headers: {
              Authorization: `Bearer ${process.env.OLLAMA_API_KEY}`,
            },
          });

          const model = ollamaCloud('gemma4:31b');

          export default {
            web: {
              url: 'https://odjafrik.com',
            },

            ai: {
              model,
              agenticModel: model,
              visionModel: model,

              agents: {
                planner: { model },
                researcher: { model },
                tester: { model },
                navigator: { model },
                pilot: { model },
                historian: { model },
                analyst: { model },
                'experience-compactor': { model },
              },
            },

            playwright: {
              show: false,
              timeout: 30000,
              waitForNavigation: 'domcontentloaded',
              args: [
                '--no-sandbox',
                '--disable-gpu',
                '--disable-dev-shm-usage',
              ],
            },

            reporter: {
              markdown: true,
              html: true,
            },
          };
          EOF

          echo "Explorbot configuration created."

      - name: Run Explorbot
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          echo "========================================"
          echo "Starting Explorbot"
          echo "Provider: Ollama Cloud"
          echo "Model: gemma4:31b"
          echo "Target: https://odjafrik.com"
          echo "Maximum tests: 3"
          echo "Maximum duration: 300"
          echo "========================================"

          npx explorbot explore https://odjafrik.com \
            --max-tests 3 \
            --max-duration 300

      - name: Show results
        if: always()
        run: |
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          if [ -d output ]; then
            find output -type f -printf '%p\n' | sort
          else
            echo "No output directory found."
          fi

          echo ""
          echo "========================================"
          echo "SCREENCASTS"
          echo "========================================"

          if [ -d output/screencasts ]; then
            find output/screencasts -type f -printf '%p\n' | sort
          else
            echo "No screencasts directory found."
          fi

      - name: Upload Explorbot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorbot-ollama-gemma4
          path: |
            output/
            explorbot.config.js
          if-no-files-found: warn
          retention-days: 14
