name: Explorbot - Exploration autonome (pipeline à part)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL du site à explorer"
        required: false
        type: string
        default: "https://odjafrik.com"
      max_tests:
        description: "Nombre de scénarios max pour ce run"
        required: false
        type: string
        default: "3"
      model_id:
        description: "ID modèle OmniRoute (vérifié via Compatibility sur le dashboard)"
        required: false
        type: string
        default: "gemini/gemini-3.1-flash-lite"
  # Pas de schedule pour l'instant : on valide d'abord ce que sortent
  # Researcher/Planner/Tester/Historian/Analyst avant d'automatiser.

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installer Explorbot + client OpenAI-compatible
        run: |
          npm i explorbot @ai-sdk/openai --save
          npx playwright install --with-deps chromium

      - name: Générer la config pour ce run
        run: |
          cat > explorbot.config.js << 'EOF'
          import { createOpenAI } from '@ai-sdk/openai';

          // OmniRoute (déployé sur Railway) plutôt qu'un provider en direct :
          // un seul endpoint, et le modèle réellement gratuit/dispo se choisit
          // sur le dashboard (Test all models + Compatibility) au lieu d'être
          // deviné puis rendu caduc à la première dépréciation.
          const omniroute = createOpenAI({
            apiKey: process.env.OMNIROUTE_API_KEY,
            baseURL: process.env.OMNIROUTE_BASE_URL, // ex: https://xxx.up.railway.app/v1
          });

          const model = omniroute(process.env.OMNIROUTE_MODEL_ID);

          export default {
            web: {
              url: process.env.SITE_URL,
            },

            ai: {
              model,
              visionModel: model,
              agenticModel: model,

              agents: {
                historian: {
                  framework: 'playwright', // .spec.ts, réutilisables plus tard
                  screencast: true,        // vidéo par test, comme l'existant
                },
              },
            },

            playwright: {
              browser: 'chromium',
              show: false,
              timeout: 30000,
              waitForNavigation: 'networkidle',
              waitForTimeout: 2000,
              // Nécessaire pour tourner sans souci sur un runner GitHub Actions
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            },

            reporter: {
              markdown: true,  // output/reports/*.md (résumé de l'agent Analyst)
              html: true,      // + version HTML consultable dans un navigateur
            },

            dirs: {
              output: 'output',
            },
          };
          EOF

      - name: Lancer Explorbot
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_ID: ${{ github.event.inputs.model_id }}
          SITE_URL: ${{ github.event.inputs.site_url }}
        run: |
          set -euo pipefail
          npx explorbot explore / --max-tests "${{ github.event.inputs.max_tests }}"

      - name: Afficher un résumé rapide
        if: always()
        run: |
          echo "--- Rapports générés ---"
          find output/reports -type f 2>/dev/null || echo "(aucun rapport trouvé)"
          echo "--- Tests générés ---"
          find output/tests -type f 2>/dev/null || echo "(aucun test généré)"

      # Tout reste ici, à part : aucun appel au relay (pas de pages-report,
      # pas de mark-crawled). C'est un pipeline d'exploration autonome
      # consultable séparément, pas un remplacement du monitoring existant.
      - name: Uploader les résultats (rapports, tests, screencasts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorbot-output-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
