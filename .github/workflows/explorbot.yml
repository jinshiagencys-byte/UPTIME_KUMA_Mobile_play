name: Explorbot UnoRouter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorbot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Explorbot
        run: |
          npm install explorbot @ai-sdk/openai
          npx playwright install --with-deps chromium

      - name: Show Explorbot CLI help (diagnostic)
        run: |
          echo "===== explorbot --help ====="
          npx explorbot --help || true
          echo ""
          echo "===== explorbot explore --help ====="
          npx explorbot explore --help || true

      - name: Check UnoRouter API key
        env:
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
        run: |
          if [ -z "$UNOROUTER_API_KEY" ]; then
            echo "ERROR: UNOROUTER_API_KEY is missing"
            exit 1
          fi

          echo "UNOROUTER_API_KEY is present"

      - name: Verify UnoRouter connection
        env:
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
        run: |
          echo "Testing UnoRouter..."

          RESPONSE=$(curl -sS \
            https://api.unorouter.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $UNOROUTER_API_KEY" \
            -d '{
              "model": "glm-5.3-flash:free",
              "messages": [
                {
                  "role": "user",
                  "content": "Réponds uniquement par: OK"
                }
              ]
            }')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "ERROR: UnoRouter rejected the request."
            exit 1
          fi

          echo "UnoRouter connection OK."

      - name: Create Explorbot config
        env:
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
        run: |
          cat > explorbot.config.js <<'EOF'
          import { createOpenAI } from '@ai-sdk/openai';

          const unorouter = createOpenAI({
            apiKey: process.env.UNOROUTER_API_KEY,
            baseURL: 'https://api.unorouter.com/v1',
          });

          const model = unorouter('glm-5.3-flash:free');

          export default {
            web: {
              url: 'https://odjafrik.com',
            },

            ai: {
              model,
              agenticModel: model,
              visionModel: model,

              agents: {
                planner: {
                  model,
                },

                researcher: {
                  model,
                },

                tester: {
                  model,
                },

                navigator: {
                  model,
                },

                pilot: {
                  model,
                },

                historian: {
                  model,
                },

                analyst: {
                  model,
                },

                'experience-compactor': {
                  model,
                },
              },
            },

            playwright: {
              show: false,

              timeout: 30000,

              waitForNavigation: 'domcontentloaded',

              args: [
                '--no-sandbox',
                '--disable-gpu',
                '--disable-dev-shm-usage',
              ],
            },

            reporter: {
              markdown: true,
              html: true,
            },
          };
          EOF

          echo "Explorbot configuration created."

      - name: Run Explorbot
        env:
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
        run: |
          echo "========================================"
          echo "Starting Explorbot"
          echo "Provider: UnoRouter"
          echo "Model: glm-5.3-flash:free"
          echo "Target: https://odjafrik.com"
          echo "Maximum tests: 3"
          echo "Maximum duration: 900 (check help output above for unit)"
          echo "========================================"

          npx explorbot explore https://odjafrik.com \
            --max-tests 3 \
            --max-duration 900

      - name: Show results
        if: always()
        run: |
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          if [ -d output ]; then
            find output -type f -printf '%p\n' | sort
          else
            echo "No output directory found."
          fi

          echo ""
          echo "========================================"
          echo "SCREENCASTS"
          echo "========================================"

          if [ -d output/screencasts ]; then
            find output/screencasts -type f -printf '%p\n' | sort
          else
            echo "No screencasts directory found."
          fi

      - name: Upload Explorbot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorbot-unorouter-glm53
          path: |
            output/
            explorbot.config.js
          if-no-files-found: warn
          retention-days: 14
