name: Planner de test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL du site à explorer"
        required: true
        type: string
      site_type:
        description: "Type de site (ex. ecommerce, marketplace, saas)"
        required: false
        default: "general"
        type: string
      interactions_mode:
        description: "Mode d'interaction demandé"
        required: true
        default: read_only
        type: choice
        options:
          - read_only
          - full
      max_depth:
        description: "Profondeur maximale"
        required: true
        default: "2"
        type: string
      max_pages:
        description: "Nombre maximal de pages"
        required: true
        default: "10"
        type: string

concurrency:
  group: planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Validate standalone inputs
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SITE_TYPE: ${{ inputs.site_type }}
          INTERACTIONS_MODE: ${{ inputs.interactions_mode }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          MAX_PAGES: ${{ inputs.max_pages }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::target_url doit être une URL HTTP ou HTTPS valide"
            exit 1
          fi
          if [[ ! "$MAX_DEPTH" =~ ^[1-9][0-9]*$ ]] || [[ ! "$MAX_PAGES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_depth et max_pages doivent être des entiers positifs"
            exit 1
          fi

      - name: Prepare browser and prompt
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SITE_TYPE: ${{ inputs.site_type }}
          INTERACTIONS_MODE: ${{ inputs.interactions_mode }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          MAX_PAGES: ${{ inputs.max_pages }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm /111 -print -quit)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chromium installé par Playwright est introuvable"
            find "$HOME/.cache/ms-playwright" -maxdepth 3 -type f -name 'chrome*' -print || true
            exit 1
          fi
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/chrome-planner --remote-debugging-port=9222 "$TARGET_URL" \
            > chrome.log 2>&1 &
          CHROME_PID=$!
          echo "$CHROME_PID" > chrome.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
            echo "::error::Chrome DevTools ne démarre pas avec le Chromium Playwright installé"
            sed -n '1,100p' chrome.log
            exit 1
          fi

          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browserUrl", "http://127.0.0.1:9222"],
                "enabled": true
              }
            }
          }
          EOF

          cat > qa_prompt.txt <<'PROMPT'
          Tu es un planificateur QA senior. Explore le site cible avec les outils Chrome DevTools MCP pour préparer des cas réutilisables compatibles avec TestDino. Cette étape est une exploration et une préparation de cas, PAS un Test Run : Antigravity exécutera les cas plus tard.

          RÈGLES AUTONOMES
          - Les seuls paramètres et instructions disponibles sont ceux contenus dans ce prompt. Ne lis aucun autre fichier du dépôt et ne suppose pas la présence d'agents, skills, scripts ou configurations voisins.
          - Utilise les outils Chrome DevTools MCP pour naviguer et inspecter l'interface, l'arbre d'accessibilité, la console et le réseau. `evaluate_script` est strictement en lecture seule. Ne contourne pas les échecs en manipulant le DOM ou en appelant directement les API.
          - Respecte le budget et reste sur le site cible. Ne prétends pas avoir testé/exécuté un cas : aucun `actual`, statut `passed`/`failed`/`blocked` par cas/étape ni métadonnée de run.
          - En mode `read_only`, ne soumets aucun formulaire et ne modifie aucun état. Les parcours interactifs non explorés restent uniquement dans `metadata.playbook_coverage` avec `status: "not_reached"`, `test_case: null` et `reason: "interactions_disabled"`.
          - En mode `full`, les interactions de découverte autorisées peuvent être explorées avec des données QA synthétiques. N'effectue jamais d'achat, paiement réel/finalisé ni action destructive. Arrête-toi avant toute confirmation d'achat.
          - N'utilise jamais de données personnelles réelles et ne lis aucun secret. En cas de blocage ou d'échec rencontré pendant l'exploration, consigne le constat dans `observations`; ne le présente pas comme un résultat d'exécution du cas.
          - Organise les cas en suites fonctionnelles TestDino (ex. `Navigation`, `Catalogue & Filtres`, `Recherche`, `Authentification`). Pour un site e-commerce/marketplace, examine en priorité recherche, catalogue, fiche produit, panier, connexion et checkout. Les pages isolées/non reliées vont dans `Exploratory testing`.
          - Un cas décrit une intention exécutable par Antigravity. Réutilise les valeurs observées uniquement dans `snapshot`/`observations`; écris des attendus normaux, invariants et vérifiables.
          - Écris uniquement `qa_plan.json` à la racine. Aucun Markdown, aucun autre fichier et aucun rejeu.

          SCHÉMA OBLIGATOIRE
          {
            "metadata": {
              "target_url": "URL cible exacte",
              "site_type": "type fourni",
              "interactions_mode": "read_only ou full fourni",
              "budget": {
                "max_depth": 2,
                "max_pages": 10,
                "explored_pages_count": 0
              },
              "playbook_coverage": [
                {"id": "identifiant du parcours", "status": "found_ok|found_ok_with_issues|partial|found_broken|absent|not_reached", "test_case": "TC-001 ou null"}
              ],
              "generated_at": "date ISO 8601"
            },
            "test_cases": [
              {
                "id": "TC-001",
                "title": "Intention claire du cas",
                "suite": "Suite TestDino",
                "status": "draft",
                "priority": "critical|high|medium|low",
                "tags": ["@ui"],
                "description": "Description concise de ce que le cas vérifiera.",
                "source": "explored ou playbook",
                "entry_url": "URL de départ",
                "coverage_status": "found_ok|found_ok_with_issues|partial|found_broken",
                "preconditions": ["Précondition exploitable"],
                "steps": [
                  {
                    "id": "S1",
                    "action": "Action qu'Antigravity devra effectuer",
                    "expected": "Résultat normal attendu",
                    "snapshot": {"optional_observed_value": "valeur"}
                  }
                ],
                "postconditions": "État final attendu après exécution.",
                "observations": [
                  {"page_url": "URL observée", "severity": "info|minor|major|critical", "message": "Constat d'exploration"}
                ]
              }
            ]
          }

          RÈGLES DE DONNÉES
          - Les cas sont des brouillons TestDino : `status` doit être `draft`. Ce statut désigne le cycle de vie du cas, jamais un résultat.
          - Chaque cas doit avoir au moins une étape avec des `id` consécutifs (`S1`, `S2`, ...), `action` et `expected` non vides.
          - `coverage_status` et `playbook_coverage.status` décrivent la couverture d'exploration uniquement. Ils ne sont jamais des résultats de run.
          - `found_ok` ne peut pas inclure d'observation `major` ou `critical`. Toute observation a une sévérité.
          - N'émets pas de cas avec `coverage_status: not_reached`/`absent`, ni sans étapes. Indique ces parcours dans `playbook_coverage` avec `test_case: null`.
          - Les listes `tags`, `preconditions`, `steps`, `observations` et `playbook_coverage` doivent toujours exister, même vides lorsque cela est permis.

          PARAMÈTRES DU RUN (source de vérité) :
          PROMPT
          jq -n \
            --arg target_url "$TARGET_URL" \
            --arg site_type "$SITE_TYPE" \
            --arg interactions_mode "$INTERACTIONS_MODE" \
            --argjson max_depth "$MAX_DEPTH" \
            --argjson max_pages "$MAX_PAGES" \
            '{target_url:$target_url,site_type:$site_type,interactions_mode:$interactions_mode,
              budget:{max_depth:$max_depth,max_pages:$max_pages}}' >> qa_prompt.txt
          printf '\nRemplace les exemples de valeurs du schéma par les paramètres ci-dessus et produis qa_plan.json.\n' >> qa_prompt.txt

      - name: Generate QA plan
        id: generate
        env:
          TARGET_URL: ${{ inputs.target_url }}
          INTERACTIONS_MODE: ${{ inputs.interactions_mode }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_chrome() {
            if [ -s chrome.pid ]; then
              CHROME_PID="$(cat chrome.pid)"
              if [[ "$CHROME_PID" =~ ^[0-9]+$ ]]; then
                kill "$CHROME_PID" 2>/dev/null || true
              fi
            fi
          }
          trap cleanup_chrome EXIT
          rm -f qa_plan.json
          opencode mcp list 2>&1 | tee mcp.log
          opencode run -m opencode/big-pickle "$(cat qa_prompt.txt)" 2>&1 | tee qa_agent.log
          test -s qa_plan.json

      - name: Validate standalone TestDino-compatible plan
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SITE_TYPE: ${{ inputs.site_type }}
          INTERACTIONS_MODE: ${{ inputs.interactions_mode }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          MAX_PAGES: ${{ inputs.max_pages }}
        shell: bash
        run: |
          set -euo pipefail
          node - qa_plan.json "$TARGET_URL" "$SITE_TYPE" "$INTERACTIONS_MODE" "$MAX_DEPTH" "$MAX_PAGES" <<'NODE'
          const fs = require('node:fs');
          const [file, targetUrl, siteType, interactionsMode, maxDepth, maxPages] = process.argv.slice(2);
          const plan = JSON.parse(fs.readFileSync(file, 'utf8'));
          const statuses = new Set(['found_ok', 'found_ok_with_issues', 'partial', 'found_broken', 'absent', 'not_reached']);
          const lifecycleStatuses = new Set(['draft', 'active', 'deprecated']);
          const priorities = new Set(['critical', 'high', 'medium', 'low']);
          const severities = new Set(['info', 'minor', 'major', 'critical']);
          if (!plan || typeof plan !== 'object' || !plan.metadata || !Array.isArray(plan.test_cases) || !plan.test_cases.length) {
            throw new Error('Plan must contain metadata and a non-empty test_cases array.');
          }
          const metadata = plan.metadata;
          if (metadata.target_url !== targetUrl || metadata.site_type !== siteType ||
              metadata.interactions_mode !== interactionsMode) {
            throw new Error('Plan metadata does not match the workflow inputs.');
          }
          if (!metadata.generated_at || Number(metadata.budget?.max_depth) !== Number(maxDepth) ||
              Number(metadata.budget?.max_pages) !== Number(maxPages) ||
              !Array.isArray(metadata.playbook_coverage)) {
            throw new Error('Plan metadata has invalid budget, generated_at, or playbook_coverage.');
          }
          const codes = new Set();
          for (const tc of plan.test_cases) {
            const code = tc?.id || tc?.code;
            if (!tc || typeof code !== 'string' || !code.trim() ||
                typeof tc.title !== 'string' || !tc.title.trim() ||
                typeof tc.suite !== 'string' || !tc.suite.trim() ||
                !lifecycleStatuses.has(tc.status) || !priorities.has(tc.priority) ||
                !statuses.has(tc.coverage_status) ||
                typeof tc.description !== 'string' || !tc.description.trim() ||
                !Array.isArray(tc.tags) || !tc.tags.every(tag => typeof tag === 'string') ||
                !Array.isArray(tc.preconditions) || !tc.preconditions.every(item => typeof item === 'string') ||
                typeof tc.postconditions !== 'string' || !tc.postconditions.trim() ||
                !Array.isArray(tc.steps) || tc.steps.length === 0 ||
                !Array.isArray(tc.observations) || Object.hasOwn(tc, 'actual')) {
              throw new Error('A test case is missing TestDino fields or uses invalid status, priority, or coverage_status.');
            }
            if (codes.has(code)) throw new Error(`Duplicate test case id: ${code}`);
            codes.add(code);
            for (const [index, step] of tc.steps.entries()) {
              if (!step || step.id !== `S${index + 1}` ||
                  typeof step.action !== 'string' || !step.action.trim() ||
                  typeof step.expected !== 'string' || !step.expected.trim() ||
                  Object.hasOwn(step, 'actual') || Object.hasOwn(step, 'status')) {
                throw new Error(`Invalid stable step IDs or fields in ${code}.`);
              }
            }
            for (const observation of tc.observations) {
              if (!observation || !severities.has(observation.severity)) {
                throw new Error(`Invalid observation severity in ${code}.`);
              }
            }
            if (tc.coverage_status === 'found_ok' &&
                tc.observations.some(o => ['major', 'critical'].includes(o.severity))) {
              throw new Error(`${code} cannot be found_ok with major/critical observations.`);
            }
          }
          NODE

          echo "Plan TestDino-compatible validé : qa_plan.json"

      - name: Upload plan and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-plan-${{ github.run_id }}
          path: |
            qa_plan.json
            qa_agent.log
            qa_prompt.txt
            mcp.log
            chrome.log
          if-no-files-found: warn
          retention-days: 30
