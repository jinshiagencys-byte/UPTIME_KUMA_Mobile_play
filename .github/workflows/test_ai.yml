name: Test OpenCode AI Models

on:
  workflow_dispatch:

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
    - name: Call OpenCode Big Pickle
      env:
        OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      run: |
        echo "Interrogation du modèle Big Pickle..."
        
        response=$(curl -s -X POST "https://opencode.ai" \
          -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "big-pickle",
            "messages": [
              {
                "role": "user",
                "content": "Hello! Qui es-tu ?"
              }
            ]
          }')
          
        echo "Réponse du modèle Big Pickle :"
        echo "$response"

    - name: Call OpenCode Space Bunny
      env:
        OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      run: |
        echo "Interrogation du modèle Space Bunny Free..."
        
        response=$(curl -s -X POST "https://opencode.ai" \
          -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "space-bunny-free",
            "messages": [
              {
                "role": "user",
                "content": "Hello Space Bunny!"
              }
            ]
          }')
          
        echo "Réponse du modèle Space Bunny :"
        echo "$response"
