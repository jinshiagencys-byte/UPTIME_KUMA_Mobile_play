name: Test OpenCode AI Models

on:
  workflow_dispatch:

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
    - name: Call OpenCode Big Pickle
      env:
        OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      run: |
        echo "Interrogation du modèle Big Pickle..."
        
        response=$(curl -s -X POST "https://opencode.ai" \
          -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "big-pickle",
            "messages": [
              {
                "role": "user",
                "content": "Hello! Qui es-tu ?"
              }
            ]
          }')
          
        if [ -z "$response" ]; then
          echo "Erreur : L'API n'a renvoyé aucune réponse."
          exit 1
        fi
        
        echo "Réponse brute de l'API :"
        echo "$response"
        
        echo "Texte extrait :"
        echo "$response" | jq -r '.choices[0].message.content'

    - name: Call OpenCode Space Bunny
      env:
        OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      run: |
        echo "Interrogation du modèle Space Bunny Free..."
        
        response=$(curl -s -X POST "https://opencode.ai" \
          -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "space-bunny-free",
            "messages": [
              {
                "role": "user",
                "content": "Hello Space Bunny!"
              }
            ]
          }')
          
        if [ -z "$response" ]; then
          echo "Erreur : L'API n'a renvoyé aucune réponse."
          exit 1
        fi
        
        echo "Réponse brute de l'API :"
        echo "$response"
        
        echo "Texte extrait :"
        echo "$response" | jq -r '.choices[0].message.content'
