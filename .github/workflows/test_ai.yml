name: Check All Ollama Models Tool Support

on:
  workflow_dispatch:

jobs:
  audit-tools:
    runs-on: ubuntu-latest
    steps:
    - name: Scan models for tool support
      env:
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      run: |
        echo "Étape 1 : Récupération de la liste des modèles..."
        response=$(curl -s -X GET "https://ollama.com/v1/models" \
          -H "Authorization: Bearer ${OLLAMA_API_KEY}")
        
        # Extraction des IDs avec jq
        model_ids=$(echo "$response" | jq -r '.data[].id')
        
        echo -e "\n----------------------------------------"
        echo "Étape 2 : Analyse des capacités (tools) pour chaque modèle..."
        
        for model in $model_ids; do
          echo "Vérification de : $model"
          
          show_response=$(curl -s -X POST "https://ollama.com/api/show" \
            -H "Authorization: Bearer ${OLLAMA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"$model\"}")
            
          # Vérifie si le champ 'capabilities' contient 'tools'
          has_tools=$(echo "$show_response" | jq '.capabilities // [] | index("tools")')
          
          if [ "$has_tools" != "null" ]; then
            echo "✅ [SUPPORTÉ] Le modèle $model supporte les tools !"
          else
            echo "❌ [NON SUPPORTÉ ou Inconnu] $model"
          fi
          echo "----------------------------------------"
        done
