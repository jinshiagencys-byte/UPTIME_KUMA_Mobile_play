name: Test Ollama Cloud Models

on:
  workflow_dispatch:

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
    - name: Get Ollama Cloud Models
      env:
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      run: |
        echo "Récupération des modèles disponibles sur Ollama Cloud..."
        
        response=$(curl -s -X GET "https://ollama.com/api/tags" \
          -H "Authorization: Bearer ${OLLAMA_API_KEY}" \
          -H "Content-Type: application/json")
          
        echo "Réponse de l'API :"
        echo "$response"
