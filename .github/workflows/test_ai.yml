name: Test Cloudflare and OpenCode AI Models

on:
  workflow_dispatch:

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
    - name: Call Cloudflare Workers AI
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      run: |
        echo "Interrogation de l'IA Cloudflare..."
        
        response=$(curl -s -X POST "https://cloudflare.com{CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.1-8b-instruct" \
          -H "Authorization: Bearer ${CLOUDFLARE_AUTH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"prompt": "Hi"}')
          
        echo "Réponse de l'API Cloudflare :"
        echo "$response"

    - name: Call OpenCode Big Pickle
      env:
        OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      run: |
        echo "Interrogation du modèle Big Pickle..."
        
        response=$(curl -s -X POST "https://opencode.ai/zen/v1/chat/completions" \
          -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "big-pickle",
            "messages": [
              {
                "role": "user",
                "content": "Hello! Qui es-tu ?"
              }
            ]
          }')
          
        echo "Réponse du modèle Big Pickle :"
        echo "$response"

    - name: Call OpenCode Space Bunny
      env:
        OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      run: |
        echo "Interrogation du modèle Space Bunny Free..."
        
        response=$(curl -s -X POST "https://opencode.ai/zen/v1/chat/completions" \
          -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "space-bunny-free",
            "messages": [
              {
                "role": "user",
                "content": "Hello Space Bunny!"
              }
            ]
          }')
          
        echo "Réponse du modèle Space Bunny :"
        echo "$response"
