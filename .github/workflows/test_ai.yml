name: Test OpenCode AI Models

on:
  workflow_dispatch:

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
    - name: Installer OpenCode
      run: |
        npm install -g opencode-ai
        opencode --version

    - name: Lister les modèles disponibles
      run: opencode models

    - name: Call Big Pickle
      run: |
        echo "Interrogation du modèle Big Pickle..."
        opencode run -m opencode/big-pickle "Hello! Qui es-tu ?"

    - name: Call Space Bunny
      run: |
        echo "Interrogation du modèle Space Bunny Free..."
        opencode run -m opencode/space-bunny-free "Hello Space Bunny!"
