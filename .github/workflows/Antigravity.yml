name: Antigravity Chrome DevTools - QA Agent Inspection

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle IA à utiliser"
        required: false
        default: "opencode:big-pickle"
        type: choice
        options:
          - opencode:big-pickle
          - opencode:nemotron-3-ultra-free
          - gemini-2.5-flash
          - cloudflare
      url:
        description: "URL cible à tester (optionnel, sinon récupère du relay)"
        required: false
        type: string
      site_id:
        description: "Site ID du relay (optionnel)"
        required: false
        type: string
  schedule:
    # Inspection automatique tous les jours à 6h du matin
    - cron: "0 6 * * *"

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "22"
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}

jobs:
  # ============================================================
  # 1. RÉSOUDRE L'URL CIBLE
  # ============================================================
  resolve-url:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.resolve.outputs.url }}
      site_id: ${{ steps.resolve.outputs.site_id }}
      site_name: ${{ steps.resolve.outputs.site_name }}
    steps:
      - name: Résoudre l'URL depuis les inputs ou le relay
        id: resolve
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_SITE_ID: ${{ github.event.inputs.site_id }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          
          # Priorité 1 : URL directe en input
          if [ -n "${INPUT_URL:-}" ]; then
            echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "site_id=manual-$RANDOM" >> "$GITHUB_OUTPUT"
            echo "site_name=${INPUT_URL##*/}" >> "$GITHUB_OUTPUT"
            echo "✓ URL cible (input) : $INPUT_URL"
            exit 0
          fi
          
          # Priorité 2 : Site ID via relay
          if [ -n "${INPUT_SITE_ID:-}" ]; then
            if [ -z "${RELAY_URL:-}" ]; then
              echo "::error::RELAY_URL manquant pour résoudre site_id"
              exit 1
            fi
            SITE=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" \
              "$RELAY_URL/sites/$INPUT_SITE_ID")
            URL=$(echo "$SITE" | jq -r '.site_url // .url // empty')
            NAME=$(echo "$SITE" | jq -r '.site_name // .name // "unknown"')
            if [ -z "$URL" ]; then
              echo "::error::site_id=$INPUT_SITE_ID introuvable ou sans URL"
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "site_id=$INPUT_SITE_ID" >> "$GITHUB_OUTPUT"
            echo "site_name=$NAME" >> "$GITHUB_OUTPUT"
            echo "✓ URL résolue depuis relay : $URL (site=$NAME)"
            exit 0
          fi
          
          # Priorité 3 : Premier site actif du relay
          if [ -n "${RELAY_URL:-}" ]; then
            SITES=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" \
              "$RELAY_URL/active-sites" | jq -c '.sites[]? | select(.site_url != null)' | head -1)
            if [ -z "$SITES" ]; then
              echo "::error::Aucun site actif trouvé dans le relay"
              exit 1
            fi
            URL=$(echo "$SITES" | jq -r '.site_url // .url')
            SID=$(echo "$SITES" | jq -r '.id // "unknown"')
            NAME=$(echo "$SITES" | jq -r '.site_name // .name // "unknown"')
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "site_id=$SID" >> "$GITHUB_OUTPUT"
            echo "site_name=$NAME" >> "$GITHUB_OUTPUT"
            echo "✓ URL du premier site actif : $URL"
            exit 0
          fi
          
          echo "::error::Aucune URL trouvée (input, site_id, ou relay requis)"
          exit 1

  # ============================================================
  # 2. EXÉCUTER L'AGENT OPENCODE BIG-PICKLE SUR CHROME DEVTOOLS
  # ============================================================
  antigravity-qa-run:
    needs: resolve-url
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer Playwright & Navigateurs avec dépendances
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Installer OpenCode CLI
        run: |
          npm install -g opencode-ai || true

      - name: Dossiers de preuves (trajectories, videos, screenshots)
        run: |
          mkdir -p trajectories videos screenshots

      - name: Enregistrer une navigation QA en vidéo
        id: qa_video
        continue-on-error: true
        env:
          TARGET_URL: ${{ needs.resolve-url.outputs.url }}
          VIDEO_DIR: videos
        run: node scripts/record-qa-video.js

      - name: Exécuter OpenCode Big-Pickle avec le Prompt /browser
        id: qa_agent
        env:
          TARGET_URL: ${{ needs.resolve-url.outputs.url }}
          SITE_ID: ${{ needs.resolve-url.outputs.site_id }}
          SITE_NAME: ${{ needs.resolve-url.outputs.site_name }}
          AI_MODEL: ${{ github.event.inputs.model || 'opencode:big-pickle' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          echo "🎯 Cible : $TARGET_URL"
          echo "🧠 Modèle IA : $AI_MODEL"

          # 1. Démarrer Chrome Headless en arrière-plan avec le port DevTools 9222
          google-chrome-stable --headless --disable-gpu --remote-debugging-port=9222 "$TARGET_URL" &
          CHROME_PID=$!
          cleanup_chrome() {
            kill "$CHROME_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
          }
          trap cleanup_chrome EXIT
          sleep 4
          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 2. Construire le prompt QA dynamique avec l'URL cible
          QA_PROMPT="/browser Tu es un ingénieur QA senior avec des notions de cybersécurité.

          Sur le site $TARGET_URL, réalise une inspection en deux volets :

          **1. QA fonctionnelle (principal)**
          - Explorer la navigation, les catégories et les fiches produits
          - Tester les formulaires (contact, newsletter, compte, devis)
          - Vérifier le panier et le flux de commande (checkout)
          - Tester le responsive et l'accessibilité de base

          **2. Surface de sécurité (secondaire — vue d'ensemble uniquement, ne pas aller en profondeur)**
          - Vérifier si des endpoints API sensibles sont accessibles sans authentification (HTTP 200 inattendu)
          - Contrôler les en-têtes de sécurité HTTP (HSTS, X-Frame-Options, Content-Security-Policy)
          - Vérifier que les routes protégées (orders, profil, dashboard vendeur) renvoient bien 401/403 sans session
          - Vérifier l'absence d'informations sensibles dans le HTML source (tokens, clés, stack traces)
          - Ne pas effectuer de fuzzing, d'injection ni d'attaque active

          Une fois l'exploration terminée, rédige immédiatement un rapport structuré avec les sections suivantes :
          - Bugs UX / fonctionnels
          - Anomalies de sécurité
          - Recommandations prioritaires"

          echo "🤖 Prompt QA transmis à OpenCode Big-Pickle :"
          echo "$QA_PROMPT"

          # 3. Lancer la CLI OpenCode avec le modèle Big-Pickle
          opencode run -m "opencode/big-pickle" "$QA_PROMPT" 2>&1 | tee qa_agent.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          cleanup_chrome
          trap - EXIT
          FINISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          STATUS="FAILED"
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="COMPLETED"
          fi

          # Conserver le résultat réel du modèle dans un JSON correctement échappé.
          tail -c 200000 qa_agent.log > trajectories/agent_output.txt
          jq -n \
            --arg prompt "$QA_PROMPT" \
            --arg url "$TARGET_URL" \
            --arg site_id "$SITE_ID" \
            --arg status "$STATUS" \
            --arg started_at "$STARTED_AT" \
            --arg finished_at "$FINISHED_AT" \
            --argjson exit_code "$EXIT_CODE" \
            --rawfile report_text trajectories/agent_output.txt \
            '{
              prompt_used: $prompt,
              url: $url,
              site_id: $site_id,
              status: $status,
              exit_code: $exit_code,
              started_at: $started_at,
              finished_at: $finished_at,
              report_text: $report_text
            }' > trajectories/report.json

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Archiver les preuves QA (Vidéo WebM, Screenshots, Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-proofs-${{ needs.resolve-url.outputs.site_id }}
          path: |
            trajectories/
            videos/
            screenshots/
            qa_agent.log
          retention-days: 30

      - name: Envoyer le rapport au Relay & Supabase
        if: always()
        continue-on-error: false
        env:
          SITE_ID: ${{ needs.resolve-url.outputs.site_id }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SITE_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "Rapport non envoyé au Relay : cet essai manuel n’est pas associé à un site Supabase."
            exit 0
          fi
          if [ ! -f "trajectories/report.json" ]; then
            echo "::error::Le rapport QA n’a pas été généré."
            exit 1
          fi
          if [ -z "${RELAY_URL:-}" ] || [ -z "${RELAY_SECRET:-}" ]; then
            echo "::error::RELAY_URL ou RELAY_SECRET n’est pas configuré."
            exit 1
          fi

          jq -n \
            --slurpfile report trajectories/report.json \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              status: $report[0].status,
              report: $report[0],
              github_run_id: ($run_id | tonumber),
              github_run_attempt: ($run_attempt | tonumber),
              github_run_url: $run_url
            }' > trajectories/relay-payload.json

          curl --fail-with-body --show-error --silent --max-time 30 \
            -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @trajectories/relay-payload.json

      - name: Résumé dans GitHub Actions
        if: always()
        shell: bash
        run: |
          STATUS="INCOMPLET"
          if [ -f "trajectories/report.json" ]; then
            STATUS="$(jq -r '.status' trajectories/report.json)"
          fi
          {
            echo "## 🎭 OpenCode Big-Pickle Senior QA Agent Report"
            echo ""
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| **URL Cible** | \`${{ needs.resolve-url.outputs.url }}\` |"
            echo "| **Modèle IA** | \`opencode:big-pickle\` |"
            echo "| **Prompt** | \`/browser Tu es un ingénieur QA senior avec des notions de cybersécurité...\` |"
            echo "| **Résultat** | \`$STATUS\` |"
            if [ -f "videos/qa-navigation.webm" ]; then
              echo "| **Vidéo** | Enregistrée dans l’artifact QA (WebM) |"
            else
              echo "| **Vidéo** | Non disponible — consulter les logs de l’étape vidéo |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
