name: Antigravity Chrome DevTools - QA Agent Inspection

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle IA à utiliser"
        required: false
        default: "opencode:big-pickle"
        type: choice
        options:
          - opencode:big-pickle
          - opencode:nemotron-3-ultra-free
          - opencode:fledge-alpha-free
          - gemini-2.5-flash
          - cloudflare
      url:
        description: "URL cible à tester (optionnel, sinon récupère du relay)"
        required: false
        type: string
      site_id:
        description: "Site ID du relay (optionnel)"
        required: false
        type: string
  schedule:
    # Inspection automatique tous les jours à 6h du matin
    - cron: "0 6 * * *"

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "22"
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}

jobs:
  # ============================================================
  # 1. RÉSOUDRE L'URL CIBLE
  # ============================================================
  resolve-url:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.resolve.outputs.url }}
      site_id: ${{ steps.resolve.outputs.site_id }}
      site_name: ${{ steps.resolve.outputs.site_name }}
    steps:
      - name: Résoudre l'URL depuis les inputs ou le relay
        id: resolve
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_SITE_ID: ${{ github.event.inputs.site_id }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          # Priorité 1 : URL directe en input
          if [ -n "${INPUT_URL:-}" ]; then
            echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "site_id=manual-$RANDOM" >> "$GITHUB_OUTPUT"
            echo "site_name=${INPUT_URL##*/}" >> "$GITHUB_OUTPUT"
            echo "✓ URL cible (input) : $INPUT_URL"
            exit 0
          fi

          # Priorité 2 : Site ID via relay
          if [ -n "${INPUT_SITE_ID:-}" ]; then
            if [ -z "${RELAY_URL:-}" ]; then
              echo "::error::RELAY_URL manquant pour résoudre site_id"
              exit 1
            fi
            SITE=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" \
              "$RELAY_URL/sites/$INPUT_SITE_ID")
            URL=$(echo "$SITE" | jq -r '.site_url // .url // empty')
            NAME=$(echo "$SITE" | jq -r '.site_name // .name // "unknown"')
            if [ -z "$URL" ]; then
              echo "::error::site_id=$INPUT_SITE_ID introuvable ou sans URL"
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "site_id=$INPUT_SITE_ID" >> "$GITHUB_OUTPUT"
            echo "site_name=$NAME" >> "$GITHUB_OUTPUT"
            echo "✓ URL résolue depuis relay : $URL (site=$NAME)"
            exit 0
          fi

          # Priorité 3 : Premier site actif du relay
          if [ -n "${RELAY_URL:-}" ]; then
            SITES=$(curl -fsS --retry 3 -H "x-relay-secret: $RELAY_SECRET" \
              "$RELAY_URL/active-sites" | jq -c '.sites[]? | select(.site_url != null)' | head -1)
            if [ -z "$SITES" ]; then
              echo "::error::Aucun site actif trouvé dans le relay"
              exit 1
            fi
            URL=$(echo "$SITES" | jq -r '.site_url // .url')
            SID=$(echo "$SITES" | jq -r '.id // "unknown"')
            NAME=$(echo "$SITES" | jq -r '.site_name // .name // "unknown"')
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "site_id=$SID" >> "$GITHUB_OUTPUT"
            echo "site_name=$NAME" >> "$GITHUB_OUTPUT"
            echo "✓ URL du premier site actif : $URL"
            exit 0
          fi

          echo "::error::Aucune URL trouvée (input, site_id, ou relay requis)"
          exit 1

  # ============================================================
  # 2. EXÉCUTER L'AGENT QA SUR CHROME DEVTOOLS (PLAN DE TEST + SORTIE JSON)
  # ============================================================
  antigravity-qa-run:
    needs: resolve-url
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer Playwright & Navigateurs avec dépendances
        run: |
          npx playwright install --with-deps chromium

      - name: Installer OpenCode CLI
        run: |
          npm install -g opencode-ai

      - name: Dossiers de preuves (trajectories, videos, screenshots)
        run: |
          mkdir -p trajectories videos screenshots

      # ----------------------------------------------------------
      # Un seul agent explore, planifie, exécute et audite avant d'écrire qa_result.json.
      # Changements : (1) opencode.json branche le MCP chrome-devtools sur Chrome :9222,
      # (2) attente active de Chrome, (3) prompt : outils navigateur obligatoires + écriture progressive.
      # ----------------------------------------------------------
      - name: Exécuter l'agent QA (plan de test + sortie structurée)
        id: qa_agent
        env:
          TARGET_URL: ${{ needs.resolve-url.outputs.url }}
          SITE_ID: ${{ needs.resolve-url.outputs.site_id }}
          SITE_NAME: ${{ needs.resolve-url.outputs.site_name }}
          AI_MODEL: ${{ github.event.inputs.model || 'opencode:big-pickle' }}
        shell: bash
        run: |
          set +e
          rm -f qa_result.json qa_agent.log
          echo "🎯 Cible : $TARGET_URL"
          echo "🧠 Modèle IA : $AI_MODEL"

          # 1. Chrome headless avec le port DevTools 9222
          google-chrome-stable --headless --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/chrome-qa --remote-debugging-port=9222 "$TARGET_URL" &
          CHROME_PID=$!

          # Attente active : Chrome doit répondre sur 9222 avant de lancer l'agent
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          if curl -fs http://127.0.0.1:9222/json/version >/dev/null; then
            echo "✓ Chrome DevTools prêt sur :9222"
          else
            echo "::warning::Chrome ne répond pas sur 9222 après 30 s"
          fi

          # 2. Brancher opencode sur ce Chrome via le MCP chrome-devtools
          cat > opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browserUrl", "http://127.0.0.1:9222"],
                "enabled": true
              }
            }
          }
          EOF
          echo "🔌 MCP configurés :"
          opencode mcp list 2>&1 | head -20 || true

          # 3. Correspondance du modèle choisi vers l'identifiant opencode
          case "$AI_MODEL" in
            opencode:*) OC_MODEL="opencode/${AI_MODEL#opencode:}" ;;
            gemini-*)   OC_MODEL="google/${AI_MODEL}" ;;
            *)
              echo "::warning::Modèle '$AI_MODEL' non pris en charge par opencode, repli sur opencode/big-pickle"
              OC_MODEL="opencode/big-pickle"
              ;;
          esac
          export GOOGLE_GENERATIVE_AI_API_KEY="${GOOGLE_API_KEY:-}"
          echo "oc_model=$OC_MODEL" >> "$GITHUB_OUTPUT"
          echo "🔧 Modèle opencode : $OC_MODEL"

          # 4. Prompt : plan de test + règles + schéma de sortie
          cat > qa_prompt.txt << 'PROMPT_EOF'
          Tu es un ingénieur QA senior. Tu explores le site, construis un plan adapté, exécutes les vérifications et produis un rapport vérifiable. Tu es le seul agent du run : organise ton travail en phases et ne prétends pas qu'un autre agent a confirmé tes constats.
          SITE : __TARGET_URL__

          OUTILS (OBLIGATOIRE)
          - Pour tester, utilise les outils du MCP chrome-devtools : naviguer, cliquer, saisir, lire la Console et le Network, prendre des captures, changer la taille du viewport.
          - Interdit : grep, curl, lecture de main.js ou des HTML prérendus COMME PREUVE D'UN TEST. Ces commandes ne servent qu'en complément (par exemple lire les en-têtes HTTP pour TC-007).
          - Si les outils chrome-devtools ne répondent pas ou n'existent pas, ne bascule pas sur grep/curl : marque les étapes concernées blocked avec actual = "outils navigateur indisponibles" et termine en écrivant le rapport.
          - Ne lis jamais .env ni aucun fichier de secrets. N'écris aucun secret ou jeton dans le rapport.

          MÉTHODE
          1. EXPLORATION : inspecte la page d'entrée, sa navigation, les fonctionnalités réellement visibles et les routes atteignables. Note les zones inaccessibles et les limites de l'environnement. N'infère pas qu'une fonctionnalité existe uniquement depuis son nom.
          2. PLAN : adapte les cas prédéfinis à ce site, écarte ceux qui ne s'appliquent pas et ajoute les scénarios importants découverts. Avant d'exécuter, regroupe les scénarios qui testent le même comportement afin d'éviter les répétitions. Ne supprime pas des observations différentes sous prétexte qu'elles peuvent avoir une cause commune. Une fois le plan arrêté, il est figé : ne modifie plus les étapes, ni leurs attendus, pour les faire coller à ce que tu observes.
          3. EXÉCUTION : exécute les étapes dans l'ordre, observe le résultat après chaque action et consigne immédiatement les preuves.
          4. AUTO-AUDIT : relis tous les cas. Vérifie que chaque statut correspond aux observations, que chaque échec a une preuve directe, que les blocages ne sont pas présentés comme des défauts confirmés et que les effets de bord éventuels sont listés.
          5. RAPPORT : écris le JSON demandé. Le rapport décrit ce qui a été vérifié pendant ce run et ne prétend jamais à une couverture exhaustive.

          ÉCRITURE PROGRESSIVE (OBLIGATOIRE)
          - Dès que le plan est arrêté, écris qa_result.json avec TOUS les cas et TOUTES les étapes. Les étapes pas encore exécutées ont status "blocked" et actual "non exécuté".
          - Après CHAQUE cas terminé, réécris qa_result.json en entier avec les résultats à jour. Ne garde pas tes résultats pour la fin : si tu es interrompu, le fichier doit déjà être valide.
          - Le fichier doit toujours être du JSON valide, avec tous les champs du schéma remplis (chaînes vides autorisées dans evidence, http_status à null si inconnu).
          - Si le temps ou les étapes manquent, arrête de tester, laisse les cas restants "blocked" avec actual "temps épuisé" et termine.

          RÈGLES D'EXÉCUTION
          - Exécute chaque étape exactement comme écrite. N'adapte pas les valeurs (dates, textes, montants), ne contourne pas un blocage, ne choisis pas une autre option "qui marche" : si l'étape est impossible telle quelle, marque blocked et explique pourquoi.
          - Une action exécutée sans effet (clic sans réaction, recherche sans résultat) doit être rapportée dans actual ("action exécutée, rien ne s'est passé") et l'étape est failed si l'attendu n'est pas atteint.
          - Pour chaque étape, note ce que tu as réellement observé (actual) et un statut :
              passed  = observé conforme à l'attendu
              failed  = observé différent de l'attendu
              blocked = vérification impossible ou résultat inconclusif (étape dépendante d'un échec, page inaccessible, HTTP 429, instabilité externe)
              skipped = la fonctionnalité n'existe pas sur ce site (ce n'est PAS un échec)
          - Un HTTP 429 n'est JAMAIS un bug du site : marque l'étape blocked et patiente. Une requête de lecture peut être retentée une seule fois ; pour une écriture, vérifie d'abord si l'action a été appliquée et ne la renvoie pas automatiquement.
          - Les actions fonctionnelles avec effets de bord sont autorisées et doivent être exécutées lorsqu'elles sont nécessaires au plan : soumettre un formulaire de contact, tester une inscription newsletter, ajouter un article au panier et créer un compte de test.
          - Utilise uniquement des données synthétiques identifiables comme données QA, jamais des informations personnelles ou des identifiants réels. Limite chaque écriture à une tentative par scénario. Consigne dans side_effects ce qui a été effectivement créé ou modifié, avec les références utiles pour le retrouver.
          - Après une réponse 429 ou une erreur réseau sur une requête d'écriture, ne la renvoie pas automatiquement : vérifie d'abord si l'action a malgré tout été appliquée. Si son état est impossible à déterminer, marque l'étape blocked et décris l'incertitude dans actual.
          - N'effectue aucune commande ni aucun paiement réel ou finalisé. Ne supprime pas de données préexistantes et n'effectue pas de nettoyage destructif.
          - Sécurité : lecture seule, aucun fuzzing, aucune injection, aucune attaque active. N'essaie pas de contourner l'authentification ni d'accéder à des données protégées.
          - Toute étape failed doit contenir une preuve directe dans evidence : code HTTP, extrait de console ou réseau, ou capture enregistrée dans screenshots/ sous le nom TC-XXX-stepN.png. N'utilise pas uniquement ton interprétation comme preuve.
          - N'appelle pas failed un résultat causé par une limitation externe ou un manque de preuve : utilise blocked. N'invente rien. Si tu n'as pas vérifié, utilise blocked ou skipped et explique pourquoi dans actual.
          - Ne change pas les données observées pour faire passer un test. Distingue explicitement les faits observés des hypothèses sur leur cause.

          PLAN DE TEST (format : action | résultat attendu)

          TC-001 [functional] Chargement et navigation
            1. Ouvrir l'accueil | page chargée, contenu principal visible, aucune erreur console bloquante
            2. Cliquer sur 3 liens du menu principal | chaque lien mène à une page valide (pas d'écran vide)
            3. Ouvrir une URL inexistante (/page-qui-nexiste-pas) | vraie page 404 avec statut HTTP 404

          TC-002 [functional] Parcours panier et commande (skipped si le site ne vend rien)
            1. Ouvrir une fiche produit | fiche affichée sans erreur
            2. Ajouter une unité d'un produit disponible au panier | confirmation et quantité du panier mises à jour
            3. Ouvrir le panier | ligne du produit et totaux cohérents avec l'ajout effectué
            4. Ouvrir le parcours de commande et inspecter l'étape adresse sans soumettre la commande | champs utilisables, aucun identifiant technique à saisir

          TC-003 [functional] Formulaires
            1. Soumettre le formulaire de contact avec un e-mail invalide et vérifier qu'il est refusé par la validation | erreur de champ visible et aucune confirmation de succès
            2. Soumettre une seule fois un message de contact avec des données QA synthétiques | confirmation visible ou réponse d'erreur observée
            3. S'inscrire une seule fois à la newsletter avec une adresse QA synthétique | confirmation visible ou réponse d'erreur observée

          TC-004 [functional] Accès direct aux pages d'authentification
            1. Ouvrir directement la page de connexion identifiée dans la navigation | page et formulaire accessibles
            2. Rafraîchir la page (F5) | même page, aucune erreur 5xx
            3. Créer un compte de test avec des données synthétiques si l'inscription est disponible | confirmation ou erreur observée, sans utiliser d'identité réelle

          TC-005 [accessibility] Mobile et accessibilité de base
            1. Viewport 375x812, ouvrir l'accueil | aucun scroll horizontal, navigation mobile accessible
            2. Contrôler boutons et liens sans texte | chacun a un nom accessible

          TC-006 [security] Routes protégées sans session
            1. Identifier 2 à 3 routes protégées (profil, commandes, dashboard, admin) via les liens et les requêtes réseau | routes identifiées
            2. Les appeler sans session | 401, 403 ou redirection vers la connexion, jamais 200 avec des données

          TC-007 [security] En-têtes HTTP
            1. Lire les en-têtes de la page d'accueil | présence de HSTS, CSP, X-Frame-Options (ou frame-ancestors), X-Content-Type-Options, Referrer-Policy

          TC-008 [security] Fuite d'informations
            1. Inspecter le HTML source et les bundles JS | aucun token, clé secrète ni stack trace
            2. Ouvrir une URL d'API inexistante | aucun message de debug du framework visible

          Les écritures permises pour les tests fonctionnels ne constituent pas une autorisation de contourner les protections, de tester des identifiants tiers, de créer des comptes avec des identités réelles ou de finaliser une commande ou un paiement.
          Tu peux ajouter des cas TC-1xx découverts pendant l'exploration (mets "discovered": true). Attribue un identifiant unique à chaque cas. Les cas peuvent être regroupés par catégorie dans le rapport. Les observations de plusieurs étapes ne deviennent pas des bugs confirmés simplement parce qu'elles ont une cause supposée commune.

          SORTIE : écris UNIQUEMENT le fichier qa_result.json à la racine du dossier de travail,
          sans texte autour, au format suivant :
          {
            "test_cases": [{
              "id": "TC-001", "title": "", "category": "functional|security|accessibility|seo",
              "discovered": false,
              "status": "passed|failed|blocked|skipped",
              "severity": "P0|P1|P2|null",
              "steps": [{
                "n": 1, "action": "", "precondition": "", "expected": "", "actual": "",
                "status": "passed|failed|blocked|skipped",
                "evidence": {"url": "", "http_status": null, "console": "", "network": "", "screenshot": ""}
              }]
            }],
            "side_effects": [],
            "summary": {"passed": 0, "failed": 0, "blocked": 0}
          }
          Le workflow recalculera les statuts de cas et le résumé. Pour chaque étape, renseigne tous les champs du schéma ; actual doit décrire une observation ou la raison du blocage/skip. Pour une étape failed, renseigne une preuve vérifiable dans evidence (http_status, console, network ou screenshot). N'inclus dans side_effects que les écritures réellement effectuées.
          Termine par un seul message : "qa_result.json écrit".
          PROMPT_EOF

          QA_PROMPT=$(cat qa_prompt.txt)
          QA_PROMPT="${QA_PROMPT//__TARGET_URL__/$TARGET_URL}"
          printf '%s' "$QA_PROMPT" > trajectories/qa_prompt.txt
          echo "🤖 Prompt QA transmis ($(printf '%s' "$QA_PROMPT" | wc -c) caractères)"

          # 5. Lancer l'agent
          opencode run -m "$OC_MODEL" "$QA_PROMPT" 2>&1 | tee qa_agent.log
          EXIT_CODE=${PIPESTATUS[0]}

          kill $CHROME_PID 2>/dev/null || true
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Valider le JSON de l'agent et recalculer les statuts nous-mêmes
      # ----------------------------------------------------------
      - name: Valider et normaliser le rapport structuré
        id: report
        if: always()
        shell: bash
        run: |
          set +e

          # Repli : si l'agent n'a pas écrit le fichier, extraire le dernier JSON du log
          [ -s qa_result.json ] || python3 - <<'PY'
          import json
          txt = open("qa_agent.log", encoding="utf-8", errors="ignore").read()
          dec = json.JSONDecoder()
          best = None
          for i, ch in enumerate(txt):
              if ch == "{":
                  try:
                      obj, _ = dec.raw_decode(txt[i:])
                  except ValueError:
                      continue
                  if isinstance(obj, dict) and "test_cases" in obj:
                      best = obj
          if best:
              json.dump(best, open("qa_result.json", "w"), ensure_ascii=False)
          PY

          if jq -e '
            (.test_cases | type == "array" and length > 0)
            and (.side_effects | type == "array")
            and ([.test_cases[].id] | length == (unique | length))
            and all(.test_cases[];
              (.id | type == "string" and length > 0)
              and (.title | type == "string" and length > 0)
              and (.category | . == "functional" or . == "security" or . == "accessibility" or . == "seo")
              and (.discovered | type == "boolean")
              and (.severity == null or .severity == "P0" or .severity == "P1" or .severity == "P2")
              and (.steps | type == "array" and length > 0)
              and ([.steps[].n] | length == (unique | length))
              and all(.steps[];
                (.n | type == "number")
                and (.action | type == "string" and length > 0)
                and (.precondition | type == "string")
                and (.expected | type == "string" and length > 0)
                and (.actual | type == "string" and length > 0)
                and (.status | . == "passed" or . == "failed" or . == "blocked" or . == "skipped")
                and (.evidence | type == "object")
                and (.evidence.url | type == "string")
                and (.evidence.http_status == null or (.evidence.http_status | type == "number"))
                and (.evidence.console | type == "string")
                and (.evidence.network | type == "string")
                and (.evidence.screenshot | type == "string")
                and (if .status == "failed"
                     then ([.evidence.http_status, .evidence.console, .evidence.network, .evidence.screenshot]
                           | any(.[]; . != null and . != ""))
                     else true end)
              )
            )
          ' qa_result.json >/dev/null 2>&1; then
            cp qa_result.json trajectories/qa_result.raw.json
            # Statut de chaque cas et résumé recalculés depuis les étapes (on ne fait pas confiance au LLM)
            jq '
              .test_cases |= map(
                .steps = (.steps // [])
                | .status = (
                    if (.steps | length) == 0 then "blocked"
                    elif any(.steps[]; .status == "failed") then "failed"
                    elif any(.steps[]; .status == "blocked") then "blocked"
                    elif all(.steps[]; .status == "skipped") then "skipped"
                    else "passed" end)
              )
              | .summary = {
                  passed:  ([.test_cases[] | select(.status == "passed")]  | length),
                  failed:  ([.test_cases[] | select(.status == "failed")]  | length),
                  blocked: ([.test_cases[] | select(.status == "blocked")] | length),
                  skipped: ([.test_cases[] | select(.status == "skipped")] | length)
                }
            ' qa_result.json > trajectories/qa_result.json
            echo "valid=true" >> "$GITHUB_OUTPUT"
            jq -r '.summary | "✓ \(.passed) passed, \(.failed) failed, \(.blocked) blocked, \(.skipped) skipped"' trajectories/qa_result.json
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::qa_result.json absent, invalide ou incomplet (IDs uniques, champs obligatoires et preuves des échecs requis) : voir qa_agent.log"
          fi

      - name: Archiver les preuves QA (rapport JSON, screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-proofs-${{ needs.resolve-url.outputs.site_id }}
          path: |
            trajectories/
            videos/
            screenshots/
            qa_agent.log
            qa_result.json
          retention-days: 30

      - name: Envoyer le rapport au Relay & Supabase
        if: always()
        env:
          SITE_ID: ${{ needs.resolve-url.outputs.site_id }}
          TARGET_URL: ${{ needs.resolve-url.outputs.url }}
          AI_MODEL: ${{ github.event.inputs.model || 'opencode:big-pickle' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          REPORT_VALID: ${{ steps.report.outputs.valid }}
        shell: bash
        run: |
          set +e
          if [ -z "${RELAY_URL:-}" ]; then
            echo "RELAY_URL absent, envoi ignoré"
            exit 0
          fi
          case "$SITE_ID" in
            manual-*)
              echo "Lancement manuel par URL (site_id=$SITE_ID) : pas d'envoi au relay"
              exit 0
              ;;
          esac

          TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          if [ "$REPORT_VALID" = "true" ]; then
            PAYLOAD=$(jq -n \
              --slurpfile r trajectories/qa_result.json \
              --arg url "$TARGET_URL" --arg site_id "$SITE_ID" --arg model "$AI_MODEL" \
              --arg run_url "$RUN_URL" --arg ts "$TS" \
              '{status: "COMPLETED",
                message: "Inspection QA terminée",
                report: ($r[0] + {url: $url, site_id: $site_id, model: $model, run_url: $run_url, timestamp: $ts})}')
          else
            PAYLOAD=$(jq -n \
              --arg url "$TARGET_URL" --arg site_id "$SITE_ID" --arg model "$AI_MODEL" \
              --arg run_url "$RUN_URL" --arg ts "$TS" \
              '{status: "ERROR",
                message: "Rapport QA absent ou invalide",
                report: {url: $url, site_id: $site_id, model: $model, run_url: $run_url, timestamp: $ts}}')
          fi

          curl -sS -X POST "$RELAY_URL/sites/$SITE_ID/mark-crawled" \
            -H "x-relay-secret: $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      - name: Résumé dans GitHub Actions
        if: always()
        env:
          TARGET_URL: ${{ needs.resolve-url.outputs.url }}
          AI_MODEL: ${{ github.event.inputs.model || 'opencode:big-pickle' }}
          REPORT_VALID: ${{ steps.report.outputs.valid }}
        shell: bash
        run: |
          {
            echo "## 🎭 Rapport QA structuré"
            echo ""
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| **URL cible** | \`$TARGET_URL\` |"
            echo "| **Modèle IA** | \`$AI_MODEL\` |"

            if [ "$REPORT_VALID" = "true" ]; then
              jq -r '"| **Résultat** | ✅ \(.summary.passed) passed · ❌ \(.summary.failed) failed · ⏸️ \(.summary.blocked) blocked · ➖ \(.summary.skipped) skipped |"' trajectories/qa_result.json
              echo ""
              echo "### Cas de test"
              echo ""
              jq -r '
                "| Cas | Titre | Catégorie | Statut | Sévérité |",
                "| --- | --- | --- | --- | --- |",
                (.test_cases[] |
                  "| \(.id // "-") | \((.title // "") | gsub("\\|"; "/")) | \(.category // "-") | \(if .status == "passed" then "✅ passed" elif .status == "failed" then "❌ failed" elif .status == "skipped" then "➖ skipped" else "⏸️ blocked" end) | \(.severity // "-") |")
              ' trajectories/qa_result.json
              echo ""
              echo "### Étapes en échec"
              echo ""
              jq -r '
                [.test_cases[] | . as $c | .steps[]? | select(.status == "failed")
                  | "- **\($c.id) · étape \(.n)** : \(.action // "") → attendu : \(.expected // "") ; obtenu : \(.actual // "")"]
                | if length == 0 then "Aucune." else .[] end
              ' trajectories/qa_result.json
              echo ""
              echo "### Effets de bord à nettoyer"
              echo ""
              jq -r 'if (.side_effects | length) == 0 then "Aucun." else .side_effects[] | "- \(.)" end' trajectories/qa_result.json
            else
              echo "| **Résultat** | ⚠️ rapport absent ou invalide (voir qa_agent.log) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
